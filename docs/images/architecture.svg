<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Bionic hardware architecture: a host PC drives a Teensy 4.1 which generates the clock and every bus cycle for a real vintage CPU through level shifters and a 48-pin ZIF socket.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- host PC -->
  <rect x="12" y="176" width="104" height="78" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="64" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Host PC</text>
  <text x="64" y="225" text-anchor="middle" fill="#cbd5e1" font-size="11">terminal</text>
  <text x="64" y="240" text-anchor="middle" fill="#cbd5e1" font-size="11">115200 8N1</text>

  <path d="M116,215 L212,215" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="120" y="188" width="88" height="18" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="164" y="201" text-anchor="middle" fill="#e2e8f0" font-size="10">2 serial on USB</text>

  <!-- controller -->
  <rect x="212" y="24" width="232" height="364" rx="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="328" y="48" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Teensy 4.1</text>
  <text x="328" y="66" text-anchor="middle" fill="#bfdbfe" font-size="11">Cortex-M7 @ 600 MHz</text>

  <rect x="228" y="80" width="200" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="328" y="99" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Debugger + CLI</text>
  <text x="328" y="114" text-anchor="middle" fill="#bfdbfe" font-size="10">console · software HALT</text>

  <rect x="228" y="130" width="200" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="328" y="149" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Assembler · Disassembler</text>
  <text x="328" y="164" text-anchor="middle" fill="#bfdbfe" font-size="10">libasm</text>

  <rect x="228" y="180" width="200" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="328" y="199" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Emulated RAM / ROM</text>
  <text x="328" y="214" text-anchor="middle" fill="#bfdbfe" font-size="10">128 kB internal · 16 MB PSRAM</text>

  <rect x="228" y="230" width="200" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="328" y="249" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Emulated peripherals</text>
  <text x="328" y="264" text-anchor="middle" fill="#bfdbfe" font-size="10">MC6850 ACIA · i8251 USART</text>

  <rect x="228" y="280" width="200" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="328" y="299" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Clock + bus-cycle driver</text>
  <text x="328" y="314" text-anchor="middle" fill="#bfdbfe" font-size="10">bit-banged GPIO</text>

  <rect x="228" y="330" width="200" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="328" y="349" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Board identification</text>
  <text x="328" y="364" text-anchor="middle" fill="#bfdbfe" font-size="10">UNI/O, one wire</text>

  <!-- base board interface -->
  <path d="M444,215 L492,215" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="492" y="120" width="124" height="190" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="554" y="146" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Base board</text>

  <rect x="504" y="160" width="100" height="60" rx="6" fill="#475569" stroke="#94a3b8"/>
  <text x="554" y="180" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Level shift</text>
  <text x="554" y="195" text-anchor="middle" fill="#e2e8f0" font-size="10">TXS0108E ×5</text>
  <text x="554" y="210" text-anchor="middle" fill="#e2e8f0" font-size="10">3.3 V to 5 V</text>

  <rect x="504" y="230" width="100" height="60" rx="6" fill="#475569" stroke="#94a3b8"/>
  <text x="554" y="250" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Data bus holder</text>
  <text x="554" y="265" text-anchor="middle" fill="#e2e8f0" font-size="10">SN74ACT1071</text>
  <text x="554" y="280" text-anchor="middle" fill="#e2e8f0" font-size="10">×2</text>

  <path d="M616,215 L696,215" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="622" y="188" width="68" height="18" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="656" y="201" text-anchor="middle" fill="#e2e8f0" font-size="10">48-pin ZIF</text>

  <!-- adapter -->
  <rect x="696" y="60" width="224" height="310" rx="12" fill="#5b3016" stroke="#fb923c" stroke-width="2"/>
  <text x="808" y="86" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">CPU adapter board</text>

  <rect x="712" y="104" width="192" height="76" rx="8" fill="#8a4a1e" stroke="#fb923c"/>
  <text x="808" y="130" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Real vintage CPU</text>
  <text x="808" y="150" text-anchor="middle" fill="#fed7aa" font-size="11">MC6809 · Z80 · TMS9900 …</text>
  <text x="808" y="167" text-anchor="middle" fill="#fed7aa" font-size="10">DIP · PLCC · QFP</text>

  <rect x="712" y="192" width="192" height="52" rx="6" fill="#7c4420" stroke="#fb923c"/>
  <text x="808" y="212" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Identity EEPROM</text>
  <text x="808" y="228" text-anchor="middle" fill="#fed7aa" font-size="10">11AA010 — names the board</text>

  <rect x="712" y="256" width="192" height="52" rx="6" fill="#7c4420" stroke="#fb923c"/>
  <text x="808" y="276" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Power, as the part demands</text>
  <text x="808" y="292" text-anchor="middle" fill="#fed7aa" font-size="10">+12 V · −5 V · multi-phase clock</text>

  <rect x="712" y="320" width="192" height="34" rx="6" fill="#7c4420" stroke="#fb923c"/>
  <text x="808" y="341" text-anchor="middle" fill="#fed7aa" font-size="10">Address mux for wide address spaces</text>
</svg>
