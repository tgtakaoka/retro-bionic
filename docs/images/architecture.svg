<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Bionic hardware architecture: a host PC drives a Teensy 4.1 which generates the clock and every bus cycle for a real vintage CPU through level shifters and a 48-pin ZIF socket.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- host PC -->
  <rect x="12" y="176" width="104" height="78" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="64" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Host PC</text>
  <text x="64" y="225" text-anchor="middle" fill="#cbd5e1" font-size="11">terminal</text>
  <text x="64" y="240" text-anchor="middle" fill="#cbd5e1" font-size="11">115200 8N1</text>

  <path d="M120,215 L168,215" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="118" y="188" width="52" height="18" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="144" y="201" text-anchor="middle" fill="#e2e8f0" font-size="10">USB ×2</text>

  <!-- controller -->
  <rect x="172" y="24" width="268" height="382" rx="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="306" y="48" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Teensy 4.1</text>
  <text x="306" y="66" text-anchor="middle" fill="#bfdbfe" font-size="11">Cortex-M7 @ 600 MHz</text>

  <rect x="188" y="80" width="236" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="306" y="99" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Debugger + CLI</text>
  <text x="306" y="114" text-anchor="middle" fill="#bfdbfe" font-size="10">console · software HALT</text>

  <rect x="188" y="130" width="236" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="306" y="149" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Assembler · Disassembler</text>
  <text x="306" y="164" text-anchor="middle" fill="#bfdbfe" font-size="10">libasm</text>

  <rect x="188" y="180" width="236" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="306" y="199" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Emulated RAM / ROM</text>
  <text x="306" y="214" text-anchor="middle" fill="#bfdbfe" font-size="10">128 kB internal · 16 MB PSRAM</text>

  <rect x="188" y="230" width="236" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="306" y="249" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Emulated peripherals</text>
  <text x="306" y="264" text-anchor="middle" fill="#bfdbfe" font-size="10">MC6850 ACIA · i8251 USART</text>

  <rect x="188" y="280" width="236" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="306" y="299" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Clock + bus-cycle driver</text>
  <text x="306" y="314" text-anchor="middle" fill="#bfdbfe" font-size="10">bit-banged GPIO</text>

  <rect x="188" y="330" width="236" height="42" rx="6" fill="#2a4d7a" stroke="#60a5fa"/>
  <text x="306" y="349" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Board identification</text>
  <text x="306" y="364" text-anchor="middle" fill="#bfdbfe" font-size="10">UNI/O, one wire</text>

  <!-- base board interface -->
  <path d="M444,215 L504,215" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="508" y="120" width="128" height="190" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="572" y="146" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Base board</text>

  <rect x="522" y="160" width="100" height="60" rx="6" fill="#475569" stroke="#94a3b8"/>
  <text x="572" y="180" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Level shift</text>
  <text x="572" y="195" text-anchor="middle" fill="#e2e8f0" font-size="10">TXS0108E ×6</text>
  <text x="572" y="210" text-anchor="middle" fill="#e2e8f0" font-size="10">3.3 V to 5 V</text>

  <rect x="522" y="230" width="100" height="60" rx="6" fill="#475569" stroke="#94a3b8"/>
  <text x="572" y="250" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Bus hold</text>
  <text x="572" y="265" text-anchor="middle" fill="#e2e8f0" font-size="10">SN74ACT1071</text>
  <text x="572" y="280" text-anchor="middle" fill="#e2e8f0" font-size="10">×7</text>

  <path d="M640,215 L700,215" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="632" y="188" width="76" height="18" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="670" y="201" text-anchor="middle" fill="#e2e8f0" font-size="10">48-pin ZIF</text>

  <!-- adapter -->
  <rect x="704" y="60" width="224" height="310" rx="12" fill="#5b3016" stroke="#fb923c" stroke-width="2"/>
  <text x="816" y="86" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">CPU adapter board</text>

  <rect x="720" y="104" width="192" height="76" rx="8" fill="#8a4a1e" stroke="#fb923c"/>
  <text x="816" y="130" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Real vintage CPU</text>
  <text x="816" y="150" text-anchor="middle" fill="#fed7aa" font-size="11">MC6809 · Z80 · TMS9900 …</text>
  <text x="816" y="167" text-anchor="middle" fill="#fed7aa" font-size="10">DIP · PLCC · QFP</text>

  <rect x="720" y="192" width="192" height="52" rx="6" fill="#7c4420" stroke="#fb923c"/>
  <text x="816" y="212" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Identity EEPROM</text>
  <text x="816" y="228" text-anchor="middle" fill="#fed7aa" font-size="10">11AA010 — names the board</text>

  <rect x="720" y="256" width="192" height="52" rx="6" fill="#7c4420" stroke="#fb923c"/>
  <text x="816" y="276" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Power, as the part demands</text>
  <text x="816" y="292" text-anchor="middle" fill="#fed7aa" font-size="10">+12 V · −5 V · multi-phase clock</text>

  <rect x="720" y="320" width="192" height="34" rx="6" fill="#7c4420" stroke="#fb923c"/>
  <text x="816" y="341" text-anchor="middle" fill="#fed7aa" font-size="10">Address mux for wide address spaces</text>

  <!-- bus caption -->
  <rect x="428" y="384" width="232" height="34" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="544" y="398" text-anchor="middle" fill="#e2e8f0" font-size="10">48 signals: address · data · control</text>
  <text x="544" y="412" text-anchor="middle" fill="#94a3b8" font-size="10">clock and every bus cycle driven by the host</text>
</svg>
