<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Bionic cast</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.15.1/dist/bundle/asciinema-player.css">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --link: #4493f8; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; overflow-wrap: anywhere; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--link); }
  #error { color: #d1242f; }
</style>
</head>
<body>
<main>
  <h1 id="name">cast</h1>
  <p><a id="source" href="https://github.com/tgtakaoka/retro-bionic">source</a></p>
  <div id="player"></div>
  <p id="error" hidden></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.15.1/dist/bundle/asciinema-player.min.js"></script>
<script>
  // play.html?cast=samples/<arch>/<name>.cast[&ref=<branch>] plays a cast
  // from the repository.
  const REPO = 'tgtakaoka/retro-bionic';
  const params = new URLSearchParams(location.search);
  const cast = params.get('cast') || '';
  const ref = params.get('ref') || 'main';
  const error = (text) => {
    const e = document.getElementById('error');
    e.textContent = text;
    e.hidden = false;
  };
  if (!/^[\w.-]+(\/[\w.-]+)*\.cast$/.test(cast) || cast.split('/').includes('..')
      || !/^[\w.\/-]+$/.test(ref)) {
    document.getElementById('source').hidden = true;
    error('Give a cast as play.html?cast=samples/<arch>/<name>.cast');
  } else {
    document.title = cast + ' - Retro Bionic';
    document.getElementById('name').textContent = cast;
    const source = document.getElementById('source');
    source.href = `https://github.com/${REPO}/blob/${ref}/${cast}`;
    source.textContent = `${cast} on GitHub`;
    AsciinemaPlayer.create(`https://raw.githubusercontent.com/${REPO}/${ref}/${cast}`,
                           document.getElementById('player'),
                           { fit: 'width', preload: true });
  }
</script>
</body>
</html>
