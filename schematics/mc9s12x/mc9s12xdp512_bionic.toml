# MC9S12XDP512 QFP definition
# https://github.com/tgtakaoka/dip
# ADDR0-ADDR22 share P30-P37 through four 74HCS153, selected by P54
# (ASEL0) and P55 (ASEL1): 00 A0-A3/A16-A19, 01 A4-A7/A20-A22,
# 10 A12-A15, 11 A8-A11
# XCLKS is pulled down by 10k; XFC is pulled up to VDDPLL by 2.2k
# P47 drives EXTAL through a 74LVC1G17 on its own 2.5 V LDO: EXTAL is a
# VDDPLL-level pin (3.0 V max)
# TEST and VRL are tied low; VREGEN and VRH are tied high
name = "MC9S12XDP512"
title = "MC9S12XDP512"
qfp = 144
pin1 = "bottom-left"
