# N80C286 PLCC definition
# https://github.com/tgtakaoka/dip
# A0-A23 reach P30-P37 through four 74HCS153, selected by P54/P55 (ASEL1:ASEL0):
# P30-P33 phase 00 A0-A3, 01 A4-A7, 10 A12-A15, 11 A8-A11
# P34-P37 phase 00 A16-A19, 01 A20-A23, 10 #LOCK, HLDA, #PEACK (11 and P37 phase 10 = GND)
# A 74HCT259 holds HOLD (Q0), NMI (Q1), INTR (Q2) and the N80287XL's #NPS1 (Q3):
# data P45, strobe P52, select P54/P55, S2 = G
# On BionicN80287XL: PEREQ, #BUSY and #ERROR come from the N80287XL; CAP has 0.047u to VSS (HMOS compatibility)
name = "80C286"
title = "N80C286"
plcc = 68
pin1 = "top-center"
  1 = "P43, #BHE"
  2 = ",    NC"
  3 = ",    NC"
