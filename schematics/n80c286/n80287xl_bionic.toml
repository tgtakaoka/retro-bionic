# N80287XL PLCC definition
# https://github.com/tgtakaoka/dip
# Beside an N80C286 on BionicN80287XL: D0-D15, RESET, PEREQ, #PEACK, #BUSY
# and #ERROR are the CPU's; NPS2 = H, CKM = H: CLK is its own 12 MHz oscillator
# (X1), asynchronous to the 286
# CMD0/CMD1 are A1/A2, #NPS1 is 74HCT259 Q3, #NPRD/#NPWR are Teensy outputs
name = "287XL"
title = "N80287XL"
plcc = 44
pin1 = "top-center"
  1 = "VCC, VCC"
  2 = "GND, VSS"
  3 = "VCC, VCC"
  4 = "GND, VSS"
  5 = "P27, D15"
  6 = ",    NC"
  7 = "P26, D14"
  8 = "P25, D13"
  9 = "P24, D12"
 10 = "VCC, VCC"
 11 = ",    NC"
 12 = "GND, VSS"
 13 = "P23, D11"
 14 = "P22, D10"
 15 = "VCC, VCC"
 16 = "P21, D9"
 17 = "P20, D8"
 18 = "P17, D7"
 19 = "P16, D6"
 20 = "P15, D5"
 21 = "P14, D4"
 22 = "P13, D3"
 23 = ",    NC"
 24 = "P12, D2"
 25 = "P11, D1"
 26 = "P10, D0"
 27 = ",    PEREQ"
 28 = ",    #BUSY"
 29 = ",    #ERROR"
 30 = "P50, #NPRD"
 31 = "P51, #NPWR"
 32 = "P31, CMD0"
 33 = ",    NC"
 34 = "GND, VSS"
 35 = "P32, CMD1"
 36 = ",    CLK"
 37 = "VCC, NPS2"
 38 = "Q3, #NPS1"
 39 = "P53, RESET"
 40 = ",    NC"
 41 = "P36, #PEACK"
 42 = "VCC, VCC"
 43 = "GND, VSS"
 44 = "VCC, CKM"
