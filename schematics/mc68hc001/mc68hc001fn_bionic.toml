# MC68HC001FN PLCC definition
# https://github.com/tgtakaoka/dip
# A8-A23 share P30-P37 through two 74AHCT157, selected by P54 (ASEL):
# 0 A8-A11/A16-A19, 1 A12-A15/A20-A23
# #IPL2 and #IPL0 are tied together; #BR, #BGACK and #VPA are tied high
# MODE is tied low for the 8-bit bus; #UDS and D8-D15 are left open
name = "MC68HC001FN"
title = "MC68HC001FN"
plcc = 68
pin1 = "top-center"
  1 = "P14, D4"
  2 = "P13, D3"
  3 = "P12, D2"
  4 = "P11, D1"
  5 = "P10, D0"
