# TMS320C32PCM QFP definition
# https://github.com/tgtakaoka/dip
# DRAFT: no board yet.
# PRGW is tied high: a 16-bit external bus, D0-D15, with STRBx_B3/A-1 as
# the halfword address LSB. The halfword address H0-H24 (H0 = A-1,
# Hn = A(n-1)) shares P30-P37 through four 74HCS153, selected by P54
# (ASEL0) and P55 (ASEL1): 00 H0-H3/H16-H19, 01 H4-H7/H20-H23,
# 11 H8-H11/H24, 10 H12-H15.
# The spare mux slots carry one-way status: P34/10 #IACK, P35/10 XF0,
# P35/11 #STRB1_B3/A-1, P36/10 XF1, P36/11 #STRB0_B1, P37/11 #STRB1_B1;
# P37/10 is free.
# CLKIN (P47) must run in hardware: tc(CI) is 303 ns at most.
# MCBL/#MP is grounded (microprocessor mode); #SHZ, #INT2 and #INT3 are
# tied high; EMU0-EMU2 have 22k pull-ups as the datasheet asks.
# XF0, TCLK0/TCLK1 and the serial-port pins are bidirectional and reset
# as inputs, so each has a 10k pull-up. XF1 has a 10k pull-down instead:
# it acknowledges the interlock request on XF0 at once, so LDFI, LDII and
# SIGI complete with a single C32. D16-D31 are unused and pulled up by
# 10k networks.
