# N80C186XL PLCC definition
# https://github.com/tgtakaoka/dip
# #RD/#QSMD is on P34: held low through reset it selects queue status mode, where
# ALE and #WR carry QS0 and QS1 (P40, P41) and there is no ALE, #RD or #WR; left
# as an input it reads #RD in normal mode. #S0, #S1 (P42, P43), #S2 (P46) and
# P40/P41 are all on GPIO9, so one read gives the bus status. ALE/QS0 also
# reaches P36, a FlexIO3 pad, to latch AD0-AD15 (P10-P27) on ALE; #LOCK is open.
# AD0-AD15 and A16-A19 are direct (P10-P27, P30-P33). X1 (P47) is driven by the
# Teensy; CLKOUT (P44) is X1/2.
# #DEN (P45) marks when AD carries data. INT0 (P51) is the maskable
# interrupt, in cascade mode; INT1 is tied low.
# INT2 and INT3 have 10k pull-downs.
name = "80C186XL"
title = "N80C186XL"
plcc = 68
pin1 = "top-center"
  1 = "P27, AD15"
  2 = "P17, AD7"
  3 = "P26, AD14"
  4 = "P16, AD6"
  5 = "P25, AD13"
  6 = "P15, AD5"
  7 = "P24, AD12"
  8 = "P14, AD4"
  9 = "VCC, VCC"
 10 = "P23, AD11"
 11 = "P13, AD3"
 12 = "P22, AD10"
 13 = "P12, AD2"
