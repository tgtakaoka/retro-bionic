# N80C187 PLCC definition
# https://github.com/tgtakaoka/dip
# Beside an N80C186XL on BionicN80C187: D0-D15, RESET, PEREQ, BUSY and #ERROR are
# the CPU's; NPS2 = H, CKM = H: CLK is its own 12 MHz oscillator (X1),
# asynchronous to the 186. CMD0/CMD1 = #PCS5/A1, #PCS6/A2, #NPS1 = #MCS3/#NPS;
# #NPRD/#NPWR come from the 74AHC139 or #RD/#WR (JP1/JP2), not from the Teensy
name = "80C187"
title = "N80C187"
plcc = 44
pin1 = "top-center"
  1 = "VCC, VCC"
  2 = "GND, VSS"
  3 = "VCC, VCC"
  4 = "GND, VSS"
  5 = "P27, D15"
  6 = ",    NC"
  7 = "P26, D14"
  8 = "P25, D13"
  9 = "P24, D12"
 10 = "VCC, VCC"
 11 = ",    NC"
 12 = "GND, VSS"
 13 = "P23, D11"
 14 = "P22, D10"
 15 = "VCC, VCC"
 16 = "P21, D9"
 17 = "P20, D8"
 18 = "P17, D7"
 19 = "P16, D6"
 20 = "P15, D5"
 21 = "P14, D4"
 22 = "P13, D3"
 23 = ",    NC"
 24 = "P12, D2"
 25 = "P11, D1"
 26 = "P10, D0"
 27 = ",    PEREQ"
 28 = "P37, BUSY"
 29 = ",    #ERROR"
 30 = ",    #NPRD"
 31 = ",    #NPWR"
 32 = ",    CMD0"
 33 = ",    NC"
 34 = "GND, VSS"
 35 = ",    CMD1"
 36 = ",    CLK"
 37 = "VCC, NPS2"
 38 = ",    #NPS1"
 39 = ",    RESET"
 40 = ",    NC"
 41 = "GND, VSS"
 42 = "VCC, VCC"
 43 = "GND, VSS"
 44 = "VCC, CKM"
