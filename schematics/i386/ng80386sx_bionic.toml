# NG80386SX QFP definition
# https://github.com/tgtakaoka/dip
# A1-A23 and #BLE reach P30-P37 through four 74HCS153, selected by P54/P55 (ASEL1:ASEL0):
# P30-P33 phase 00 #BLE, A1-A3, 01 A4-A7, 10 A12-A15, 11 A8-A11
# P34-P37 phase 00 A16-A19, 01 A20-A23, 10 #LOCK, HLDA (P36/P37 phase 10 and phase 11 = GND)
# A 74HCT259 holds INTR (Q0), NMI (Q1) and HOLD (Q2): data P45, strobe P52, select P54/P55, S2 = G
# #NA, #FLT, #BUSY and #ERROR are tied high, PEREQ low
name = "80386SX"
title = "NG80386SX"
qfp = 100
pin1 = "left-top"
  1 = "P10, D0"
  2 = "GND, VSS"
  3 = "P35, HLDA"
  4 = "Q2, HOLD"
  5 = "GND, VSS"
  6 = "VCC, #NA"
  7 = "P44, #READY"
  8 = "VCC, VCC"
  9 = "VCC, VCC"
