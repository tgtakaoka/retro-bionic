# N80387SX PLCC definition
# https://github.com/tgtakaoka/dip
# Beside an NG80386SX on BionicN80387SX: D0-D15, CPUCLK2 (CLK2), RESETIN (RESET),
# #ADS, W/#R and #READY are the CPU's; #BUSY, PEREQ and #ERROR go to the CPU only
# #NPS1 = M/#IO, NPS2 = A23 (P37 phase 01), #CMD0 = A2 (P32 phase 00): I/O 8000F8-8000FF
# CKM = H (synchronous, CPUCLK2 period to DC), NUMCLK2 = G, STEN = H; #READYO goes to P51
name = "387SX"
title = "N80387SX"
plcc = 68
pin1 = "top-center"
  1 = ",    NC"
  2 = "P17, D7"
