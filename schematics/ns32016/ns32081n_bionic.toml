# NS32081N DIP definition
# https://github.com/tgtakaoka/dip
# Beside an NS32016 on BionicNS32081: D0-D15 share AD0-AD15, ST0/ST1, #SPC
# and #RST are the CPU's; CLK is ~CLK (P46) from the 74LVC02, in phase with PHI1
name = "NS32081N"
dip = 24
width = 600
  1 = "P22, D10"
  2 = "P21, D9"
  3 = "P20, D8"
  4 = "P17, D7"
  5 = "P16, D6"
  6 = "P15, D5"
  7 = "P14, D4"
  8 = "P13, D3"
  9 = "P12, D2"
 10 = "P11, D1"
 11 = "P10, D0"
 12 = "GND, GNDL"
 13 = "GND, GNDB"
 14 = "P46, CLK"
 15 = "P53, #RST"
 16 = "P27, D15"
 17 = "P26, D14"
 18 = "P25, D13"
 19 = "P24, D12"
 20 = "P23, D11"
 21 = ",    #SPC"
 22 = "P35, ST1"
 23 = "P34, ST0"
 24 = "VCC, VCC"
