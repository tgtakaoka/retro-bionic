# MC68030FE QFP definition
# https://github.com/tgtakaoka/dip
# A 16-bit port on D16-D31 (#DSACK1); D0-D15 are unconnected
# A0-A31 reach P30-P37 through four 74HCS153, selected by P54/P55 (ASEL1:ASEL0):
# P30-P33 phase 00 A0-A3, 01 A4-A7, 10 A12-A15, 11 A8-A11
# P34-P37 phase 00 A16-A19, 01 A20-A23, 10 A28-A31, 11 A24-A27
# A fifth 74HCS153: P50 FC0, FC1, FC2 (phase 11 = GND), P51 SIZ0, SIZ1, #RMC, #IPEND
# A 74HCT259 holds #IPL0-#IPL2 (Q0-Q2) and #BERR (Q3): data P45, strobe P52, select P54/P55, S2 = G
# On BionicMC68882: #DSACK1 = P44 AND the MC68882's #DSACK1 (74AHCT1G08)
# #DSACK0, #STERM, #AVEC, #CBACK, #CIIN, #CDIS, #MMUDIS, #BR and #BGACK are tied high
# #BG, #ECS, #DBEN, #CIOUT, #CBREQ, #STATUS and #REFILL are unconnected
