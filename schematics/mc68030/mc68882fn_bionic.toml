# MC68882FN PLCC definition
# https://github.com/tgtakaoka/dip
# Beside an MC68030FE on BionicMC68882, on a 16-bit port: SIZE = H, A0 = G,
# D0-D15 and D16-D31 both on the CPU's D16-D31; A1-A4, #AS, #DS, R/#W and #RESET are the CPU's
# #CS = 74HCT688 on FC0-FC2, A13, A16-A19 = 1,1,1,1,0,1,0,0 (CPU space, coprocessor ID 1)
# #DSACK1 (10k pull-up) is ANDed with P44 into the CPU's #DSACK1; #DSACK0 and #SENSE are unconnected
# CLK is its own 32 MHz oscillator (X1), asynchronous to the CPU
name = "MC68882FN"
title = "MC68882FN"
plcc = 68
pin1 = "top-center"
  1 = "P12, D2"
  2 = "P11, D1"
  3 = "P10, D0"
  4 = ",    #SENSE"
  5 = "GND, GND"
  6 = "GND, GND"
  7 = "GND, GND"
  8 = "GND, GND"
  9 = "GND, GND"
 10 = "VCC, VCC"
 11 = ",    CLK"
 12 = "GND, GND"
 13 = "P53, #RESET"
 14 = "GND, GND"
