# MC9S12DG128B QFP definition
# https://github.com/tgtakaoka/dip
# VDD1, VDD2 and VDDPLL are the on-chip regulator outputs (VREGEN high);
# they take only their 0.1u caps; XFC is pulled up to VDDPLL by 2.2k
# XCLKS is pulled low by 10k: EXTAL takes an external clock from POR on
# P46 drives EXTAL through a 74LVC1G17 on its own 2.5 V LDO: EXTAL is a
# VDDPLL-level pin (3.0 V max)
# TEST and VRL are tied low; VREGEN and VRH are tied high
