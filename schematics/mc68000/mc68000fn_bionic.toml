# MC68000FN PLCC definition
# https://github.com/tgtakaoka/dip
# Also MC68010FN, MC68HC000FN and MC68HC001FN; pins 18 (MODE) and 31 (A0) are NC except on the MC68HC001
# A0-A23 and FC0-FC2 reach P30-P37 through four 74HCS153, selected by P54/P55 (ASEL1:ASEL0):
# P30-P33 phase 00 A0-A3 (MC68HC001 only), 01 A4-A7, 10 A12-A15, 11 A8-A11
# P34-P37 phase 00 A16-A19, 01 A20-A23, 10 FC0-FC2 and MODE (P37)
# #BR, #VPA and #BGACK are tied high; #BG, E and #VMA are unconnected
# MODE: 10k pull-up (16-bit), solder jumper JP1 to GND (MC68HC001 8-bit); read on P37 phase 10
# A0: 10k pull-down; the MC68HC001 drives it high in 16-bit mode
name = "MC68000FN"
title = "MC68000FN"
plcc = 68
pin1 = "top-center"
  1 = "P14, D4"
  2 = "P13, D3"
  3 = "P12, D2"
  4 = "P11, D1"
  5 = "P10, D0"
  6 = "P40, #AS"
  7 = "P42, #UDS"
  8 = "P43, #LDS"
  9 = "P41, R/#W"
 10 = "P44, #DTACK"
