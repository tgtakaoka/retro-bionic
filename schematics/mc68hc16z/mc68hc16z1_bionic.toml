# MC68HC16Z1 QFP definition
# https://github.com/tgtakaoka/dip
# ADDR0-ADDR23, SIZ0-SIZ1 and FC0-FC2 share P30-P37 through four
# 74HCS153, selected by P54 (ASEL0) and P55 (ASEL1): 00 A0-A3/A16-A19,
# 01 A4-A7/A20-A23, 10 A12-A15/SIZ0-SIZ1, 11 A8-A11/FC0-FC2
# #HALT, #BERR, #BR and #BGACK are pulled up by 10k
# TSC, MODCLK, #AVEC and VSTBY are tied low; #IRQ2-#IRQ6 and #BKPT are tied high
# The Teensy holds DATA1, DATA2 and DATA7 low at reset: #BR/#BG/#BGACK,
# FC0-FC2 and ADDR19-ADDR23 instead of chip-selects
name = "MC68HC16Z1"
title = "MC68HC16Z1"
qfp=144
pin1 = "bottom-left"
  1 = ",    NC"
  2 = ",    #BG, #CS1"
  3 = ",    #BGACK, #CS2"
  4 = "P37, ADDR19, #CS6, PC3"
  5 = "P34, ADDR20, #CS7, PC4"
  6 = "P35, ADDR21, #CS8, PC5"
  7 = "P36, ADDR22, #CS9, PC6"
