# DCJ11 DIP definition
# https://github.com/tgtakaoka/dip
# DRAFT: no board yet.
# #TEST2 is grounded, so CLK1 is a MOS clock input (VIH 0.7 Vcc) driven
# by P47, as P47 drives the Z8000's CLOCK; XTALI, XTALO and CLK2 stay
# open. No document gives a maximum clock period and the data chip
# precharges its register files, so a slow clock is unproven.
# DAL16-DAL21, BS0/BS1 and AIO0-AIO3 share P30-P33 through two
# 74HCS153, selected by P54 (S0) and P55 (S1): 0 DAL16-DAL19,
# 1 DAL20/DAL21/BS0/BS1, 2 AIO0-AIO3. All of them are valid only in the
# first part of a cycle, while ALE is asserted.
# #ALE, #SCTL and #BUFCTL sit on FlexIO3 pads P34-P36, for a FlexIO bus
# engine: the address latch, write data and the read-data gate.
# A 74HCT259 holds the slow inputs: data P45, strobe P52, select P54
# (S0), P55 (S1), P51 (S2); "Qn" marks its outputs. It powers up random,
# so all eight bits are written before #INIT is released.
# IRQ0-IRQ3 request levels 4-7; #EVENT is a level 6 trap to 100.
# #MISS forces a memory read to stretch, which an external #ABORT needs.
# #ABORT is open drain with an internal pull-up and is driven by both
# sides. #DMR, #PARITY and #FPE are tied high.
name = "DCJ11"
title = "DCJ11"
dip = 60
width = 1300
  1 = "VCC, #TEST1"
  2 = "P30, AIO0"
