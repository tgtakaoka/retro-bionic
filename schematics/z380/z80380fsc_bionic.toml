# Z80380FSC QFP definition
# https://github.com/tgtakaoka/dip
# A0-A31 share P30-P37 through four 74HCS153, selected by P44 (ASEL0) and
# P45 (ASEL1): 00 A0-A3/A16-A19, 01 A4-A7/A20-A23, 11 A8-A11/A24-A27,
# 10 A12-A15/A28-A31
# #MSIZE is pulled up by 10k (word-wide memory); JP1 grounds it
# CLKSEL is tied high (direct clock on CLKI)
# #BREQ and #INT1-#INT3 are tied high
name = "Z380"
title = "Z80380FSC"
qfp = "30x20"
pin1 = "bottom-left"
  1 = "P31, A5"
  2 = "P30, A4"
  3 = "P33, A3"
  4 = "P32, A2"
  5 = "P31, A1"
  6 = "P30, A0"
