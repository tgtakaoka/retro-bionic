# N80C186XL PLCC definition
# https://github.com/tgtakaoka/dip
# DRAFT: no board yet.
# AD0-AD15 and A16-A19 are direct (P10-P27, P30-P33); no address mux.
# #RD, #WR, #S0, #S1 and #S2 sit on GPIO9 (P40-P43, P46), so one port
# read gives the bus cycle type. ALE, #BHE and #LOCK come in with
# A16-A19 on GPIO7 (P34-P36).
# X1 (P47) is driven by the Teensy; the 80C186XL is fully static, and
# CLKOUT (P44) tells which X1 edge starts a CLKOUT phase.
# ARDY (P52) ends a bus cycle; SRDY is grounded.
# INT0 (P51) and INT1 (P45) are the device interrupts, NMI is P50.
# DRQ0, DRQ1, TMRIN0 and TMRIN1 are grounded.
# Bidirectional pins never reach the Teensy: INT2/#INTA0 and
# INT3/#INTA1 have 10k pull-downs; #UCS and #LCS (sampled for ONCE
# mode) and #MCS0/PEREQ, #MCS1/#ERROR (80C187 interface) have 10k
# pull-ups. #RD/#QSMD must not be held low at reset, or the bus enters
# queue status mode.
# The 80C187 coprocessor is not fitted.
