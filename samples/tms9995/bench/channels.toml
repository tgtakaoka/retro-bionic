# Channel labels for the TMS9995, checked against a reset: #MEMEN frames
# each memory access, #DBIN and #WE pulse twice for each word moved a byte
# at a time, IAQ marks the fetches (the debugger's injected C820 and 10FC
# read right), CLKIN is the clock the debugger drives and CLKOUT follows at
# a quarter of it, and #RESET pulses low. D0 is the MSB: channel 0 is D7.
# Verify against the wiring before trusting it -- a lead moved on the bench
# leaves this stale.
[tms9995]
 0 = { pin = "P10", signal = "D7" }
 1 = { pin = "P11", signal = "D6" }
 2 = { pin = "P12", signal = "D5" }
 3 = { pin = "P13", signal = "D4" }
 4 = { pin = "P14", signal = "D3" }
 5 = { pin = "P15", signal = "D2" }
 6 = { pin = "P16", signal = "D1" }
 7 = { pin = "P17", signal = "D0" }
 8 = { pin = "P40", signal = "#MEMEN" }
 9 = { pin = "P41", signal = "#DBIN" }
10 = { pin = "P42", signal = "#WE" }
11 = { pin = "P43", signal = "IAQ" }
12 = { pin = "P46", signal = "CLKIN" }
13 = { pin = "P47", signal = "CLKOUT" }
14 = { pin = "P54", signal = "READY" }
15 = { pin = "P53", signal = "#RESET" }
