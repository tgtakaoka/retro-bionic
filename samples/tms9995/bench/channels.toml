# Channel labels for the TMS9995, checked against a reset: #MEMEN frames
# each memory access, #DBIN and #WE pulse twice for each word moved a byte
# at a time, IAQ marks the fetches (the debugger's injected C820 and 10FC
# read right), CLKIN is the clock the debugger drives and CLKOUT follows at
# a quarter of it, and #RESET pulses low. D0 is the MSB: channel 0 is D7.
# Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale. '# Pxx' comments are that channel's pin name on
# the Bionic Connector.
[tms9995]
 0 = "D7"      # P10
 1 = "D6"      # P11
 2 = "D5"      # P12
 3 = "D4"      # P13
 4 = "D3"      # P14
 5 = "D2"      # P15
 6 = "D1"      # P16
 7 = "D0"      # P17
 8 = "#MEMEN"  # P40
 9 = "#DBIN"   # P41
10 = "#WE"     # P42
11 = "IAQ"     # P43
12 = "CLKIN"   # P46
13 = "CLKOUT"  # P47
14 = "READY"   # P54
15 = "#RESET"  # P53
