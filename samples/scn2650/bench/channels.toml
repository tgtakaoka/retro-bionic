# Channel labels for the SCN2650, checked against a reset: RESET (active
# high) pulses, OPREQ pulses for every operation and #OPACK answers it,
# M/#IO and #R/W mark memory reads and writes with the data on DBUS0-7, and
# CLOCK runs throughout. Verify against the wiring before trusting it -- a
# lead moved on the bench leaves this stale.
[scn2650]
 0 = { pin = "P10", signal = "DBUS0" }
 1 = { pin = "P11", signal = "DBUS1" }
 2 = { pin = "P12", signal = "DBUS2" }
 3 = { pin = "P13", signal = "DBUS3" }
 4 = { pin = "P14", signal = "DBUS4" }
 5 = { pin = "P15", signal = "DBUS5" }
 6 = { pin = "P16", signal = "DBUS6" }
 7 = { pin = "P17", signal = "DBUS7" }
 8 = { pin = "P40", signal = "M/#IO" }
 9 = { pin = "P41", signal = "#R/W" }
10 = { pin = "P42", signal = "#INTREQ" }
11 = { pin = "P43", signal = "INTACK" }
12 = { pin = "P46", signal = "CLOCK" }
13 = { pin = "P50", signal = "OPREQ" }
14 = { pin = "P53", signal = "RESET" }
15 = { pin = "P55", signal = "#OPACK" }
