# Channel labels for the SCN2650, checked against a reset: RESET (active
# high) pulses, OPREQ pulses for every operation and #OPACK answers it,
# M/#IO and #R/W mark memory reads and writes with the data on DBUS0-7,
# and CLOCK runs throughout. Verify against the wiring before trusting it
# -- a lead moved on the bench leaves this stale. '# Pxx' comments are that
# channel's pin name on the Bionic Connector.
[scn2650]
 0 = "DBUS0"    # P10
 1 = "DBUS1"    # P11
 2 = "DBUS2"    # P12
 3 = "DBUS3"    # P13
 4 = "DBUS4"    # P14
 5 = "DBUS5"    # P15
 6 = "DBUS6"    # P16
 7 = "DBUS7"    # P17
 8 = "M/#IO"    # P40
 9 = "#R/W"     # P41
10 = "#INTREQ"  # P42
11 = "INTACK"   # P43
12 = "CLOCK"    # P46
13 = "OPREQ"    # P50
14 = "RESET"    # P53
15 = "#OPACK"   # P55
