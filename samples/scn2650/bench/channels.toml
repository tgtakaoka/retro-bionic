# Channel labels for the SCN2650, speculated from the Bionic Connector's
# pinout (data bus low byte plus the bus-cycle status/strobe signals
# judged most useful for debugging) rather than captured from real
# activity. Confirm every channel before trusting it. '# Pxx' comments
# are that channel's pin name on the Bionic Connector.

[scn2650]
 0 = "DBUS0"    # P10
 1 = "DBUS1"    # P11
 2 = "DBUS2"    # P12
 3 = "DBUS3"    # P13
 4 = "DBUS4"    # P14
 5 = "DBUS5"    # P15
 6 = "DBUS6"    # P16
 7 = "DBUS7"    # P17
 8 = "M/#IO"    # P40
 9 = "#R/W"     # P41
10 = "#INTREQ"  # P42
11 = "INTACK"   # P43
12 = "OPREQ"    # P50
13 = "CLOCK"    # P46
14 = "RESET"    # P53
15 = "debug"    # P56
