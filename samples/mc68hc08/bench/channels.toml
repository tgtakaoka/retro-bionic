# Channel labels for the MC68HC08AZ0 board. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[mc68hc08az0]
 0 = { pin = "P10", signal = "ED0" }
 1 = { pin = "P11", signal = "ED1" }
 2 = { pin = "P12", signal = "ED2" }
 3 = { pin = "P13", signal = "ED3" }
 4 = { pin = "P14", signal = "ED4" }
 5 = { pin = "P15", signal = "ED5" }
 6 = { pin = "P16", signal = "ED6" }
 7 = { pin = "P17", signal = "ED7" }
 8 = { pin = "P40", signal = "REB" }
 9 = { pin = "P41", signal = "WEB" }
10 = { pin = "P42", signal = "PTC0" }
11 = { pin = "P46", signal = "MCLK" }
12 = { pin = "P47", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P53", signal = "#RST" }

# Profiling leads, the layout every profiled board shares: drops #RST, PTC0.
[mc68hc08az0-profile]
 0 = { pin = "P10", signal = "ED0" }
 1 = { pin = "P11", signal = "ED1" }
 2 = { pin = "P12", signal = "ED2" }
 3 = { pin = "P13", signal = "ED3" }
 4 = { pin = "P14", signal = "ED4" }
 5 = { pin = "P15", signal = "ED5" }
 6 = { pin = "P16", signal = "ED6" }
 7 = { pin = "P17", signal = "ED7" }
 8 = { pin = "P40", signal = "REB" }
 9 = { pin = "P41", signal = "WEB" }
10 = { pin = "P46", signal = "MCLK" }
11 = { pin = "P47", signal = "OSC1" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "PTH0" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P52", signal = "PTH1" }

# The reset sequence: #RST negates, then the register save.
[mc68hc08az0-reset]
 0 = { pin = "P10", signal = "ED0" }
 1 = { pin = "P11", signal = "ED1" }
 2 = { pin = "P12", signal = "ED2" }
 3 = { pin = "P13", signal = "ED3" }
 4 = { pin = "P14", signal = "ED4" }
 5 = { pin = "P15", signal = "ED5" }
 6 = { pin = "P16", signal = "ED6" }
 7 = { pin = "P17", signal = "ED7" }
 8 = { pin = "P40", signal = "REB" }
 9 = { pin = "P41", signal = "WEB" }
10 = { pin = "P42", signal = "PTC0" }
11 = { pin = "P46", signal = "MCLK" }
12 = { pin = "P47", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RST" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#RST", edge = "rise", before = 50e-6, after = 77e-6 }
display = ["OSC1", "MCLK", "REB", "WEB", "PTC0", "debug", "#IRQ", "#RST", "ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"]
parallel = [
  { data = ["ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"], clock = "REB", edge = "rise" },
  { data = ["ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"], clock = "WEB", edge = "rise" },
]

# Six steps of mandelbrot halted by the halt port, sent as one write:
# each step's restore, cycles and register save.
[mc68hc08az0-step]
 0 = { pin = "P10", signal = "ED0" }
 1 = { pin = "P11", signal = "ED1" }
 2 = { pin = "P12", signal = "ED2" }
 3 = { pin = "P13", signal = "ED3" }
 4 = { pin = "P14", signal = "ED4" }
 5 = { pin = "P15", signal = "ED5" }
 6 = { pin = "P16", signal = "ED6" }
 7 = { pin = "P17", signal = "ED7" }
 8 = { pin = "P40", signal = "REB" }
 9 = { pin = "P41", signal = "WEB" }
10 = { pin = "P42", signal = "PTC0" }
11 = { pin = "P46", signal = "MCLK" }
12 = { pin = "P47", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RST" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "REB", edge = "fall", before = 50e-6, after = 530e-6 }
display = ["OSC1", "MCLK", "REB", "WEB", "PTC0", "debug", "#IRQ", "#RST", "ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"]
parallel = [
  { data = ["ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"], clock = "REB", edge = "rise" },
  { data = ["ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"], clock = "WEB", edge = "rise" },
]

# The echoitr sample's echo of one character: #IRQ asserts for the
# receive, then for each transmit until the last.
[mc68hc08az0-echoitr]
 0 = { pin = "P10", signal = "ED0" }
 1 = { pin = "P11", signal = "ED1" }
 2 = { pin = "P12", signal = "ED2" }
 3 = { pin = "P13", signal = "ED3" }
 4 = { pin = "P14", signal = "ED4" }
 5 = { pin = "P15", signal = "ED5" }
 6 = { pin = "P16", signal = "ED6" }
 7 = { pin = "P17", signal = "ED7" }
 8 = { pin = "P40", signal = "REB" }
 9 = { pin = "P41", signal = "WEB" }
10 = { pin = "P42", signal = "PTC0" }
11 = { pin = "P46", signal = "MCLK" }
12 = { pin = "P47", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RST" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#IRQ", edge = "fall", before = 50e-6, after = 6.20e-3 }
display = ["OSC1", "MCLK", "REB", "WEB", "PTC0", "debug", "#IRQ", "#RST", "ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"]
parallel = [
  { data = ["ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"], clock = "REB", edge = "rise" },
  { data = ["ED0", "ED1", "ED2", "ED3", "ED4", "ED5", "ED6", "ED7"], clock = "WEB", edge = "rise" },
]
