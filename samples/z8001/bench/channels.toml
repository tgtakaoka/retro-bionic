# Channel labels for the Z8001, taken from z8001_bionic.toml, which matches
# the PCB. Not yet checked against the board: verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# P30-P33 carry ST0-ST3 while ASEL is low and SN0-SN3 while it is high,
# through a 74AHCT157; SN4-SN6 have their own pins.
[z8001-reset]
 0 = { pin = "P30", signal = "ST0/SN0" }
 1 = { pin = "P31", signal = "ST1/SN1" }
 2 = { pin = "P32", signal = "ST2/SN2" }
 3 = { pin = "P33", signal = "ST3/SN3" }
 4 = { pin = "P34", signal = "SN4" }
 5 = { pin = "P35", signal = "SN5" }
 6 = { pin = "P36", signal = "SN6" }
 7 = { pin = "P37", signal = "N/#S" }
 8 = { pin = "P40", signal = "R/#W" }
 9 = { pin = "P41", signal = "B/#W" }
10 = { pin = "P42", signal = "#MREQ" }
11 = { pin = "P43", signal = "#DS" }
12 = { pin = "P44", signal = "ASEL" }
13 = { pin = "P46", signal = "#AS" }
14 = { pin = "P47", signal = "CLOCK" }
15 = { pin = "P53", signal = "#RESET" }
