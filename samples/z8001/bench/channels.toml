# Channel labels for the Z8001, taken from z8001_bionic.toml, which
# matches the PCB. Not yet checked against the board: verify against the
# wiring before trusting it -- a lead moved on the bench leaves this
# stale. '# Pxx' comments are that channel's pin name on the Bionic
# Connector.
#
# P30-P33 carry ST0-ST3 while ASEL is low and SN0-SN3 while it is high,
# through a 74AHCT157; SN4-SN6 have their own pins.
[z8001-reset]
 0 = "ST0/SN0"  # P30
 1 = "ST1/SN1"  # P31
 2 = "ST2/SN2"  # P32
 3 = "ST3/SN3"  # P33
 4 = "SN4"      # P34
 5 = "SN5"      # P35
 6 = "SN6"      # P36
 7 = "N/#S"     # P37
 8 = "R/#W"     # P40
 9 = "B/#W"     # P41
10 = "#MREQ"    # P42
11 = "#DS"      # P43
12 = "ASEL"     # P44
13 = "#AS"      # P46
14 = "CLOCK"    # P47
15 = "#RESET"   # P53
