# Channel labels for the MC68HC05C0 board. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[mc68hc05c0]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P43", signal = "#RD" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }

# The reset sequence: #RESET negates, then the register save.
[mc68hc05c0-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P43", signal = "#RD" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#RESET", edge = "rise", before = 50e-6, after = 71e-6 }
display = ["OSC1", "AS", "#RD", "#WR", "#LIR", "debug", "#IRQ", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#WR", edge = "rise" },
]

# Six steps of mandelbrot halted by the halt port, sent as one write:
# each step's restore, cycles and register save.
[mc68hc05c0-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P43", signal = "#RD" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "AS", edge = "rise", before = 50e-6, after = 500e-6 }
display = ["OSC1", "AS", "#RD", "#WR", "#LIR", "debug", "#IRQ", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#WR", edge = "rise" },
]

# The echoitr sample's echo of one character: #IRQ asserts for the
# receive, then for each transmit until the last.
[mc68hc05c0-echoitr]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P43", signal = "#RD" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#IRQ", edge = "fall", before = 50e-6, after = 5.80e-3 }
display = ["OSC1", "AS", "#RD", "#WR", "#LIR", "debug", "#IRQ", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#WR", edge = "rise" },
]
