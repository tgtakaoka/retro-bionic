# Channel labels for the TMS320C15, checked against a reset: CLKIN rises
# four times per CLKOUT, #MEN falls once per machine cycle, #RS pulses low.
# Verify against the wiring before trusting it -- a lead moved on the bench
# leaves this stale.
[tms320c15]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P46", signal = "#INT" }
 9 = { pin = "P47", signal = "CLKIN" }
10 = { pin = "P50", signal = "#MEN" }
11 = { pin = "P51", signal = "#WE" }
12 = { pin = "P52", signal = "#DEN" }
13 = { pin = "P53", signal = "#RS" }
14 = { pin = "P55", signal = "CLKOUT" }
15 = { pin = "P56", signal = "debug" }
