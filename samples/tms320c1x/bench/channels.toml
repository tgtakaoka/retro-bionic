# Channel labels for the TMS320C15, checked against a reset: CLKIN rises
# four times per CLKOUT, #MEN falls once per machine cycle, #RS pulses
# low. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale. '# Pxx' comments are that channel's pin
# name on the Bionic Connector.
[tms320c15]
 0 = "D0"     # P10
 1 = "D1"     # P11
 2 = "D2"     # P12
 3 = "D3"     # P13
 4 = "D4"     # P14
 5 = "D5"     # P15
 6 = "D6"     # P16
 7 = "D7"     # P17
 8 = "#INT"   # P46
 9 = "CLKIN"  # P47
10 = "#MEN"   # P50
11 = "#WE"    # P51
12 = "#DEN"   # P52
13 = "#RS"    # P53
14 = "CLKOUT" # P55
15 = "debug"  # P56
