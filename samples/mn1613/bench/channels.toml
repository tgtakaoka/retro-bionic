# Channel labels for the MN1613 (and the MN1613A, whose board has these
# signals on the same pins), checked against a reset: #BSRQ, ADSD and
# #DTSD pulse together for every bus cycle, FSYC marks the fetches, WRT
# the writes and IOP the I/O cycles, X2 is the clock the debugger drives,
# and #RST pulses low. Verify against the wiring before trusting it -- a
# lead moved on the bench leaves this stale. '# Pxx' comments are that
# channel's pin name on the Bionic Connector.
[mn1613]
 0 = "BS15"   # P10
 1 = "BS14"   # P11
 2 = "BS13"   # P12
 3 = "BS12"   # P13
 4 = "BS11"   # P14
 5 = "BS10"   # P15
 6 = "BS9"    # P16
 7 = "BS8"    # P17
 8 = "#BSRQ"  # P40
 9 = "ADSD"   # P41
10 = "#DTSD"  # P42
11 = "WRT"    # P43
12 = "IOP"    # P46
13 = "FSYC"   # P31
14 = "X2"     # P47
15 = "#RST"   # P53
