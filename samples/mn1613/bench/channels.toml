# Channel labels for the MN1613 (and the MN1613A, whose board has these
# signals on the same pins), checked against a reset: #BSRQ, ADSD and #DTSD
# pulse together for every bus cycle, FSYC marks the fetches, WRT the writes
# and IOP the I/O cycles, X2 is the clock the debugger drives, and #RST
# pulses low. Verify against the wiring before trusting it -- a lead moved
# on the bench leaves this stale.
[mn1613]
 0 = { pin = "P10", signal = "BS15" }
 1 = { pin = "P11", signal = "BS14" }
 2 = { pin = "P12", signal = "BS13" }
 3 = { pin = "P13", signal = "BS12" }
 4 = { pin = "P14", signal = "BS11" }
 5 = { pin = "P15", signal = "BS10" }
 6 = { pin = "P16", signal = "BS9" }
 7 = { pin = "P17", signal = "BS8" }
 8 = { pin = "P40", signal = "#BSRQ" }
 9 = { pin = "P31", signal = "FSYC" }
10 = { pin = "P41", signal = "ADSD" }
11 = { pin = "P42", signal = "#DTSD" }
12 = { pin = "P43", signal = "WRT" }
13 = { pin = "P46", signal = "IOP" }
14 = { pin = "P47", signal = "X2" }
15 = { pin = "P53", signal = "#RST" }
