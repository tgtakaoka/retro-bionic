# Channel labels for the KL5C80A12, checked against a reset: XIN is the
# fastest clock and CLK half of it, #EMRD pulses every bus cycle with #M1 on
# the opcode fetches, #EMWR on the writes, and #RESET pulses low. Verify
# against the wiring before trusting it -- a lead moved on the bench leaves
# this stale.
[kl5c80]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#EMRD" }
 9 = { pin = "P41", signal = "#EMWR" }
10 = { pin = "P42", signal = "#M1" }
11 = { pin = "P44", signal = "CLK" }
12 = { pin = "P47", signal = "XIN" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "ERDY" }
15 = { pin = "P53", signal = "#RESET" }
