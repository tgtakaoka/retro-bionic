# Channel labels for the KL5C80A12, checked against a reset: XIN is the
# fastest clock and CLK half of it, #EMRD pulses every bus cycle with #M1 on
# the opcode fetches, #EMWR on the writes, and #RESET pulses low. Verify
# against the wiring before trusting it -- a lead moved on the bench leaves
# this stale.
[kl5c80]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#EMRD" }
 9 = { pin = "P41", signal = "#EMWR" }
10 = { pin = "P42", signal = "#M1" }
11 = { pin = "P44", signal = "CLK" }
12 = { pin = "P47", signal = "XIN" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "ERDY" }
15 = { pin = "P53", signal = "#RESET" }

# The bus waves, reset, echoitr and step, one layout: ch15 is #RESET or
# #NMI. ASEL rising closes A8-A11, falling A16-A18 (P33 reads GND).
# Reset: trigger on the first read after #RESET rises.
[kl5c80-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "A8/A16" }
 2 = { pin = "P31", signal = "A9/A17" }
 3 = { pin = "P32", signal = "A10/A18" }
 4 = { pin = "P33", signal = "A11/-" }
 5 = { pin = "P34", signal = "A12" }
 6 = { pin = "P40", signal = "#EMRD" }
 7 = { pin = "P41", signal = "#EMWR" }
 8 = { pin = "P42", signal = "#M1" }
 9 = { pin = "P43", signal = "#EIORD" }
10 = { pin = "P44", signal = "CLK" }
11 = { pin = "P45", signal = "ASEL" }
12 = { pin = "P47", signal = "XIN" }
13 = { pin = "P50", signal = "IR0" }
14 = { pin = "P52", signal = "ERDY" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#EMRD", edge = "fall", when = { "#RESET" = "high" }, before = 50e-6, after = 85e-6 }
parallel = [
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/-"], clock = "ASEL", edge = "rise" },
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/-"], clock = "ASEL", edge = "fall" },
]
display = ["XIN", "CLK", "#M1", "#EMRD", "#EMWR", "#EIORD", "ASEL", "ERDY",
        "IR0", "#RESET", "A12", "A11/-", "A10/A18", "A9/A17", "A8/A16", "D0"]

# echoitr: the ACIA's receive interrupt on IR0 (active high), the handler
# and the echo it queues for the transmit interrupt.
[kl5c80-echoitr]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "A8/A16" }
 2 = { pin = "P31", signal = "A9/A17" }
 3 = { pin = "P32", signal = "A10/A18" }
 4 = { pin = "P33", signal = "A11/-" }
 5 = { pin = "P34", signal = "A12" }
 6 = { pin = "P40", signal = "#EMRD" }
 7 = { pin = "P41", signal = "#EMWR" }
 8 = { pin = "P42", signal = "#M1" }
 9 = { pin = "P43", signal = "#EIORD" }
10 = { pin = "P44", signal = "CLK" }
11 = { pin = "P45", signal = "ASEL" }
12 = { pin = "P47", signal = "XIN" }
13 = { pin = "P50", signal = "IR0" }
14 = { pin = "P52", signal = "ERDY" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "IR0", edge = "rise", before = 50e-6, after = 4.0e-3 }
parallel = [
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/-"], clock = "ASEL", edge = "rise" },
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/-"], clock = "ASEL", edge = "fall" },
]
display = ["XIN", "CLK", "#M1", "#EMRD", "#EMWR", "#EIORD", "ASEL", "ERDY",
        "IR0", "#RESET", "A12", "A11/-", "A10/A18", "A9/A17", "A8/A16", "D0"]

# Six steps from a halt, sent as one write: each #NMI parks the CPU in its
# acknowledge after one instruction.
[kl5c80-step]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "A8/A16" }
 2 = { pin = "P31", signal = "A9/A17" }
 3 = { pin = "P32", signal = "A10/A18" }
 4 = { pin = "P33", signal = "A11/-" }
 5 = { pin = "P34", signal = "A12" }
 6 = { pin = "P40", signal = "#EMRD" }
 7 = { pin = "P41", signal = "#EMWR" }
 8 = { pin = "P42", signal = "#M1" }
 9 = { pin = "P43", signal = "#EIORD" }
10 = { pin = "P44", signal = "CLK" }
11 = { pin = "P45", signal = "ASEL" }
12 = { pin = "P47", signal = "XIN" }
13 = { pin = "P50", signal = "IR0" }
14 = { pin = "P52", signal = "ERDY" }
15 = { pin = "P51", signal = "#NMI" }
trigger = { signal = "#NMI", edge = "fall", before = 50e-6, after = 540e-6 }
parallel = [
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/-"], clock = "ASEL", edge = "rise" },
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/-"], clock = "ASEL", edge = "fall" },
]
display = ["XIN", "CLK", "#M1", "#EMRD", "#EMWR", "#EIORD", "ASEL", "ERDY",
        "IR0", "#NMI", "A12", "A11/-", "A10/A18", "A9/A17", "A8/A16", "D0"]
