# Channel labels for the KL5C80A12, checked against a reset: XIN is the
# fastest clock and CLK half of it, #EMRD pulses every bus cycle with #M1
# on the opcode fetches, #EMWR on the writes, and #RESET pulses low.
# Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale. '# Pxx' comments are that channel's pin name on
# the Bionic Connector.
[kl5c80]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#EMRD"   # P40
 9 = "#EMWR"   # P41
10 = "#M1"     # P42
11 = "CLK"     # P44
12 = "XIN"     # P47
13 = "#NMI"    # P51
14 = "ERDY"    # P52
15 = "#RESET"  # P53
