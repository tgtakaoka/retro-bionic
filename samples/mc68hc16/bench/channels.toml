# Channel labels for the MC68HC16Z1 board. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.

[mc68hc16-reset]
 0 = "DATA0"   # P10
 1 = "DATA1"   # P11
 2 = "DATA2"   # P12
 3 = "DATA7"   # P17
 4 = "DATA11"  # P23
 5 = "MUX0"    # P30: A0/A4/A12/A8 by ASEL1:ASEL0
 6 = "#AS"     # P40
 7 = "R/#W"    # P41
 8 = "IPIPE0"  # P42
 9 = "IPIPE1"  # P43
10 = "#DSACK1" # P45
11 = "#DS"     # P46
12 = "EXTAL"   # P47
13 = "CLKOUT"  # P52
14 = "#RESET"  # P53
15 = "ASEL0"   # P54

[mc68hc16-addr]
 0 = "MUX0"    # P30: A0/A4/A12/A8 by ASEL1:ASEL0 00/01/10/11
 1 = "MUX1"    # P31: A1/A5/A13/A9
 2 = "MUX2"    # P32: A2/A6/A14/A10
 3 = "MUX3"    # P33: A3/A7/A15/A11
 4 = "MUX4"    # P34: A16/A20/SIZ0/FC0
 5 = "MUX5"    # P35: A17/A21/SIZ1/FC1
 6 = "MUX6"    # P36: A18/A22/-/FC2
 7 = "MUX7"    # P37: A19/A23/-/-
 8 = "#AS"     # P40
 9 = "R/#W"    # P41
10 = "#DSACK1" # P45
11 = "#DS"     # P46
12 = "EXTAL"   # P47
13 = "#RESET"  # P53
14 = "ASEL0"   # P54
15 = "ASEL1"   # P55
