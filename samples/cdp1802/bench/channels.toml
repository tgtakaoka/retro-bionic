# Channel labels for the CDP1802. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[cdp1802]
 0 = "BUS0"    # P10
 1 = "BUS1"    # P11
 2 = "BUS2"    # P12
 3 = "BUS3"    # P13
 4 = "BUS4"    # P14
 5 = "BUS5"    # P15
 6 = "BUS6"    # P16
 7 = "BUS7"    # P17
 8 = "SC0"     # P40
 9 = "SC1"     # P41
10 = "#MRD"    # P42
11 = "#MWR"    # P43
12 = "CLOCK"   # P46
13 = "#INTR"   # P47
14 = "#WAIT"   # P52
15 = "#CLEAR"  # P53
