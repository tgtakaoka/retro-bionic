# Channel labels for the CDP1802. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[cdp1802]
 0 = { pin = "P10", signal = "BUS0" }
 1 = { pin = "P11", signal = "BUS1" }
 2 = { pin = "P12", signal = "BUS2" }
 3 = { pin = "P13", signal = "BUS3" }
 4 = { pin = "P14", signal = "BUS4" }
 5 = { pin = "P15", signal = "BUS5" }
 6 = { pin = "P16", signal = "BUS6" }
 7 = { pin = "P17", signal = "BUS7" }
 8 = { pin = "P40", signal = "SC0" }
 9 = { pin = "P41", signal = "SC1" }
10 = { pin = "P42", signal = "#MRD" }
11 = { pin = "P43", signal = "#MWR" }
12 = { pin = "P46", signal = "CLOCK" }
13 = { pin = "P47", signal = "#INTR" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P53", signal = "#CLEAR" }
