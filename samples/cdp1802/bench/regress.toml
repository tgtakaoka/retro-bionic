# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for.
chips = ["CDP1802", "CDP1804A"]

# Documented RESET guarantees (CDP1804AC datasheet, "RESET"/"Initialization
# Cycle", p.69 -- CDP1802-compatible, same reset behavior): X, P, R0 (so
# PC) are cleared, Q=0, interrupts enabled. D, DF, T are explicitly *not*
# affected by reset, so are left unchecked here.
[reset]
program_counter = "PC"
PC = "0000"
X = "0"
P = "0"
Q = "0"
IE = "1"

# CDP1802's arith.asm is not the same program as the other targets': it
# runs a different, longer set of cases.
[arith]
expect = """
0 - -28000 = 28000
0 - 28000 = -28000
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
18000 - -28000 = -19536
18000 - -18000 = -29536
-28000 - -18000 = -10000
100 * 300 = 30000
200 * -100 = -20000
300 * -200 = 5536
-100 * 300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
-28000 = -28000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

[echoitr]
# Unlike echo/echoir, echoitr prints "<char> 0xXX 0bXXXXXXXX" for each
# received byte instead of echoing it back verbatim, one line per fed
# byte including the trailing \r -- same print routine as CDP1804A's.
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
# A full frame is minutes on this target (~266s) -- lines halts
# mid-run instead, once enough output lines have printed to check
# against the golden reference, rather than waiting out the whole
# frame. 6 lines = 'G's own reply line + 5 complete drawn rows.
golden = "samples/arith/mandelbrot.golden"
lines = 6

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
