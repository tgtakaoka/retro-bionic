# Channel labels for the Z8002, taken from z8002_bionic.toml, which
# matches the PCB. [z8002-reset] is checked against the board: the status,
# strobes and CLOCK frame each bus cycle where the firmware's ring says.
# Verify against the wiring before trusting it -- a lead moved on the bench
# leaves this stale. '# Pxx' comments are that channel's pin name on the
# Bionic Connector.

# Following a program: AD0-AD3 carry the low address nibble while #AS is
# low and the odd byte's low data nibble while #DS is low. The regress
# passes with these probes on (on the Z280 they loaded the bus); the AD
# lines are not yet checked against a capture.
[z8002]
 0 = "ST0"     # P30
 1 = "ST1"     # P31
 2 = "ST2"     # P32
 3 = "ST3"     # P33
 4 = "AD0"     # P10
 5 = "AD1"     # P11
 6 = "AD2"     # P12
 7 = "AD3"     # P13
 8 = "R/#W"    # P40
 9 = "B/#W"    # P41
10 = "#MREQ"   # P42
11 = "#DS"     # P43
12 = "#AS"     # P46
13 = "CLOCK"   # P47
14 = "#RESET"  # P53
15 = "#WAIT"   # P54

# Reset and the debugger's own pins: no AD lines.
[z8002-reset]
 0 = "ST0"     # P30
 1 = "ST1"     # P31
 2 = "ST2"     # P32
 3 = "ST3"     # P33
 4 = "N/#S"    # P37
 5 = "R/#W"    # P40
 6 = "B/#W"    # P41
 7 = "#MREQ"   # P42
 8 = "#DS"     # P43
 9 = "#AS"     # P46
10 = "CLOCK"   # P47
11 = "#NMI"    # P50
12 = "#RESET"  # P53
13 = "#WAIT"   # P54
14 = "#STOP"   # P55
15 = "debug"   # P56
