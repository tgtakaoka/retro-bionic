# Channel labels for the Z8002, taken from z8002_bionic.toml, which matches
# the PCB. [z8002-reset] is checked against the board: the status, strobes
# and CLOCK frame each bus cycle where the firmware's ring says. Verify
# against the wiring before trusting it -- a lead moved on the bench leaves
# this stale.

# Following a program: AD0-AD3 carry the low address nibble while #AS is
# low and the odd byte's low data nibble while #DS is low. The regress
# passes with these probes on (on the Z280 they loaded the bus); the AD
# lines are not yet checked against a capture.
[z8002]
 0 = { pin = "P30", signal = "ST0" }
 1 = { pin = "P31", signal = "ST1" }
 2 = { pin = "P32", signal = "ST2" }
 3 = { pin = "P33", signal = "ST3" }
 4 = { pin = "P10", signal = "AD0" }
 5 = { pin = "P11", signal = "AD1" }
 6 = { pin = "P12", signal = "AD2" }
 7 = { pin = "P13", signal = "AD3" }
 8 = { pin = "P40", signal = "R/#W" }
 9 = { pin = "P41", signal = "B/#W" }
10 = { pin = "P42", signal = "#MREQ" }
11 = { pin = "P43", signal = "#DS" }
12 = { pin = "P46", signal = "#AS" }
13 = { pin = "P47", signal = "CLOCK" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#WAIT" }

# Reset and the debugger's own pins: no AD lines.
[z8002-reset]
 0 = { pin = "P30", signal = "ST0" }
 1 = { pin = "P31", signal = "ST1" }
 2 = { pin = "P32", signal = "ST2" }
 3 = { pin = "P33", signal = "ST3" }
 4 = { pin = "P37", signal = "N/#S" }
 5 = { pin = "P40", signal = "R/#W" }
 6 = { pin = "P41", signal = "B/#W" }
 7 = { pin = "P42", signal = "#MREQ" }
 8 = { pin = "P43", signal = "#DS" }
 9 = { pin = "P46", signal = "#AS" }
10 = { pin = "P47", signal = "CLOCK" }
11 = { pin = "P50", signal = "#NMI" }
12 = { pin = "P53", signal = "#RESET" }
13 = { pin = "P54", signal = "#WAIT" }
14 = { pin = "P55", signal = "#STOP" }
15 = { pin = "P56", signal = "debug" }
