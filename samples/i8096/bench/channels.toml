# Channel labels for the P8095BH. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[p8095]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#ADV" }
 9 = { pin = "P41", signal = "#RD" }
10 = { pin = "P42", signal = "#WR" }
11 = { pin = "P43", signal = "#BHE" }
12 = { pin = "P47", signal = "XTAL1" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P55", signal = "EXTINT" }
15 = { pin = "P56", signal = "debug" }

# Profiling leads, the layout every profiled board shares: drops #BHE,
# #RESET, EXTINT, and ch10 is on P42 for #WR.
[p8095-profile]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#ADV" }
 9 = { pin = "P41", signal = "#RD" }
10 = { pin = "P42", signal = "#WR" }
11 = { pin = "P47", signal = "XTAL1" }
12 = { pin = "P50", signal = "ACH4" }
13 = { pin = "P51", signal = "ACH5" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P52", signal = "ACH6" }

# 16-bit bus leads: drops AD2-AD7, #RESET and EXTINT for AD8-AD15.
[p8095-bus16]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P20", signal = "AD8" }
 3 = { pin = "P21", signal = "AD9" }
 4 = { pin = "P22", signal = "AD10" }
 5 = { pin = "P23", signal = "AD11" }
 6 = { pin = "P24", signal = "AD12" }
 7 = { pin = "P25", signal = "AD13" }
 8 = { pin = "P26", signal = "AD14" }
 9 = { pin = "P27", signal = "AD15" }
10 = { pin = "P40", signal = "#ADV" }
11 = { pin = "P41", signal = "#RD" }
12 = { pin = "P42", signal = "#WR" }
13 = { pin = "P43", signal = "#BHE" }
14 = { pin = "P47", signal = "XTAL1" }
15 = { pin = "P56", signal = "debug" }

# The N8097BH board's 16-bit bus leads: INST on P46 in place of AD1.
[n8097-bus16]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P46", signal = "INST" }
 2 = { pin = "P20", signal = "AD8" }
 3 = { pin = "P21", signal = "AD9" }
 4 = { pin = "P22", signal = "AD10" }
 5 = { pin = "P23", signal = "AD11" }
 6 = { pin = "P24", signal = "AD12" }
 7 = { pin = "P25", signal = "AD13" }
 8 = { pin = "P26", signal = "AD14" }
 9 = { pin = "P27", signal = "AD15" }
10 = { pin = "P40", signal = "#ADV" }
11 = { pin = "P41", signal = "#RD" }
12 = { pin = "P42", signal = "#WR" }
13 = { pin = "P43", signal = "#BHE" }
14 = { pin = "P47", signal = "XTAL1" }
15 = { pin = "P56", signal = "debug" }
