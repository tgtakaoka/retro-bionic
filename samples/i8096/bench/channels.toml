# Channel labels for the P8095BH. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[p8095]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "#ADV"    # P40
 9 = "#RD"     # P41
10 = "#WR"     # P42
11 = "#BHE"    # P43
12 = "XTAL1"   # P47
13 = "#RESET"  # P53
14 = "EXTINT"  # P55
15 = "debug"   # P56

# Profiling leads, the layout every profiled board shares: drops #BHE,
# #RESET, EXTINT, and ch10 is on P42 for #WR.
[p8095-profile]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "#ADV"    # P40
 9 = "#RD"     # P41
10 = "#WR"     # P42
11 = "XTAL1"   # P47
12 = "ACH4"    # P50
13 = "ACH5"    # P51
14 = "debug"   # P56
15 = "ACH6"    # P52

# 16-bit bus leads: drops AD2-AD7, #RESET and EXTINT for AD8-AD15.
[p8095-bus16]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD8"     # P20
 3 = "AD9"     # P21
 4 = "AD10"    # P22
 5 = "AD11"    # P23
 6 = "AD12"    # P24
 7 = "AD13"    # P25
 8 = "AD14"    # P26
 9 = "AD15"    # P27
10 = "#ADV"    # P40
11 = "#RD"     # P41
12 = "#WR"     # P42
13 = "#BHE"    # P43
14 = "XTAL1"   # P47
15 = "debug"   # P56
