# Channel labels for the Z80, checked against a reset: #M1, #MREQ and #RD
# fall together for an opcode fetch, #WAIT holding it, #MREQ alone pulses
# for its refresh, #MREQ with #WR for the pushes, CLK runs throughout and
# #RESET pulses low. Verify against the wiring before trusting it -- a lead
# moved on the bench leaves this stale.
[z80]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#M1" }
11 = { pin = "P43", signal = "#MREQ" }
12 = { pin = "P47", signal = "CLK" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P53", signal = "#RESET" }

# The NSC800, which runs these samples: AD0-AD7 carry the low address
# byte, latched by ALE, before the data. Verify against the wiring before
# trusting it.
[nsc800]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P42", signal = "#RD" }
 9 = { pin = "P43", signal = "#WR" }
10 = { pin = "P45", signal = "#RFSH" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P50", signal = "XIN" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P54", signal = "ALE" }
15 = { pin = "P56", signal = "debug" }
