# Channel labels for the Z80, checked against a reset: #M1, #MREQ and #RD
# fall together for an opcode fetch, #WAIT holding it, #MREQ alone pulses
# for its refresh, #MREQ with #WR for the pushes, CLK runs throughout and
# #RESET pulses low. Verify against the wiring before trusting it -- a lead
# moved on the bench leaves this stale. '# Pxx' comments are that channel's
# pin name on the Bionic Connector.
[z80]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RD"     # P40
 9 = "#WR"     # P41
10 = "#M1"     # P42
11 = "#MREQ"   # P43
12 = "CLK"     # P47
13 = "#NMI"    # P51
14 = "#WAIT"   # P52
15 = "#RESET"  # P53

# The NSC800, which runs these samples: AD0-AD7 carry the low address
# byte, latched by ALE, before the data. Verify against the wiring before
# trusting it.
[nsc800]
 0 = "AD0"    # P10
 1 = "AD1"    # P11
 2 = "AD2"    # P12
 3 = "AD3"    # P13
 4 = "AD4"    # P14
 5 = "AD5"    # P15
 6 = "AD6"    # P16
 7 = "AD7"    # P17
 8 = "#RD"    # P42
 9 = "#WR"    # P43
10 = "#RFSH"  # P45
11 = "CLK"    # P47
12 = "XIN"    # P50
13 = "#WAIT"  # P52
14 = "ALE"    # P54
15 = "debug"  # P56
