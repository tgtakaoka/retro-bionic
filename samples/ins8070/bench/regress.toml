# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# Documented RESET guarantees (INS8070 data sheet, NRST pin description,
# p.8): PC and SP are zeroed, and every status bit except SA and SB is
# cleared. Only S's carry and overflow bits are checked; SA and SB sit
# between them and the rest, and follow the sense inputs.
[reset]
program_counter = "PC"
PC = "0000"
SP = "0000"
S = "__"

[arith]
expect = """
0 - -28000 = 28000
0 - 28000 = -28000
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
100 * 300 = 30000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
-48 < 30
30 > -48
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
18000 = 18000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# Console I/O patches for the INS8073 BASIC ROM, not stand-alone
# programs.
[INS8073PATCH]
skip = true

[bb110bps]
skip = true

[bb4800bps]
skip = true

[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
frames = 1

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

# The PC holds the address before the next instruction, so a stop at
# loop_x reports PC = loop_x - 1.
[breakpoint]
program = "mandelbrot"
break_at = "loop_x"
pc_offset = -1

[gountil]
program = "mandelbrot"
break_at = "loop_x"
pc_offset = -1
