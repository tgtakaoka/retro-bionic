# Channel labels for the INS8070. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[ins8070]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RDS"    # P40
 9 = "#WDS"    # P41
10 = "SA"      # P42
11 = "XIN"     # P46
12 = "#BREQ"   # P47
13 = "#RST"    # P53
14 = "#ENIN"   # P54
15 = "#ENOUT"  # P55

# Profiling leads, the layout every profiled board shares: drops #ENIN,
# #ENOUT, #RST, SA.
[ins8070-profile]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RDS"    # P40
 9 = "#WDS"    # P41
10 = "XIN"     # P46
11 = "#BREQ"   # P47
13 = "F3"      # P51
14 = "debug"   # P56
15 = "HOLD"    # P52
