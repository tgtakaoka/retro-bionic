# Channel labels for the INS8070. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[ins8070]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RDS" }
 9 = { pin = "P41", signal = "#WDS" }
10 = { pin = "P46", signal = "XIN" }
11 = { pin = "P47", signal = "#BREQ" }
12 = { pin = "P52", signal = "#HOLD" }
13 = { pin = "P53", signal = "#RST" }
14 = { pin = "P54", signal = "#ENIN" }
15 = { pin = "P55", signal = "#ENOUT" }

# Profiling leads, the layout every profiled board shares: drops #ENIN,
# #ENOUT, #RST, SA.
[ins8070-profile]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RDS" }
 9 = { pin = "P41", signal = "#WDS" }
10 = { pin = "P46", signal = "XIN" }
11 = { pin = "P47", signal = "#BREQ" }
13 = { pin = "P51", signal = "F3" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P52", signal = "HOLD" }
