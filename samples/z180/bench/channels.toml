# Channel labels for the Z180 and HD64180S. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[z180]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#M1" }
11 = { pin = "P43", signal = "#MREQ" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }

[hd64180s]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P43", signal = "#ME" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }

# The Z180s' bus waves, reset, echoitr and step, one layout: ch15 is #RESET
# or #NMI. ASEL rising closes A8-A11, falling A16-A19. Reset: trigger on
# the first read after #RESET rises.
[z180-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "A8/A16" }
 2 = { pin = "P31", signal = "A9/A17" }
 3 = { pin = "P32", signal = "A10/A18" }
 4 = { pin = "P33", signal = "A11/A19" }
 5 = { pin = "P34", signal = "A12" }
 6 = { pin = "P40", signal = "#RD" }
 7 = { pin = "P41", signal = "#WR" }
 8 = { pin = "P42", signal = "#M1" }
 9 = { pin = "P43", signal = "#MREQ" }
10 = { pin = "P44", signal = "PHI" }
11 = { pin = "P45", signal = "ASEL" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#RD", edge = "fall", when = { "#RESET" = "high" }, before = 50e-6, after = 120e-6 }
parallel = [
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/A19"], clock = "ASEL", edge = "rise" },
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/A19"], clock = "ASEL", edge = "fall" },
]
display = ["EXTAL", "PHI", "#M1", "#MREQ", "#RD", "#WR", "ASEL", "#WAIT",
        "#INT0", "#RESET", "A12", "A11/A19", "A10/A18", "A9/A17", "A8/A16", "D0"]

# echoitr: the ACIA's receive interrupt on #INT0, the handler and the
# echo it queues for the transmit interrupt.
[z180-echoitr]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "A8/A16" }
 2 = { pin = "P31", signal = "A9/A17" }
 3 = { pin = "P32", signal = "A10/A18" }
 4 = { pin = "P33", signal = "A11/A19" }
 5 = { pin = "P34", signal = "A12" }
 6 = { pin = "P40", signal = "#RD" }
 7 = { pin = "P41", signal = "#WR" }
 8 = { pin = "P42", signal = "#M1" }
 9 = { pin = "P43", signal = "#MREQ" }
10 = { pin = "P44", signal = "PHI" }
11 = { pin = "P45", signal = "ASEL" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#INT0", edge = "fall", before = 50e-6, after = 5.75e-3 }
parallel = [
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/A19"], clock = "ASEL", edge = "rise" },
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/A19"], clock = "ASEL", edge = "fall" },
]
display = ["EXTAL", "PHI", "#M1", "#MREQ", "#RD", "#WR", "ASEL", "#WAIT",
        "#INT0", "#RESET", "A12", "A11/A19", "A10/A18", "A9/A17", "A8/A16", "D0"]

# Six steps from a halt, sent as one write: each #NMI parks the CPU in its
# acknowledge after one instruction.
[z180-step]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "A8/A16" }
 2 = { pin = "P31", signal = "A9/A17" }
 3 = { pin = "P32", signal = "A10/A18" }
 4 = { pin = "P33", signal = "A11/A19" }
 5 = { pin = "P34", signal = "A12" }
 6 = { pin = "P40", signal = "#RD" }
 7 = { pin = "P41", signal = "#WR" }
 8 = { pin = "P42", signal = "#M1" }
 9 = { pin = "P43", signal = "#MREQ" }
10 = { pin = "P44", signal = "PHI" }
11 = { pin = "P45", signal = "ASEL" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P51", signal = "#NMI" }
trigger = { signal = "#NMI", edge = "fall", before = 50e-6, after = 700e-6 }
parallel = [
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/A19"], clock = "ASEL", edge = "rise" },
  { data = ["A8/A16", "A9/A17", "A10/A18", "A11/A19"], clock = "ASEL", edge = "fall" },
]
display = ["EXTAL", "PHI", "#M1", "#MREQ", "#RD", "#WR", "ASEL", "#WAIT",
        "#INT0", "#NMI", "A12", "A11/A19", "A10/A18", "A9/A17", "A8/A16", "D0"]

