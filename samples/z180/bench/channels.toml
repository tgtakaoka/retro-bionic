# Channel labels for the Z180 and HD64180S. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[z180]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RD"     # P40
 9 = "#WR"     # P41
10 = "#M1"     # P42
11 = "#MREQ"   # P43
12 = "EXTAL"   # P47
13 = "#WAIT"   # P52
14 = "#RESET"  # P53
15 = "debug"   # P56

[hd64180s]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RD"     # P40
 9 = "#WR"     # P41
10 = "#LIR"    # P42
11 = "#ME"     # P43
12 = "EXTAL"   # P47
13 = "#WAIT"   # P52
14 = "#RESET"  # P53
15 = "debug"   # P56
