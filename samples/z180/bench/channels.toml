# Channel labels for the Z180 and HD64180S. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[z180]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#M1" }
11 = { pin = "P43", signal = "#MREQ" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }

[hd64180s]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P43", signal = "#ME" }
12 = { pin = "P47", signal = "EXTAL" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
