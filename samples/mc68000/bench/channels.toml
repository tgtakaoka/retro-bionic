# Channel labels for the MC68000-family boards. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.

# The MC68008 boards' bus waves, reset, echoitr and step, one layout.
# ASEL rising closes select 0 (A8-A11), falling select 1 (A12-A15).
# #IPL2 and #IPL0 are tied: level 5 (the ACIA) lowers them alone, level
# 7 #IPL1 as well. Reset: trigger on the first bus cycle after #RESET.
[mc68008-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "MUX0" }
 2 = { pin = "P31", signal = "MUX1" }
 3 = { pin = "P32", signal = "MUX2" }
 4 = { pin = "P33", signal = "MUX3" }
 5 = { pin = "P40", signal = "#AS" }
 6 = { pin = "P41", signal = "R/#W" }
 7 = { pin = "P42", signal = "#IPL2/0" }
 8 = { pin = "P43", signal = "#DS" }
 9 = { pin = "P44", signal = "#DTACK" }
10 = { pin = "P46", signal = "#HALT" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P52", signal = "FC2" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "ASEL" }
15 = { pin = "P55", signal = "#IPL1" }
trigger = { signal = "#AS", edge = "fall", when = { "#RESET" = "high" }, before = 50e-6, after = 120e-6 }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL", edge = "fall" },
]
display = ["CLK", "#AS", "R/#W", "#DS", "FC2", "ASEL", "#DTACK", "#HALT",
        "#IPL2/0", "#IPL1", "#RESET", "MUX3", "MUX2", "MUX1", "MUX0", "D0"]

# echoitr: the ACIA's receive interrupt at level 5, the handler and the
# echo it queues for the transmit interrupt.
[mc68008-echoitr]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "MUX0" }
 2 = { pin = "P31", signal = "MUX1" }
 3 = { pin = "P32", signal = "MUX2" }
 4 = { pin = "P33", signal = "MUX3" }
 5 = { pin = "P40", signal = "#AS" }
 6 = { pin = "P41", signal = "R/#W" }
 7 = { pin = "P42", signal = "#IPL2/0" }
 8 = { pin = "P43", signal = "#DS" }
 9 = { pin = "P44", signal = "#DTACK" }
10 = { pin = "P46", signal = "#HALT" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P52", signal = "FC2" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "ASEL" }
15 = { pin = "P55", signal = "#IPL1" }
trigger = { signal = "#IPL2/0", edge = "fall", before = 50e-6, after = 6.1e-3 }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL", edge = "fall" },
]
display = ["CLK", "#AS", "R/#W", "#DS", "FC2", "ASEL", "#DTACK", "#HALT",
        "#IPL2/0", "#IPL1", "#RESET", "MUX3", "MUX2", "MUX1", "MUX0", "D0"]

# Six steps from a halt, sent as one write: each restore returns to the
# program with T set, and its trace exception parks the CPU again, in a
# read #DTACK withholds: the first #AS rise is the first step.
[mc68008-step]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "MUX0" }
 2 = { pin = "P31", signal = "MUX1" }
 3 = { pin = "P32", signal = "MUX2" }
 4 = { pin = "P33", signal = "MUX3" }
 5 = { pin = "P40", signal = "#AS" }
 6 = { pin = "P41", signal = "R/#W" }
 7 = { pin = "P42", signal = "#IPL2/0" }
 8 = { pin = "P43", signal = "#DS" }
 9 = { pin = "P44", signal = "#DTACK" }
10 = { pin = "P46", signal = "#HALT" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P52", signal = "FC2" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "ASEL" }
15 = { pin = "P55", signal = "#IPL1" }
trigger = { signal = "#AS", edge = "rise", before = 50e-6, after = 2.2e-3 }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL", edge = "fall" },
]
display = ["CLK", "#AS", "R/#W", "#DS", "FC2", "ASEL", "#DTACK", "#HALT",
        "#IPL2/0", "#IPL1", "#RESET", "MUX3", "MUX2", "MUX1", "MUX0", "D0"]

# A cycle's data against its strobes, and the interrupt lines for a halt.
[mc68008-data]
 0 = "D0"       # P10
 1 = "D1"       # P11
 2 = "D2"       # P12
 3 = "D3"       # P13
 4 = "D4"       # P14
 5 = "D5"       # P15
 6 = "D6"       # P16
 7 = "D7"       # P17
 8 = "#AS"      # P40
 9 = "R/#W"     # P41
10 = "#IPL2/0"  # P42
11 = "#DS"      # P43
12 = "#DTACK"   # P44
13 = "CLK"      # P47
14 = "FC2"      # P52
15 = "#IPL1"    # P55

# The 16-bit boards (MC68000P, HD68000PS, MC68000FN): the address mux by
# phase, against the strobes and #DTACK.
# MUX0-MUX7 by ASEL1:ASEL0 00/01/10/11: P30 A0/A4/A12/A8, P31 A1/A5/A13/A9,
# P32 A2/A6/A14/A10, P33 A3/A7/A15/A11 (U3, U4); P34 A16/A20/FC0/-,
# P35 A17/A21/FC1/-, P36 A18/A22/FC2/-, P37 A19/A23/MODE/- (U5, U6).
# Reset: #AS rests low with the CPU parked, so its first fall after R is
# the first bus cycle.
[mc68000-addr]
 0 = { pin = "P30", signal = "MUX0" }
 1 = { pin = "P31", signal = "MUX1" }
 2 = { pin = "P32", signal = "MUX2" }
 3 = { pin = "P33", signal = "MUX3" }
 4 = { pin = "P34", signal = "MUX4" }
 5 = { pin = "P35", signal = "MUX5" }
 6 = { pin = "P36", signal = "MUX6" }
 7 = { pin = "P37", signal = "MUX7" }
 8 = { pin = "P40", signal = "#AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "#UDS" }
11 = { pin = "P43", signal = "#LDS" }
12 = { pin = "P44", signal = "#DTACK" }
13 = { pin = "P47", signal = "CLK" }
14 = { pin = "P54", signal = "ASEL0" }
15 = { pin = "P55", signal = "ASEL1" }
trigger = { signal = "#AS", edge = "fall", before = 50e-6, after = 140e-6 }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL0", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL1", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL0", edge = "fall" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL1", edge = "fall" },
]
display = ["CLK", "#AS", "R/#W", "#UDS", "#LDS", "ASEL1", "ASEL0", "#DTACK",
        "MUX7", "MUX6", "MUX5", "MUX4", "MUX3", "MUX2", "MUX1", "MUX0"]

# The 16-bit boards' bus waves, reset, echoitr and step, one layout with
# no lead moves: #IPL2 falls for level 5 (the ACIA) and level 7 (a halt
# or step) alike. Each ASEL edge closes the selection before it:
#   [0] ASEL0 rising, 00: A0-A3   [1] ASEL1 rising, 01: A4-A7
#   [2] ASEL0 falling, 11: A8-A11 [3] ASEL1 falling, 10: A12-A15
# Reset: trigger on the first bus cycle after #RESET rises.
[mc68000-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "MUX0" }
 2 = { pin = "P31", signal = "MUX1" }
 3 = { pin = "P32", signal = "MUX2" }
 4 = { pin = "P33", signal = "MUX3" }
 5 = { pin = "P40", signal = "#AS" }
 6 = { pin = "P41", signal = "R/#W" }
 7 = { pin = "P42", signal = "#UDS" }
 8 = { pin = "P43", signal = "#LDS" }
 9 = { pin = "P44", signal = "#DTACK" }
10 = { pin = "P46", signal = "#HALT" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P52", signal = "#IPL2" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "ASEL0" }
15 = { pin = "P55", signal = "ASEL1" }
trigger = { signal = "#AS", edge = "fall", when = { "#RESET" = "high" }, before = 50e-6, after = 140e-6 }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL0", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL1", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL0", edge = "fall" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL1", edge = "fall" },
]
display = ["CLK", "#AS", "R/#W", "#UDS", "#LDS", "ASEL1", "ASEL0", "#DTACK",
        "#HALT", "#IPL2", "#RESET", "MUX3", "MUX2", "MUX1", "MUX0", "D0"]

# echoitr: the ACIA's receive interrupt at level 5, the handler and the
# echo it queues for the transmit interrupt.
[mc68000-echoitr]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "MUX0" }
 2 = { pin = "P31", signal = "MUX1" }
 3 = { pin = "P32", signal = "MUX2" }
