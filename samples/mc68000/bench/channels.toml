# Channel labels for the MC68008P board. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.

# Reset and the first cycles: the strobes, #DTACK and the clock, with
# enough address and FC to place each cycle.
[mc68008-reset]
 0 = "A0"       # P20
 1 = "A1"       # P21
 2 = "MUX0"     # P30: A8/A12 by ASEL
 3 = "A16"      # P34
 4 = "D0"       # P10
 5 = "D1"       # P11
 6 = "#AS"      # P40
 7 = "R/#W"     # P41
 8 = "#IPL2/0"  # P42
 9 = "#DS"      # P43
10 = "#DTACK"   # P44
11 = "#HALT"    # P46
12 = "CLK"      # P47
13 = "FC2"      # P52
14 = "#RESET"   # P53
15 = "ASEL"     # P54

# A cycle's data against its strobes, and the interrupt lines for a halt.
[mc68008-data]
 0 = "D0"       # P10
 1 = "D1"       # P11
 2 = "D2"       # P12
 3 = "D3"       # P13
 4 = "D4"       # P14
 5 = "D5"       # P15
 6 = "D6"       # P16
 7 = "D7"       # P17
 8 = "#AS"      # P40
 9 = "R/#W"     # P41
10 = "#IPL2/0"  # P42
11 = "#DS"      # P43
12 = "#DTACK"   # P44
13 = "CLK"      # P47
14 = "FC2"      # P52
15 = "#IPL1"    # P55
