 7 = { pin = "P42", signal = "#UDS" }
 8 = { pin = "P43", signal = "#LDS" }
 9 = { pin = "P44", signal = "#DTACK" }
10 = { pin = "P46", signal = "#HALT" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P52", signal = "#IPL2" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "ASEL0" }
15 = { pin = "P55", signal = "ASEL1" }
trigger = { signal = "#IPL2", edge = "fall", before = 50e-6, after = 7.27e-3, long = true }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL0", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL1", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL0", edge = "fall" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3"], clock = "ASEL1", edge = "fall" },
]
display = ["CLK", "#AS", "R/#W", "#UDS", "#LDS", "ASEL1", "ASEL0", "#DTACK",
        "#HALT", "#IPL2", "#RESET", "MUX3", "MUX2", "MUX1", "MUX0", "D0"]

# Six steps from a halt, sent as one write: each restore returns to the
# program with T set, and its trace exception parks the CPU again, in a
# read #DTACK withholds: the first #AS rise is the first step.
[mc68000-step]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P30", signal = "MUX0" }
 2 = { pin = "P31", signal = "MUX1" }
 3 = { pin = "P32", signal = "MUX2" }
 4 = { pin = "P33", signal = "MUX3" }
