# Channel labels for the MC68000-family boards. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.

# Reset and the first cycles: the strobes, #DTACK and the clock, with
# enough address and FC to place each cycle.
[mc68008-reset]
 0 = "A0"       # P20
 1 = "A1"       # P21
 2 = "MUX0"     # P30: A8/A12 by ASEL
 3 = "A16"      # P34
 4 = "D0"       # P10
 5 = "D1"       # P11
 6 = "#AS"      # P40
 7 = "R/#W"     # P41
 8 = "#IPL2/0"  # P42
 9 = "#DS"      # P43
10 = "#DTACK"   # P44
11 = "#HALT"    # P46
12 = "CLK"      # P47
13 = "FC2"      # P52
14 = "#RESET"   # P53
15 = "ASEL"     # P54

# A cycle's data against its strobes, and the interrupt lines for a halt.
[mc68008-data]
 0 = "D0"       # P10
 1 = "D1"       # P11
 2 = "D2"       # P12
 3 = "D3"       # P13
 4 = "D4"       # P14
 5 = "D5"       # P15
 6 = "D6"       # P16
 7 = "D7"       # P17
 8 = "#AS"      # P40
 9 = "R/#W"     # P41
10 = "#IPL2/0"  # P42
11 = "#DS"      # P43
12 = "#DTACK"   # P44
13 = "CLK"      # P47
14 = "FC2"      # P52
15 = "#IPL1"    # P55

# The 16-bit boards (MC68000P, HD68HC000PS, MC68000FN): the address mux by
# phase, against the strobes and #DTACK.
[mc68000-addr]
 0 = "MUX0"     # P30: A0/A4/A12/A8 by ASEL1:ASEL0 00/01/10/11
 1 = "MUX1"     # P31: A1/A5/A13/A9
 2 = "MUX2"     # P32: A2/A6/A14/A10
 3 = "MUX3"     # P33: A3/A7/A15/A11
 4 = "MUX4"     # P34: A16/A20/FC0/-
 5 = "MUX5"     # P35: A17/A21/FC1/-
 6 = "MUX6"     # P36: A18/A22/FC2/-
 7 = "MUX7"     # P37: A19/A23/MODE/-
 8 = "#AS"      # P40
 9 = "R/#W"     # P41
10 = "#UDS"     # P42
11 = "#LDS"     # P43
12 = "#DTACK"   # P44
13 = "CLK"      # P47
14 = "ASEL0"    # P54
15 = "ASEL1"    # P55

# Reset and a halt: the strobes, the interrupt level and the low data.
[mc68000-reset]
 0 = "D0"       # P10
 1 = "D1"       # P11
 2 = "D8"       # P20
 3 = "D9"       # P21
 4 = "MUX0"     # P30: A0/A4/A12/A8 by ASEL1:ASEL0
 5 = "#AS"      # P40
 6 = "R/#W"     # P41
 7 = "#UDS"     # P42
 8 = "#LDS"     # P43
 9 = "#DTACK"   # P44
10 = "#HALT"    # P46
11 = "CLK"      # P47
12 = "#IPL0"    # P50
13 = "#IPL2"    # P52
14 = "#RESET"   # P53
15 = "ASEL0"    # P54
