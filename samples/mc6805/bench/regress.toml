# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for.
chips = ["MC68HC05C0", "MC68HC08AZ0"]

# The MC146805E2 has its own file, regress_mc146805e2.toml.

# The samples are built for the MC146805E2's ACIA at 17F8, external memory
# on both chips (internal below 0240 on the MC68HC05C0, 0A00-FDFF external
# on the MC68HC08AZ0).
[devices]
ACIA = "17F8"

# Reset loads PC from the vector at FFFE; the value is the one the loaded
# sample puts there. Both chips preset SP to $00FF (MC68HC05C0 and
# MC68HC08AZ0 data sheets, stack pointer).
[reset]
PC = "[FFFE FFFF]"
SP = "00FF"

# Only mandelbrot runs on these chips; the others have their own samples
# in samples/mc68hc05 and samples/mc68hc08.
[arith]
skip = true

[echo]
skip = true

[echoir]
skip = true

[echoitr]
skip = true

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

[haltgo]
program = "mandelbrot"

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
