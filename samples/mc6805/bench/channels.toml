# Channel labels for the MC68HC08AZ0. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[mc68hc08az0]
 0 = "ED0"    # P10
 1 = "ED1"    # P11
 2 = "ED2"    # P12
 3 = "ED3"    # P13
 4 = "ED4"    # P14
 5 = "ED5"    # P15
 6 = "ED6"    # P16
 7 = "ED7"    # P17
 8 = "REB"    # P40
 9 = "WEB"    # P41
10 = "PTC0"   # P42
11 = "MCLK"   # P46
12 = "OSC1"   # P47
13 = "#IRQ"   # P50
14 = "#RST"   # P53
15 = "debug"  # P56
