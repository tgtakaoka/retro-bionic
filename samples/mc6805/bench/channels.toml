# Channel labels for the MC146805E2 board. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[mc146805e2]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "AS"      # P40
 9 = "R/#W"    # P41
10 = "LI"      # P42
11 = "DS"      # P43
12 = "OSC1"    # P46
13 = "#IRQ"    # P50
14 = "debug"   # P56
15 = "#RESET"  # P53
