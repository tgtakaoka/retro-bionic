# Channel labels for the MC146805E2 board. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[mc146805e2]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "LI" }
11 = { pin = "P43", signal = "DS" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }

# The reset sequence: #RESET negates, then the register save.
[mc146805e2-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "LI" }
11 = { pin = "P43", signal = "DS" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#RESET", edge = "rise", before = 30e-6, after = 30e-6 }
display = ["OSC1", "AS", "DS", "R/#W", "LI", "debug", "#IRQ", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "DS", edge = "fall" },
]

# A halt and two steps: the echo sample runs until the halt port stops it;
# the run ends about 850 us before the halt's register save, the first
# write since, and each step's restore, cycles and save follow.
[mc146805e2-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "LI" }
11 = { pin = "P43", signal = "DS" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "DS", edge = "fall", when = { "R/#W" = "low" }, before = 900e-6, after = 800e-6 }
display = ["OSC1", "AS", "DS", "R/#W", "LI", "debug", "#IRQ", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "DS", edge = "fall" },
]

# The echoitr sample's interrupt: #IRQ asserts, the CPU stacks and runs
# the handler.
[mc146805e2-echoitr]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "LI" }
11 = { pin = "P43", signal = "DS" }
12 = { pin = "P46", signal = "OSC1" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#IRQ", edge = "fall", before = 10e-6, after = 13e-3, long = true }
display = ["OSC1", "AS", "DS", "R/#W", "LI", "debug", "#IRQ", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "DS", edge = "fall" },
]
