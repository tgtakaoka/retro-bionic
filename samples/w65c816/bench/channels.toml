# Channel labels for the W65C816S, checked against a reset: VPA and VDA
# are both high on an opcode fetch, VDA alone on a data access and neither
# on an internal cycle, PHI2 is the clock the debugger drives, and #RES and
# RDY step through the reset. Verify against the wiring before trusting it
# -- a lead moved on the bench leaves this stale. '# Pxx' comments are that
# channel's pin name on the Bionic Connector.
[w65c816s]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "R/#W"    # P41
 9 = "VPA"     # P42
10 = "VDA"     # P43
11 = "#IRQ"    # P50
12 = "#NMI"    # P51
13 = "RDY"     # P52
14 = "#RES"    # P53
15 = "PHI2"    # P55
