# Channel labels for the W65C816S, checked against a reset: VPA and VDA are
# both high on an opcode fetch, VDA alone on a data access and neither on an
# internal cycle, PHI2 is the clock the debugger drives, and #RES and RDY
# step through the reset. Verify against the wiring before trusting it -- a
# lead moved on the bench leaves this stale.
[w65c816s]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "VPA" }
10 = { pin = "P43", signal = "VDA" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI2" }

# The reset sequence: #RES negates, the vector fetch, the part
# detection and the register save.
[w65c816s-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "VPA" }
10 = { pin = "P43", signal = "VDA" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI2" }
trigger = { signal = "#RES", edge = "rise", before = 10e-6, after = 60e-6 }
display = ["PHI2", "VPA", "VDA", "R/#W", "RDY", "#IRQ", "#NMI", "#RES", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2", edge = "fall" },
]

# The echoitr sample's interrupt: the ACIA asserts #IRQ, the CPU
# stacks PC and P and runs the handler.
[w65c816s-echoitr]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "VPA" }
10 = { pin = "P43", signal = "VDA" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI2" }
trigger = { signal = "#IRQ", edge = "fall", before = 10e-6, after = 6e-3 }
display = ["PHI2", "VPA", "VDA", "R/#W", "RDY", "#IRQ", "#NMI", "#RES", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2", edge = "fall" },
]

# Three steps, sent in one write: each lets the CPU run one instruction,
# then the NMI that stops it and the register save.
[w65c816s-step]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "VPA" }
10 = { pin = "P43", signal = "VDA" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI2" }
trigger = { signal = "RDY", edge = "rise", before = 10e-6, after = 400e-6 }
display = ["PHI2", "VPA", "VDA", "R/#W", "RDY", "#IRQ", "#NMI", "#RES", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2", edge = "fall" },
]
