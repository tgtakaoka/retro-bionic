# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for.
chips = ["W65C816S"]

# Reset loads PC from the vector at FFFC; the value is the one the
# loaded sample puts there. It enters emulation mode (W65C816S data
# sheet, RESB), so the dump takes the 6502 form with E=1; that form shows
# neither D nor DBR, and S's low byte is undefined.
[reset]
PC = "[FFFD FFFC]"
E = "1"

[arith]
expect = """
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
18000 - -18000 = -29536
-28000 - -18000 = -10000
100 * 300 = 30000
200 * 100 = 20000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
-28000 = -28000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# CPU variant probe: leaves its answer in A and spins, printing nothing.
[detect]
skip = true

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# mandelbrot runs in native mode (clc; xce), where the dump prints the PC
# as "K:PC=bb:aaaa"; the bank is read as part of the address.

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
