# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The DCJ11's EIS and FP11; the DCT11 has neither. The DCJ11 runs
# samples/pdp11 too.
chips = ["DCJ11"]

# Power-up mode 2 starts at 173000 with PS 340 (DCJ11 User's Guide,
# Figure 8-3).
[reset]
radix = 8
PC = "173000"
PS = "340"

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# One frame, checked whole. The golden comes from
# samples/arith/fmandel.cpp in IEEE single precision.
[fmandel]
golden = "samples/arith/fmandel.golden"
frames = 1

[haltgo]
program = "fmandel"

[breakpoint]
program = "fmandel"
break_at = "loop_x"

# loop_y is reached once per row.
[gountil]
program = "fmandel"
break_at = "loop_y"
