# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The DCJ11's EIS and FP11; the DCT11 has neither. The DCJ11 runs
# samples/pdp11 too.
chips = ["DCJ11"]

# Power-up mode 3 starts at 1000 with PS 340 (DCJ11 User's Guide,
# Figure 8-3).
[reset]
radix = 8
PC = "1000"
PS = "340"

# A reset keeps SP, so after power-up it may lie below 400, where the
# trace trap takes a yellow stack trap and the step is refused.
[step]
set = { SP = "1000" }

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# One frame, checked whole. The golden comes from
# samples/arith/fmandel.cpp in IEEE single precision.
[fmandel]
golden = "samples/arith/fmandel.golden"
frames = 1

# fmandel in double precision; fmandel.cpp in double prints the same
# frame.
[dmandel]
golden = "samples/arith/fmandel.golden"
frames = 1

# Prints a digit a second from the line clock's interrupts, then stops.
[clock]
expect = "123"

# Writes drive 0's last sector and reads it back, by interrupts, then
# puts it back as it was. It needs a disk image mounted, which loading
# its bootstrap from the SD card does.
[rk11]
expect = "RK11 OK"
skip = true

# Boots the disk image of its name beside it on the SD card.
[unix_v6]
skip = true

[haltgo]
program = "fmandel"

[breakpoint]
program = "fmandel"
break_at = "loop_x"

# loop_y is reached once per row.
[gountil]
program = "fmandel"
break_at = "loop_y"

# loop_y starts a row, after the last one's newline.
[backtrace]
program = "fmandel"
break_at = "loop_y"
