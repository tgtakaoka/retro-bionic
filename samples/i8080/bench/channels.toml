# Channel labels for the P8080. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[i8080]
 0 = "D0"     # P10
 1 = "D1"     # P11
 2 = "D2"     # P12
 3 = "D3"     # P13
 4 = "D4"     # P14
 5 = "D5"     # P15
 6 = "D6"     # P16
 7 = "D7"     # P17
 8 = "DBIN"   # P40
 9 = "#WR"    # P41
10 = "SYNC"   # P42
11 = "PHI1"   # P46
12 = "PHI2"   # P47
13 = "INT"    # P50
14 = "RESET"  # P53
15 = "READY"  # P54
