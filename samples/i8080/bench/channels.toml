# Channel labels for the P8080. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[i8080]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "DBIN" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "SYNC" }
11 = { pin = "P44", signal = "RESET" }
12 = { pin = "P47", signal = "PHI2" }
13 = { pin = "P53", signal = "PHI1" }
14 = { pin = "P54", signal = "READY" }
15 = { pin = "P55", signal = "WAIT" }

# The two-phase clock on both sides of the gate driver, with no CPU fitted:
# PHI1 and PHI2 must reach the socket at full swing, never high together,
# and keep tD1/tD2 at the CPU after the driver's turn-off skew.
[p8080-clock]
 0 = { pin = "P44", signal = "RESET" }
 1 = { pin = "P47", signal = "PHI2" }
 2 = { pin = "U1-15", signal = "PHI2@CPU", analog = [12, -2] }
 3 = { pin = "P53", signal = "PHI1" }
 4 = { pin = "U1-22", signal = "PHI1@CPU", analog = [12, -2] }
trigger = { signal = "RESET", edge = "fall", before = 5e-6, after = 10e-6, rate = { digital = 125e6, analog = 50e6 } }
display = ["PHI1", "PHI1@CPU", "PHI2", "PHI2@CPU", "RESET"]

# Rate tuning with the CPU in: the two phases on both sides of the
# driver, SYNC and DBIN to place a cycle, READY for the wait window.
[p8080-tune]
 0 = { pin = "P40", signal = "DBIN" }
 1 = { pin = "P42", signal = "SYNC" }
 2 = { pin = "P44", signal = "RESET" }
 3 = { pin = "P47", signal = "PHI2" }
 4 = { pin = "U1-15", signal = "PHI2@CPU", analog = [12, -2] }
 5 = { pin = "P53", signal = "PHI1" }
 6 = { pin = "U1-22", signal = "PHI1@CPU", analog = [12, -2] }
 7 = { pin = "P54", signal = "READY" }
trigger = { signal = "SYNC", edge = "rise", before = 2e-6, after = 8e-6, rate = { digital = 125e6, analog = 50e6 } }
display = ["PHI1", "PHI1@CPU", "PHI2", "PHI2@CPU", "SYNC", "DBIN", "READY", "RESET"]

# The same leads around the reset release.
[p8080-tune-reset]
 0 = { pin = "P40", signal = "DBIN" }
 1 = { pin = "P42", signal = "SYNC" }
 2 = { pin = "P44", signal = "RESET" }
 3 = { pin = "P47", signal = "PHI2" }
 4 = { pin = "U1-15", signal = "PHI2@CPU", analog = [12, -2] }
 5 = { pin = "P53", signal = "PHI1" }
 6 = { pin = "U1-22", signal = "PHI1@CPU", analog = [12, -2] }
 7 = { pin = "P54", signal = "READY" }
trigger = { signal = "RESET", edge = "fall", before = 5e-6, after = 10e-6, rate = { digital = 125e6, analog = 50e6 } }
display = ["PHI1", "PHI1@CPU", "PHI2", "PHI2@CPU", "SYNC", "DBIN", "READY", "RESET"]
