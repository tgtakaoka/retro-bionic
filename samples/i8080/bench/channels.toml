# Channel labels for the P8080. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[i8080]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "DBIN" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P42", signal = "SYNC" }
11 = { pin = "P46", signal = "PHI1" }
12 = { pin = "P47", signal = "PHI2" }
13 = { pin = "P53", signal = "RESET" }
14 = { pin = "P54", signal = "READY" }
15 = { pin = "P55", signal = "WAIT" }
