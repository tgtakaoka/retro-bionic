# Channel labels for the MC68HC12B board. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.

[mc68hc12]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "AD8"     # P20
 9 = "R/#W"    # P41
10 = "IPIPE0"  # P42
11 = "IPIPE1"  # P43
12 = "EXTAL"   # P46
13 = "E"       # P47
14 = "#RESET"  # P53
15 = "#LSTRB"  # P54

[mc68hc12-reset]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD8"     # P20
 3 = "AD9"     # P21
 4 = "#DBE"    # P40
 5 = "R/#W"    # P41
 6 = "IPIPE0"  # P42
 7 = "IPIPE1"  # P43
 8 = "BKGD"    # P44
 9 = "EXTAL"   # P46
10 = "E"       # P47
11 = "#IRQ"    # P50
12 = "#XIRQ"   # P51
13 = "#RESET"  # P53
14 = "#LSTRB"  # P54
15 = "debug"   # P56
