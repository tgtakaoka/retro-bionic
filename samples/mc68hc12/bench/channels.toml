# Channel labels for the MC68HC12B board. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[mc68hc12]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P20", signal = "AD8" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "IPIPE0" }
11 = { pin = "P43", signal = "IPIPE1" }
12 = { pin = "P46", signal = "EXTAL" }
13 = { pin = "P47", signal = "E" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#LSTRB" }

[mc68hc12-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P20", signal = "AD8" }
 3 = { pin = "P21", signal = "AD9" }
 4 = { pin = "P40", signal = "#DBE" }
 5 = { pin = "P41", signal = "R/#W" }
 6 = { pin = "P42", signal = "IPIPE0" }
 7 = { pin = "P43", signal = "IPIPE1" }
 8 = { pin = "P44", signal = "BKGD" }
 9 = { pin = "P46", signal = "EXTAL" }
10 = { pin = "P47", signal = "E" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#XIRQ" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "#LSTRB" }
15 = { pin = "P56", signal = "debug" }
