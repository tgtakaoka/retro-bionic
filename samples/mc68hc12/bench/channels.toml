# Channel labels for the MC68HC12B board. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.

[mc68hc12]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD8"     # P20
 3 = "AD9"     # P21
 4 = "#DBE"    # P40
 5 = "R/#W"    # P41
 6 = "IPIPE0"  # P42
 7 = "IPIPE1"  # P43
 8 = "EXTAL"   # P46
 9 = "E"       # P47
10 = "#IRQ"    # P50
11 = "#XIRQ"   # P51
12 = "#RESET"  # P53
13 = "#LSTRB"  # P54
14 = "debug"   # P56
15 = "BKGD"    # P44
