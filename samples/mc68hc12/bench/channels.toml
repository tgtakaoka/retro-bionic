# Channel labels for the MC68HC12B board. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale.

[mc68hc12]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P20", signal = "AD8" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "IPIPE0" }
11 = { pin = "P43", signal = "IPIPE1" }
12 = { pin = "P46", signal = "EXTAL" }
13 = { pin = "P47", signal = "E" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#LSTRB" }

[mc68hc12-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P20", signal = "AD8" }
 3 = { pin = "P21", signal = "AD9" }
 4 = { pin = "P40", signal = "#DBE" }
 5 = { pin = "P41", signal = "R/#W" }
 6 = { pin = "P42", signal = "IPIPE0" }
 7 = { pin = "P43", signal = "IPIPE1" }
 8 = { pin = "P44", signal = "BKGD" }
 9 = { pin = "P46", signal = "EXTAL" }
10 = { pin = "P47", signal = "E" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#XIRQ" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "#LSTRB" }
15 = { pin = "P56", signal = "debug" }

# The MC9S12D board's reset: the mode pins, E against EXTAL, and the
# first fetches.
[mc9s12d-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P17", signal = "AD7" }
 4 = { pin = "P20", signal = "AD8" }
 5 = { pin = "P21", signal = "AD9" }
 6 = { pin = "P27", signal = "AD15" }
 7 = { pin = "P40", signal = "XCLKS/NOACC" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "MODA/IPIPE0" }
10 = { pin = "P43", signal = "MODB/IPIPE1" }
11 = { pin = "P44", signal = "BKGD" }
12 = { pin = "P46", signal = "EXTAL" }
13 = { pin = "P47", signal = "E" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#LSTRB" }
trigger = { signal = "#RESET", edge = "rise", before = 20e-6, after = 2e-3 }

# The MC9S12D board's full multiplexed bus, for decoding addresses and
# data where E is not needed.
[mc9s12d-ad]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P20", signal = "AD8" }
 9 = { pin = "P21", signal = "AD9" }
10 = { pin = "P22", signal = "AD10" }
11 = { pin = "P23", signal = "AD11" }
12 = { pin = "P24", signal = "AD12" }
13 = { pin = "P25", signal = "AD13" }
14 = { pin = "P26", signal = "AD14" }
15 = { pin = "P27", signal = "AD15" }

# The MC9S12D board's free-cycle marking: NOACC and E against EXTAL, with
# enough of the bus to tell the fetches apart.
[mc9s12d-noacc]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P20", signal = "AD8" }
 9 = { pin = "P21", signal = "AD9" }
10 = { pin = "P25", signal = "AD13" }
11 = { pin = "P40", signal = "NOACC" }
12 = { pin = "P41", signal = "R/#W" }
13 = { pin = "P46", signal = "EXTAL" }
14 = { pin = "P47", signal = "E" }
15 = { pin = "P54", signal = "#LSTRB" }

# The MC9S12D board's SCI0: RXD0/TXD0 bit timing against E.
[mc9s12d-sci]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P20", signal = "AD8" }
 9 = { pin = "P21", signal = "AD9" }
10 = { pin = "P30", signal = "RXD0" }
11 = { pin = "P31", signal = "TXD0" }
12 = { pin = "P40", signal = "NOACC" }
13 = { pin = "P41", signal = "R/#W" }
14 = { pin = "P46", signal = "EXTAL" }
15 = { pin = "P47", signal = "E" }
