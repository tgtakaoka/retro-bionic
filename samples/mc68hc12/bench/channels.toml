# The MC9S12XDP512's reset, step and echoitr: the mux outputs against
# ECLK and ASEL1:0. Each ASEL edge closes the selection before it, so
# the four decoders hold one selection each, the address in ECLK high
# and the rest in ECLK low.
#   [0] ASEL0 rising, 00: A19-A16:A3-A0; IQSTAT3:0:IVD3-0
#   [1] ASEL1 rising, 01: A22-A20:A7-A4; ACC2:0:IVD7-4 when IVD is read
#   [2] ASEL0 falling, 11 or 01: A11-A8; ACC2:0 when IVD isn't read,
#       IVD11-8 when it is
#   [3] ASEL1 falling, 10: A15-A12; IVD15-12 when IVD is read
# Repeat cycles show no address.
[mc9s12xdp512-reset]
 0 = { pin = "P30", signal = "MUX0" }
 1 = { pin = "P31", signal = "MUX1" }
 2 = { pin = "P32", signal = "MUX2" }
 3 = { pin = "P33", signal = "MUX3" }
 4 = { pin = "P34", signal = "MUX4" }
 5 = { pin = "P35", signal = "MUX5" }
 6 = { pin = "P36", signal = "MUX6" }
 7 = { pin = "P37", signal = "MUX7" }
 8 = { pin = "P40", signal = "ECLK" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "#LSTRB" }
11 = { pin = "P47", signal = "EXTAL" }
12 = { pin = "P53", signal = "#RESET" }
13 = { pin = "P54", signal = "ASEL0" }
14 = { pin = "P55", signal = "ASEL1" }
trigger = { signal = "#RESET", edge = "rise", before = 20e-6, after = 100e-6 }
parallel = [
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL0", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL1", edge = "rise" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL0", edge = "fall" },
  { data = ["MUX0", "MUX1", "MUX2", "MUX3", "MUX4", "MUX5", "MUX6", "MUX7"], clock = "ASEL1", edge = "fall" },
]
display = ["EXTAL", "ECLK", "R/#W", "#LSTRB", "ASEL1", "ASEL0", "#RESET",
        "MUX7", "MUX6", "MUX5", "MUX4", "MUX3", "MUX2", "MUX1", "MUX0"]

