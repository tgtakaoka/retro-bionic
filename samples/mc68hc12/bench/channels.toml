# Channel labels for the MC68HC12 family boards: each chip's reset,
# echoitr and step captures. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

# The MC68HC912BD32's reset, step and echoitr: AD7-AD0 carry the low
# address byte at the E rise and the data at the E fall, while #DBE is
# low; IPIPE1:0 the execution start before the E rise and the queue
# movement before the E fall.
[mc68hc912bd32-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#DBE" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "IPIPE0" }
11 = { pin = "P43", signal = "IPIPE1" }
12 = { pin = "P46", signal = "EXTAL" }
13 = { pin = "P47", signal = "E" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#LSTRB" }
trigger = { signal = "#RESET", edge = "rise", before = 20e-6, after = 100e-6 }
parallel = [
  { data = ["IPIPE0", "IPIPE1"], clock = "E", edge = "dual" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "fall" },
]
display = ["EXTAL", "E", "R/#W", "#LSTRB", "#DBE", "IPIPE1", "IPIPE0", "#RESET",
        "AD7", "AD6", "AD5", "AD4", "AD3", "AD2", "AD1", "AD0"]

# Eight steps from a halt, sent as one write: each restore returns to the
# program with RTI, and the #XIRQ the debugger asserts after one
# instruction parks the CPU again.
[mc68hc912bd32-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#DBE" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "IPIPE0" }
11 = { pin = "P43", signal = "IPIPE1" }
12 = { pin = "P46", signal = "EXTAL" }
13 = { pin = "P47", signal = "E" }
14 = { pin = "P51", signal = "#XIRQ" }
15 = { pin = "P54", signal = "#LSTRB" }
trigger = { signal = "#XIRQ", edge = "fall", before = 40e-6, after = 600e-6 }
parallel = [
  { data = ["IPIPE0", "IPIPE1"], clock = "E", edge = "dual" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "fall" },
]
display = ["EXTAL", "E", "R/#W", "#LSTRB", "#DBE", "IPIPE1", "IPIPE0", "#XIRQ",
        "AD7", "AD6", "AD5", "AD4", "AD3", "AD2", "AD1", "AD0"]

# echoitr: the ACIA's receive interrupt on #IRQ, the handler and the
# echo it queues for the transmit interrupt.
[mc68hc912bd32-echoitr]
