 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#DBE" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "IPIPE0" }
11 = { pin = "P43", signal = "IPIPE1" }
12 = { pin = "P46", signal = "EXTAL" }
13 = { pin = "P47", signal = "E" }
14 = { pin = "P50", signal = "#IRQ" }
15 = { pin = "P54", signal = "#LSTRB" }
trigger = { signal = "#IRQ", edge = "fall", before = 20e-6, after = 3.8e-3 }
parallel = [
  { data = ["IPIPE0", "IPIPE1"], clock = "E", edge = "dual" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "fall" },
]
display = ["EXTAL", "E", "R/#W", "#LSTRB", "#DBE", "IPIPE1", "IPIPE0", "#IRQ",
        "AD7", "AD6", "AD5", "AD4", "AD3", "AD2", "AD1", "AD0"]

