# Channel labels for the Z380. Checked against the board: P30-P37 decoded
# through the ASEL steps match the addresses in the firmware's own ring,
# #MRD frames each fetch with #WAIT holding the reset fetch, CLKI runs
# throughout and #RESET pulses low. D0-D3 have not been checked against a
# capture yet. Verify against the wiring before trusting it -- a lead moved
# on the bench leaves this stale.  P30-P33 carry a nibble of A0-A15 picked
# by ASEL1:ASEL0: A0-A3 at 00, A4-A7 at 01, A12-A15 at 10, A8-A11 at 11.
# D0-D3 are the low nibble of the byte lane #BLEN enables.
[z380]
 0 = { pin = "P30", signal = "A0/4/12/8" }
 1 = { pin = "P31", signal = "A1/5/13/9" }
 2 = { pin = "P32", signal = "A2/6/14/10" }
 3 = { pin = "P33", signal = "A3/7/15/11" }
 4 = { pin = "P10", signal = "D0" }
 5 = { pin = "P11", signal = "D1" }
 6 = { pin = "P12", signal = "D2" }
 7 = { pin = "P13", signal = "D3" }
 8 = { pin = "P41", signal = "#MRD" }
 9 = { pin = "P42", signal = "#MWR" }
10 = { pin = "P44", signal = "ASEL0" }
11 = { pin = "P45", signal = "ASEL1" }
12 = { pin = "P47", signal = "CLKI" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#BLEN" }

# All of A0-A31 through the muxes, for checking the address path: D0-D3
# give way to P34-P37, and #BHEN takes #BLEN's place. P34-P37 carry a
# nibble of A16-A31 picked by ASEL1:ASEL0: A16-A19 at 00, A20-A23 at 01,
# A28-A31 at 10, A24-A27 at 11.
[z380-addr]
 0 = { pin = "P30", signal = "A0/4/12/8" }
 1 = { pin = "P31", signal = "A1/5/13/9" }
 2 = { pin = "P32", signal = "A2/6/14/10" }
 3 = { pin = "P33", signal = "A3/7/15/11" }
 4 = { pin = "P34", signal = "A16/20/28/24" }
 5 = { pin = "P35", signal = "A17/21/29/25" }
 6 = { pin = "P36", signal = "A18/22/30/26" }
 7 = { pin = "P37", signal = "A19/23/31/27" }
 8 = { pin = "P41", signal = "#MRD" }
 9 = { pin = "P42", signal = "#MWR" }
10 = { pin = "P44", signal = "ASEL0" }
11 = { pin = "P45", signal = "ASEL1" }
12 = { pin = "P47", signal = "CLKI" }
13 = { pin = "P52", signal = "#WAIT" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P55", signal = "#BHEN" }

# Bus timing of the normal image: the clock it drives, each strobe, the
# address mux steps, the lanes it drives data on, and #INT0/#NMI.
[z380-timing]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P20", signal = "D8" }
 2 = { pin = "P30", signal = "A0/4/12/8" }
 3 = { pin = "P31", signal = "A1/5/13/9" }
 4 = { pin = "P40", signal = "#M1" }
 5 = { pin = "P41", signal = "#MRD" }
 6 = { pin = "P42", signal = "#MWR" }
 7 = { pin = "P43", signal = "#IORD" }
 8 = { pin = "P44", signal = "ASEL0" }
 9 = { pin = "P45", signal = "ASEL1" }
10 = { pin = "P46", signal = "#IOWR" }
11 = { pin = "P47", signal = "CLKI" }
12 = { pin = "P50", signal = "#INT0" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P55", signal = "#BHEN" }
