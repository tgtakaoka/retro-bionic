# Channel labels for the Z380. Checked against the board: P30-P37 decoded
# through the ASEL steps match the addresses in the firmware's own ring,
# #MRD frames each fetch with #WAIT holding the reset fetch, CLKI runs
# throughout and #RESET pulses low. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.
#
# P30-P33 carry a nibble of A0-A15 picked by ASEL1:ASEL0: A0-A3 at 00,
# A4-A7 at 01, A12-A15 at 10, A8-A11 at 11.
[z380]
 0 = "A0/4/12/8"    # P30
 1 = "A1/5/13/9"    # P31
 2 = "A2/6/14/10"   # P32
 3 = "A3/7/15/11"   # P33
 4 = "#M1"          # P40
 5 = "#MRD"         # P41
 6 = "#MWR"         # P42
 7 = "#IORD"        # P43
 8 = "ASEL0"        # P44
 9 = "ASEL1"        # P45
10 = "#IOWR"        # P46
11 = "CLKI"         # P47
12 = "#WAIT"        # P52
13 = "#RESET"       # P53
14 = "#BLEN"        # P54
15 = "#BHEN"        # P55

# All of A0-A31 through the muxes, for checking the address path: #M1,
# #IORD, #IOWR and #BLEN give way to P34-P37, which carry a nibble of
# A16-A31 picked by ASEL1:ASEL0: A16-A19 at 00, A20-A23 at 01, A28-A31 at
# 10, A24-A27 at 11.
[z380-addr]
 0 = "A0/4/12/8"     # P30
 1 = "A1/5/13/9"     # P31
 2 = "A2/6/14/10"    # P32
 3 = "A3/7/15/11"    # P33
 4 = "A16/20/28/24"  # P34
 5 = "A17/21/29/25"  # P35
 6 = "A18/22/30/26"  # P36
 7 = "A19/23/31/27"  # P37
 8 = "#MRD"          # P41
 9 = "#MWR"          # P42
10 = "ASEL0"         # P44
11 = "ASEL1"         # P45
12 = "CLKI"          # P47
13 = "#WAIT"         # P52
14 = "#RESET"        # P53
15 = "#BHEN"         # P55

# Bus timing of the normal image: the clock it drives, each strobe, the
# address mux steps, the lanes it drives data on, and #INT0/#NMI.
[z380-timing]
 0 = "D0"           # P10
 1 = "D8"           # P20
 2 = "A0/4/12/8"    # P30
 3 = "A1/5/13/9"    # P31
 4 = "#M1"          # P40
 5 = "#MRD"         # P41
 6 = "#MWR"         # P42
 7 = "#IORD"        # P43
 8 = "ASEL0"        # P44
 9 = "ASEL1"        # P45
10 = "#IOWR"        # P46
11 = "CLKI"         # P47
12 = "#INT0"        # P50
13 = "#NMI"         # P51
14 = "#WAIT"        # P52
15 = "#BHEN"        # P55
