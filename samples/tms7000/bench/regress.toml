# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for.
chips = ["TMS7000", "TMS7000NL4", "TMS70C00", "TMS7001", "TMS7001NL4", "TMS7002", "TMS70C02"]


# Reset loads PC from the vector at FFFE; the value is the one the
# loaded sample puts there. It loads SP with >01 and clears ST (TMS7000
# Family Data Manual 3.1.3 and 3.1.4); A and B get the pre-reset PC.
[reset]
PC = "[FFFE FFFF]"
SP = "01"
ST = "___00000"

[arith]
expect = """
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
18000 - -18000 = -29536
-28000 - -18000 = -10000
100 * 300 = 30000
200 * 100 = 20000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
-28000 = -28000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# Echo through the TMS7002/TMS70C02 on-chip serial port, which only
# reaches the console once "I Serial" selects it -- this suite cannot.
[nmos]
skip = true

[nmosir]
skip = true

[nmositr]
skip = true

[cmos]
skip = true

[cmosir]
skip = true

[cmositr]
skip = true

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
