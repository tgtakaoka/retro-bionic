11 = { pin = "P46", signal = "CLKIN" }
12 = { pin = "P47", signal = "CLKOUT" }
13 = { pin = "P50", signal = "#INT1" }
14 = { pin = "P51", signal = "#INT3" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#RESET", edge = "rise", before = 50e-6, after = 115e-6 }
display = ["CLKIN", "CLKOUT", "ALATCH", "#ENABLE", "R/#W", "#INT1", "#INT3", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "ALATCH", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#ENABLE", edge = "rise" },
