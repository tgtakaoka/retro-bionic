# Channel labels for the TMS7000. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[tms7000]
 0 = "AD0"      # P10
 1 = "AD1"      # P11
 2 = "AD2"      # P12
 3 = "AD3"      # P13
 4 = "AD4"      # P14
 5 = "AD5"      # P15
 6 = "AD6"      # P16
 7 = "AD7"      # P17
 8 = "#ENABLE"  # P40
 9 = "R/#W"     # P41
10 = "ALATCH"   # P43
11 = "CLKIN"    # P46
12 = "CLKOUT"   # P47
13 = "#INT1"    # P50
14 = "#RESET"   # P53
15 = "debug"    # P56
