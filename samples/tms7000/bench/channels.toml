# Channel labels for the TMS7000. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[tms7000]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#ENABLE" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P43", signal = "ALATCH" }
11 = { pin = "P46", signal = "CLKIN" }
12 = { pin = "P47", signal = "CLKOUT" }
13 = { pin = "P50", signal = "#INT1" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P56", signal = "debug" }
