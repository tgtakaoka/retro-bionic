# Channel labels for the MOS6502, checked against a reset: PHI0IN, which the
# debugger drives, and PHI2O run in step, SYNC marks the opcode fetches,
# R/#W the writes, and #RES and RDY step through the reset and the part
# detection. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale. Rev 11 moved PHI2O to P46 and PHI0IN to P47;
# not yet checked on a rev 11 board.
[mos6502]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P46", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P47", signal = "PHI0IN" }

# The W65C02S on the same board, checked against a reset the same way:
# PHI2 is its name for the clock input PHI0IN.
[w65c02s]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P46", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P47", signal = "PHI2" }
