# Channel labels for the MOS6502, checked against a reset: PHI0IN, which the
# debugger drives, and PHI2O run in step, SYNC marks the opcode fetches,
# R/#W the writes, and #RES and RDY step through the reset and the part
# detection. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale.
[mos6502]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P43", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI0IN" }

# The W65C02S on the same board, checked against a reset the same way:
# PHI2 is its name for the clock input PHI0IN.
[w65c02s]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P43", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI2" }

# The reset sequence: #RES negates, the vector fetch, the part
# detection and the register save.
[mos6502-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P43", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI0IN" }
trigger = { signal = "#RES", edge = "rise", before = 10e-6, after = 60e-6 }
display = ["PHI0IN", "PHI2O", "SYNC", "R/#W", "RDY", "#IRQ", "#NMI", "#RES", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2O", edge = "fall" },
]

# The echoitr sample's interrupt: the ACIA asserts #IRQ, the CPU
# stacks PC and P and runs the handler.
[mos6502-echoitr]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P43", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI0IN" }
trigger = { signal = "#IRQ", edge = "fall", before = 10e-6, after = 6e-3 }
display = ["PHI0IN", "PHI2O", "SYNC", "R/#W", "RDY", "#IRQ", "#NMI", "#RES", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2O", edge = "fall" },
]

# Three steps, sent in one write: each lets the CPU run one instruction,
# then the NMI that stops it and the register save.
[mos6502-step]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P42", signal = "SYNC" }
10 = { pin = "P43", signal = "PHI2O" }
11 = { pin = "P50", signal = "#IRQ" }
12 = { pin = "P51", signal = "#NMI" }
13 = { pin = "P52", signal = "RDY" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P55", signal = "PHI0IN" }
trigger = { signal = "RDY", edge = "rise", before = 10e-6, after = 400e-6 }
display = ["PHI0IN", "PHI2O", "SYNC", "R/#W", "RDY", "#IRQ", "#NMI", "#RES", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2O", edge = "fall" },
]

