# Channel labels for the MOS6502, checked against a reset: PHI0IN, which
# the debugger drives, and PHI2O run in step, SYNC marks the opcode
# fetches, R/#W the writes, and #RES and RDY step through the reset and
# the part detection. Verify against the wiring before trusting it -- a
# lead moved on the bench leaves this stale. '# Pxx' comments are that
# channel's pin name on the Bionic Connector.
[mos6502]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "R/#W"    # P41
 9 = "SYNC"    # P42
10 = "PHI2O"   # P43
11 = "#IRQ"    # P50
12 = "#NMI"    # P51
13 = "RDY"     # P52
14 = "#RES"    # P53
15 = "PHI0IN"  # P55

# The W65C02S on the same board, checked against a reset the same way:
# PHI2 is its name for the clock input PHI0IN.
[w65c02s]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "R/#W"    # P41
 9 = "SYNC"    # P42
10 = "PHI2O"   # P43
11 = "#IRQ"    # P50
12 = "#NMI"    # P51
13 = "RDY"     # P52
14 = "#RES"    # P53
15 = "PHI2"    # P55
