 1 = { pin = "P21", signal = "AD6" }
 2 = { pin = "P22", signal = "AD5" }
 3 = { pin = "P23", signal = "AD4" }
 4 = { pin = "P24", signal = "AD3" }
 5 = { pin = "P25", signal = "AD2" }
 6 = { pin = "P26", signal = "AD1" }
 7 = { pin = "P27", signal = "AD0" }
 8 = { pin = "P30", signal = "BST1" }
 9 = { pin = "P31", signal = "BST2" }
10 = { pin = "P32", signal = "BST3" }
11 = { pin = "P40", signal = "#MEM" }
12 = { pin = "P42", signal = "#WE" }
13 = { pin = "P44", signal = "ALATCH" }
14 = { pin = "P45", signal = "#RD" }
15 = { pin = "P46", signal = "CLKIN" }
