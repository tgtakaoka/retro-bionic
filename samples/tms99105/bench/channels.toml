# Channel labels for the TMS99105 and TMS99110, whose boards share these
# pins. Checked against a reset: ALATCH starts each bus cycle with the
# address high byte on AD0-AD7, #RD and #WE strobe the data, and #MEM with
# BST1-BST3 (MSB to LSB) is the bus status code, which decoded the reset's
# INTA, WP, WS and IAQ cycles in order. CLKIN is the clock the debugger
# drives. AD0 is the MSB: channel 0 is AD7. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.
[tms99105]
 0 = "AD7"     # P20
 1 = "AD6"     # P21
 2 = "AD5"     # P22
 3 = "AD4"     # P23
 4 = "AD3"     # P24
 5 = "AD2"     # P25
 6 = "AD1"     # P26
 7 = "AD0"     # P27
 8 = "BST1"    # P30
 9 = "BST2"    # P31
10 = "BST3"    # P32
11 = "#MEM"    # P40
12 = "#WE"     # P42
13 = "ALATCH"  # P44
14 = "#RD"     # P45
15 = "CLKIN"   # P46

# The TMS99110 on the same leads.
[tms99110]
 0 = "AD7"     # P20
 1 = "AD6"     # P21
 2 = "AD5"     # P22
 3 = "AD4"     # P23
 4 = "AD3"     # P24
 5 = "AD2"     # P25
 6 = "AD1"     # P26
 7 = "AD0"     # P27
 8 = "BST1"    # P30
 9 = "BST2"    # P31
10 = "BST3"    # P32
11 = "#MEM"    # P40
12 = "#WE"     # P42
13 = "ALATCH"  # P44
14 = "#RD"     # P45
15 = "CLKIN"   # P46
