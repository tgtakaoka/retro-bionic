# Channel labels for the HD641016 board, taken from hd641016cp_bionic.toml.
# Not yet checked against a board: it is still to be built. Verify against
# the wiring before trusting it -- a lead moved on the bench leaves this
# stale. '# Pxx' comments are that channel's pin name on the Bionic
# Connector.

# Following a program: A1/D0-A3/D2 carry the low address bits while #AS
# asserts and the odd byte's low data bits once #HDS/#LDS do; ST and PF
# give the cycle kind.
[hd641016]
 0 = "A1/D0"   # P10
 1 = "A2/D1"   # P11
 2 = "A3/D2"   # P12
 3 = "PF"      # P37
 4 = "#AS"     # P40
 5 = "R/#W"    # P41
 6 = "#HDS"    # P42
 7 = "#LDS"    # P43
 8 = "#NMI"    # P45
 9 = "PHI"     # P46
10 = "EXTAL"   # P47
11 = "ST0"     # P50
12 = "ST1"     # P51
13 = "ST2"     # P52
14 = "#RES"    # P53
15 = "#WAIT"   # P54

# Reset and the debugger's own pins: the reset vector reads and the
# setup sequence, with #BRTRY and #IRQ0 in place of the low AD lines.
[hd641016-reset]
 0 = "A1/D0"   # P10
 1 = "PF"      # P37
 2 = "#AS"     # P40
 3 = "R/#W"    # P41
 4 = "#HDS"    # P42
 5 = "#LDS"    # P43
 6 = "#IRQ0"   # P44
 7 = "#NMI"    # P45
 8 = "PHI"     # P46
 9 = "EXTAL"   # P47
10 = "ST0"     # P50
11 = "ST1"     # P51
12 = "ST2"     # P52
13 = "#RES"    # P53
14 = "#WAIT"   # P54
15 = "#BRTRY"  # P55
