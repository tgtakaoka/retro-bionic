# Channel labels for the HD641016 board. Verify against the wiring before
# trusting them -- a lead moved on the bench leaves this stale.

# Following a program: A1/D0-A3/D2 carry the low address bits while #AS
# asserts and the odd byte's low data bits once #HDS/#LDS do; ST and PF
# give the cycle kind, and #NMI shows the debugger's halt.
[hd641016]
 0 = { pin = "P10", signal = "A1/D0" }
 1 = { pin = "P11", signal = "A2/D1" }
 2 = { pin = "P12", signal = "A3/D2" }
 3 = { pin = "P37", signal = "PF" }
 4 = { pin = "P40", signal = "#AS" }
 5 = { pin = "P41", signal = "R/#W" }
 6 = { pin = "P42", signal = "#HDS" }
 7 = { pin = "P43", signal = "#LDS" }
 8 = { pin = "P45", signal = "#NMI" }
 9 = { pin = "P46", signal = "PHI" }
10 = { pin = "P47", signal = "EXTAL" }
11 = { pin = "P50", signal = "ST0" }
12 = { pin = "P51", signal = "ST1" }
13 = { pin = "P52", signal = "ST2" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P54", signal = "#WAIT" }

# The HD641016CP10's reset, step and echoitr: ST2-ST0 and A3:A1 as #AS
# opens each cycle, D2:D0 of the odd byte lane as #LDS ends it.
[hd641016-reset]
 0 = { pin = "P10", signal = "A1/D0" }
 1 = { pin = "P11", signal = "A2/D1" }
 2 = { pin = "P12", signal = "A3/D2" }
 3 = { pin = "P40", signal = "#AS" }
 4 = { pin = "P41", signal = "R/#W" }
 5 = { pin = "P42", signal = "#HDS" }
 6 = { pin = "P43", signal = "#LDS" }
 7 = { pin = "P44", signal = "#IRQ0" }
 8 = { pin = "P46", signal = "PHI" }
 9 = { pin = "P37", signal = "PF" }
10 = { pin = "P47", signal = "EXTAL" }
11 = { pin = "P50", signal = "ST0" }
12 = { pin = "P51", signal = "ST1" }
13 = { pin = "P52", signal = "ST2" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P54", signal = "#WAIT" }
trigger = { signal = "#RES", edge = "rise", before = 20e-6, after = 170e-6 }
parallel = [
  { data = ["ST0", "ST1", "ST2"], clock = "#AS", edge = "fall" },
  { data = ["A1/D0", "A2/D1", "A3/D2"], clock = "#AS", edge = "fall" },
  { data = ["A1/D0", "A2/D1", "A3/D2"], clock = "#LDS", edge = "rise" },
]
display = ["EXTAL", "PHI", "#AS", "R/#W", "#HDS", "#LDS", "ST2", "ST1",
        "ST0", "PF", "#WAIT", "#IRQ0", "#RES", "A3/D2", "A2/D1", "A1/D0"]

# Five steps: each restore starts as #WAIT lets the parked CPU go, and the
# trace exception parks it again.
[hd641016-step]
 0 = { pin = "P10", signal = "A1/D0" }
 1 = { pin = "P11", signal = "A2/D1" }
 2 = { pin = "P12", signal = "A3/D2" }
 3 = { pin = "P40", signal = "#AS" }
 4 = { pin = "P41", signal = "R/#W" }
 5 = { pin = "P42", signal = "#HDS" }
 6 = { pin = "P43", signal = "#LDS" }
 7 = { pin = "P44", signal = "#IRQ0" }
 8 = { pin = "P46", signal = "PHI" }
 9 = { pin = "P37", signal = "PF" }
10 = { pin = "P47", signal = "EXTAL" }
11 = { pin = "P50", signal = "ST0" }
12 = { pin = "P51", signal = "ST1" }
13 = { pin = "P52", signal = "ST2" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P54", signal = "#WAIT" }
trigger = { signal = "#WAIT", edge = "rise", before = 20e-6, after = 1.9e-3 }
parallel = [
  { data = ["ST0", "ST1", "ST2"], clock = "#AS", edge = "fall" },
  { data = ["A1/D0", "A2/D1", "A3/D2"], clock = "#AS", edge = "fall" },
  { data = ["A1/D0", "A2/D1", "A3/D2"], clock = "#LDS", edge = "rise" },
]
display = ["EXTAL", "PHI", "#AS", "R/#W", "#HDS", "#LDS", "ST2", "ST1",
        "ST0", "PF", "#WAIT", "#IRQ0", "#RES", "A3/D2", "A2/D1", "A1/D0"]

# echoitr: the ACIA's receive interrupt on #IRQ0, the handler and the
# echo it queues for the transmit interrupt.
[hd641016-echoitr]
 0 = { pin = "P10", signal = "A1/D0" }
 1 = { pin = "P11", signal = "A2/D1" }
 2 = { pin = "P12", signal = "A3/D2" }
 3 = { pin = "P40", signal = "#AS" }
 4 = { pin = "P41", signal = "R/#W" }
 5 = { pin = "P42", signal = "#HDS" }
 6 = { pin = "P43", signal = "#LDS" }
 7 = { pin = "P44", signal = "#IRQ0" }
 8 = { pin = "P46", signal = "PHI" }
 9 = { pin = "P37", signal = "PF" }
10 = { pin = "P47", signal = "EXTAL" }
11 = { pin = "P50", signal = "ST0" }
12 = { pin = "P51", signal = "ST1" }
13 = { pin = "P52", signal = "ST2" }
14 = { pin = "P53", signal = "#RES" }
15 = { pin = "P54", signal = "#WAIT" }
trigger = { signal = "#IRQ0", edge = "fall", before = 20e-6, after = 14e-3, long = true }
parallel = [
  { data = ["ST0", "ST1", "ST2"], clock = "#AS", edge = "fall" },
  { data = ["A1/D0", "A2/D1", "A3/D2"], clock = "#AS", edge = "fall" },
  { data = ["A1/D0", "A2/D1", "A3/D2"], clock = "#LDS", edge = "rise" },
]
display = ["EXTAL", "PHI", "#AS", "R/#W", "#HDS", "#LDS", "ST2", "ST1",
        "ST0", "PF", "#WAIT", "#IRQ0", "#RES", "A3/D2", "A2/D1", "A1/D0"]
