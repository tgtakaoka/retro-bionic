# Channel labels for the MC6801 (also HD6301) board. Verify against the
# wiring before trusting it -- a lead moved on the bench leaves this
# stale. '# Pxx' comments are that channel's pin name on the Bionic
# Connector.

[mc6801]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "AS"      # P40
 9 = "R/#W"    # P41
10 = "EXTAL"   # P46
11 = "E"       # P47
12 = "#IRQ1"   # P50
13 = "#NMI"    # P51
14 = "PC2"     # P52
15 = "#RESET"  # P53

# Profiling leads, the layout every profiled board shares: drops #RESET.
[mc6801-profile]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "AS"      # P40
 9 = "R/#W"    # P41
10 = "EXTAL"   # P46
11 = "E"       # P47
12 = "#IRQ1"   # P50
13 = "#NMI"    # P51
14 = "debug"   # P56
15 = "PC2"     # P52
