# Channel labels for the MC6801 (also HD6301) board. Verify against the
# wiring before trusting it -- a lead moved on the bench leaves this stale.

[mc6801]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "PC2" }
15 = { pin = "P53", signal = "#RESET" }

# Profiling leads, the layout every profiled board shares: drops #RESET.
[mc6801-profile]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P52", signal = "PC2" }
