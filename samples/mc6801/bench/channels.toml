# Channel labels for the MC6801 (also HD6301) board. Verify against the
# wiring before trusting it -- a lead moved on the bench leaves this stale.

[mc6801]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "PC2" }
15 = { pin = "P53", signal = "#RESET" }

# The reset sequence: #RESET negates, then the register save.
[mc6801-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "PC2" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#RESET", edge = "rise", before = 50e-6, after = 87e-6 }
display = ["EXTAL", "E", "AS", "R/#W", "PC2", "#IRQ1", "#NMI", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "fall" },
]

# Six steps of mandelbrot halted by the halt port, sent as one write:
# each step's restore, cycles and register save.
[mc6801-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "PC2" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "R/#W", edge = "fall", before = 50e-6, after = 2.40e-3 }
display = ["EXTAL", "E", "AS", "R/#W", "PC2", "#IRQ1", "#NMI", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "fall" },
]

# The echoitr sample's echo of one character: #IRQ1 asserts for the
# receive, then for each transmit until the last.
[mc6801-echoitr]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "PC2" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#IRQ1", edge = "fall", before = 50e-6, after = 7.60e-3 }
display = ["EXTAL", "E", "AS", "R/#W", "PC2", "#IRQ1", "#NMI", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "AS", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "E", edge = "fall" },
]


