# Channel labels for the P8085. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[i8085]
 0 = "AD0"       # P10
 1 = "AD1"       # P11
 2 = "AD2"       # P12
 3 = "AD3"       # P13
 4 = "AD4"       # P14
 5 = "AD5"       # P15
 6 = "AD6"       # P16
 7 = "AD7"       # P17
 8 = "TRAP"      # P35
 9 = "#RD"       # P42
10 = "#WR"       # P43
11 = "CLK"       # P47
12 = "X1"        # P50
13 = "READY"     # P52
14 = "ALE"       # P54
15 = "IO/#M"     # P55

# The SID/SOD serial handler: SOD and SID in place of TRAP and IO/#M.
[i8085-sio]
 0 = "AD0"       # P10
 1 = "AD1"       # P11
 2 = "AD2"       # P12
 3 = "AD3"       # P13
 4 = "AD4"       # P14
 5 = "AD5"       # P15
 6 = "AD6"       # P16
 7 = "AD7"       # P17
 8 = "#RD"       # P42
 9 = "#WR"       # P43
10 = "SOD"       # P44
11 = "SID"       # P45
12 = "CLK"       # P47
13 = "X1"        # P50
14 = "READY"     # P52
15 = "ALE"       # P54
