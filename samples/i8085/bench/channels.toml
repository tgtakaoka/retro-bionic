# Channel labels for the P8085. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[i8085]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P35", signal = "TRAP" }
 9 = { pin = "P42", signal = "#RD" }
10 = { pin = "P43", signal = "#WR" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P50", signal = "X1" }
13 = { pin = "P52", signal = "READY" }
14 = { pin = "P54", signal = "ALE" }
15 = { pin = "P55", signal = "IO/#M" }

# The SID/SOD serial handler: SOD and SID in place of TRAP and IO/#M.
[i8085-sio]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P42", signal = "#RD" }
 9 = { pin = "P43", signal = "#WR" }
10 = { pin = "P44", signal = "SOD" }
11 = { pin = "P45", signal = "SID" }
12 = { pin = "P47", signal = "CLK" }
13 = { pin = "P50", signal = "X1" }
14 = { pin = "P52", signal = "READY" }
15 = { pin = "P54", signal = "ALE" }
