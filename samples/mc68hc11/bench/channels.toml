# Channel labels for the MC68HC11, speculated from the Bionic Connector's
# pinout (data bus low byte plus the bus-cycle status/strobe signals
# judged most useful for debugging) rather than captured from real
# activity. Confirm every channel before trusting it. '# Pxx' comments
# are that channel's pin name on the Bionic Connector.

[mc68hc11]
 0 = "AD0"        # P10
 1 = "AD1"        # P11
 2 = "AD2"        # P12
 3 = "AD3"        # P13
 4 = "AD4"        # P14
 5 = "AD5"        # P15
 6 = "AD6"        # P16
 7 = "AD7"        # P17
 8 = "AS"         # P40
 9 = "R/#W"       # P41
10 = "MODA/#LIR"  # P42
11 = "E"          # P47
12 = "#IRQ"       # P50
13 = "#XIRQ"      # P51
14 = "#RESET"     # P53
# ATTENTION: P56 is the debug pin on other boards; confirm what this
# board wires there before trusting the "PD5" label.
15 = "PD5"        # P56
