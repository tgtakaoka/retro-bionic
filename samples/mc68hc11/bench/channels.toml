# Channel labels for the MC68HC11A0 and MC68HC11D0 boards, which wire these
# signals to the same Bionic Connector pins. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.

[mc68hc11]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "#LIR" }
11 = { pin = "P46", signal = "EXTAL" }
12 = { pin = "P47", signal = "E" }
13 = { pin = "P50", signal = "#IRQ" }
14 = { pin = "P51", signal = "#XIRQ" }
15 = { pin = "P53", signal = "#RESET" }
