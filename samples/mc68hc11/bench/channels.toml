# Channel labels for the MC68HC11A0 and MC68HC11D0 boards, which wire
# these signals to the same Bionic Connector pins. Verify against the
# wiring before trusting it -- a lead moved on the bench leaves this
# stale. '# Pxx' comments are that channel's pin name on the Bionic
# Connector.

[mc68hc11]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "AS"      # P40
 9 = "R/#W"    # P41
10 = "#LIR"    # P42
11 = "EXTAL"   # P46
12 = "E"       # P47
13 = "#IRQ"    # P50
14 = "#XIRQ"   # P51
15 = "#RESET"  # P53
