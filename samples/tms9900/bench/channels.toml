# Channel labels for the TMS9900, speculated from the Bionic Connector's
# pinout (data bus low byte plus the bus-cycle status/strobe signals
# judged most useful for debugging) rather than captured from real
# activity. Confirm every channel before trusting it. '# Pxx' comments
# are that channel's pin name on the Bionic Connector.

[tms9900]
 0 = "D7"      # P20
 1 = "D6"      # P21
 2 = "D5"      # P22
 3 = "D4"      # P23
 4 = "D3"      # P24
 5 = "D2"      # P25
 6 = "D1"      # P26
 7 = "D0"      # P27
 8 = "#MEMEN"  # P40
 9 = "DBIN"    # P41
10 = "#WE"     # P42
11 = "IAQ"     # P43
12 = "phiclk"  # P47
13 = "#RESET"  # P53
14 = "READY"   # P54
15 = "debug"   # P56
