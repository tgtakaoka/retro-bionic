# Channel labels for the TMS9900, checked against a reset: #MEMEN frames
# each memory cycle, DBIN marks the reads and #WE the writes, IAQ the
# first instruction fetch, whose high byte 7C on D0-D7 matched memory,
# phiclk is the clock the debugger drives into the clock generator, and
# #RESET pulses low. D0 is the TMS9900's MSB: channel 0 is D7, so the
# channels read as the high byte. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.
[tms9900]
 0 = "D7"      # P20
 1 = "D6"      # P21
 2 = "D5"      # P22
 3 = "D4"      # P23
 4 = "D3"      # P24
 5 = "D2"      # P25
 6 = "D1"      # P26
 7 = "D0"      # P27
 8 = "#MEMEN"  # P40
 9 = "DBIN"    # P41
10 = "#WE"     # P42
11 = "IAQ"     # P43
12 = "phiclk"  # P47
13 = "#RESET"  # P53
14 = "READY"   # P54
15 = "debug"   # P56

# The TMS9980, checked against a reset: #MEMEN and DBIN frame the reads,
# #WE pulses twice for each word written a byte at a time, IAQ marks the
# first fetch, whose byte D5 matched memory, CKIN is the clock the debugger
# drives and #PHI3 follows at a quarter of it, and the debugger resets
# through INT0-INT2. D0 is the MSB: channel 0 is D7.
[tms9980]
 0 = "D7"      # P10
 1 = "D6"      # P11
 2 = "D5"      # P12
 3 = "D4"      # P13
 4 = "D3"      # P14
 5 = "D2"      # P15
 6 = "D1"      # P16
 7 = "D0"      # P17
 8 = "#MEMEN"  # P40
 9 = "DBIN"    # P41
10 = "#WE"     # P42
11 = "IAQ"     # P43
12 = "CKIN"    # P46
13 = "#PHI3"   # P47
14 = "READY"   # P54
15 = "INT0"    # P52

# The TMS9981: its board has the same pins as the TMS9980's, by the
# schematic; the same leads serve both.
[tms9981]
 0 = "D7"      # P10
 1 = "D6"      # P11
 2 = "D5"      # P12
 3 = "D4"      # P13
 4 = "D3"      # P14
 5 = "D2"      # P15
 6 = "D1"      # P16
 7 = "D0"      # P17
 8 = "#MEMEN"  # P40
 9 = "DBIN"    # P41
10 = "#WE"     # P42
11 = "IAQ"     # P43
12 = "CKIN"    # P46
13 = "#PHI3"   # P47
14 = "READY"   # P54
15 = "INT0"    # P52
