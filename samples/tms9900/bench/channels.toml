# Channel labels for the TMS9900, checked against a reset: #MEMEN frames
# each memory cycle, DBIN marks the reads and #WE the writes, IAQ the first
# instruction fetch, whose high byte 7C on D0-D7 matched memory, phiclk is
# the clock the debugger drives into the clock generator, and #RESET pulses
# low. D0 is the TMS9900's MSB: channel 0 is D7, so the channels read as the
# high byte. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale.
[tms9900]
 0 = { pin = "P20", signal = "D7" }
 1 = { pin = "P21", signal = "D6" }
 2 = { pin = "P22", signal = "D5" }
 3 = { pin = "P23", signal = "D4" }
 4 = { pin = "P24", signal = "D3" }
 5 = { pin = "P25", signal = "D2" }
 6 = { pin = "P26", signal = "D1" }
 7 = { pin = "P27", signal = "D0" }
 8 = { pin = "P40", signal = "#MEMEN" }
 9 = { pin = "P41", signal = "DBIN" }
10 = { pin = "P42", signal = "#WE" }
11 = { pin = "P43", signal = "IAQ" }
12 = { pin = "P47", signal = "phiclk" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "READY" }
15 = { pin = "P56", signal = "debug" }

# The TMS9980, checked against a reset: #MEMEN and DBIN frame the reads,
# #WE pulses twice for each word written a byte at a time, IAQ marks the
# first fetch, whose byte D5 matched memory, CKIN is the clock the debugger
# drives and #PHI3 follows at a quarter of it, and the debugger resets
# through INT0-INT2. D0 is the MSB: channel 0 is D7.
[tms9980]
 0 = { pin = "P10", signal = "D7" }
 1 = { pin = "P11", signal = "D6" }
 2 = { pin = "P12", signal = "D5" }
 3 = { pin = "P13", signal = "D4" }
 4 = { pin = "P14", signal = "D3" }
 5 = { pin = "P15", signal = "D2" }
 6 = { pin = "P16", signal = "D1" }
 7 = { pin = "P17", signal = "D0" }
 8 = { pin = "P40", signal = "#MEMEN" }
 9 = { pin = "P41", signal = "DBIN" }
10 = { pin = "P42", signal = "#WE" }
11 = { pin = "P43", signal = "IAQ" }
12 = { pin = "P46", signal = "CKIN" }
13 = { pin = "P47", signal = "#PHI3" }
14 = { pin = "P54", signal = "READY" }
15 = { pin = "P52", signal = "INT0" }

# The TMS9981: its board has the same pins as the TMS9980's, by the
# schematic; the same leads serve both.
[tms9981]
 0 = { pin = "P10", signal = "D7" }
 1 = { pin = "P11", signal = "D6" }
 2 = { pin = "P12", signal = "D5" }
 3 = { pin = "P13", signal = "D4" }
 4 = { pin = "P14", signal = "D3" }
 5 = { pin = "P15", signal = "D2" }
 6 = { pin = "P16", signal = "D1" }
 7 = { pin = "P17", signal = "D0" }
 8 = { pin = "P40", signal = "#MEMEN" }
 9 = { pin = "P41", signal = "DBIN" }
10 = { pin = "P42", signal = "#WE" }
11 = { pin = "P43", signal = "IAQ" }
12 = { pin = "P46", signal = "CKIN" }
13 = { pin = "P47", signal = "#PHI3" }
14 = { pin = "P54", signal = "READY" }
15 = { pin = "P52", signal = "INT0" }
