# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The D8087 board's CPU, as its banner names it; the 8087 runs beside it.
chips = ["8086", "8088"]

# Documented RESET state (8086 Family User's Manual, Table 4-2): CS=FFFFH;
# IP, DS, SS, ES and the flags cleared.
[reset]
program_counter = "CS:IP"
"CS:IP" = "FFFF0000"
DS = "0000"
ES = "0000"

# One frame, checked whole.
[fmandel]
golden = "samples/arith/fmandel.golden"
frames = 1

[haltgo]
program = "fmandel"

# fmandel_y is reached once per row.
[breakpoint]
program = "fmandel"
break_at = "fmandel_y"

[gountil]
program = "fmandel"
break_at = "fmandel_y"
