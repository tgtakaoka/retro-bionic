# Channel labels for the P8051. Not yet confirmed by a capture on real
# hardware -- verify against the wiring before trusting it; a lead
# moved on the bench leaves this stale. '# Pxx' comments are that
# channel's pin name on the Bionic Connector.

[i8051]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "#PSEN"   # P40
 9 = "#RD"     # P41
10 = "#WR"     # P42
11 = "ALE"     # P43
12 = "XTAL2"   # P47
13 = "#INT0"   # P50
14 = "#INT1"   # P51
15 = "RST"     # P53
