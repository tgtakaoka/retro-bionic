# Channel labels for the P8051 and P80C51, checked on a P8051 against a
# reset: ALE latches each low address on AD0-AD7, #PSEN strobes the code
# bytes and #WR the register saves, and RST pulses high. debug is the
# profile image's run span, for record-cycles --capture. XTAL2 is the clock
# the debugger drives; the board's jumpers route the same lead to XTAL1 on a
# P80C51. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale.

[i8051]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#PSEN" }
 9 = { pin = "P41", signal = "#RD" }
10 = { pin = "P42", signal = "#WR" }
11 = { pin = "P43", signal = "ALE" }
12 = { pin = "P47", signal = "XTAL2" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P53", signal = "RST" }

# The reset sequence: RST negates, then the register save.
[p8051-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#PSEN" }
 9 = { pin = "P41", signal = "#RD" }
10 = { pin = "P42", signal = "#WR" }
11 = { pin = "P43", signal = "ALE" }
12 = { pin = "P47", signal = "XTAL2" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P51", signal = "#INT1" }
15 = { pin = "P53", signal = "RST" }
trigger = { signal = "RST", edge = "fall", before = 50e-6, after = 140e-6 }
display = ["XTAL2", "ALE", "#PSEN", "#RD", "#WR", "#INT0", "#INT1", "RST", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "ALE", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#PSEN", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#WR", edge = "rise" },
]

# Six steps of mandelbrot halted by the halt port, each sent after the
# previous step's prompt: the program reads the console as its UART, so
# characters that arrive during a step go to it. Each step's restore,
# cycles and register save.
[p8051-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#PSEN" }
 9 = { pin = "P41", signal = "#RD" }
10 = { pin = "P42", signal = "#WR" }
11 = { pin = "P43", signal = "ALE" }
12 = { pin = "P47", signal = "XTAL2" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P51", signal = "#INT1" }
15 = { pin = "P53", signal = "RST" }
trigger = { signal = "#WR", edge = "fall", before = 50e-6, after = 2.30e-3 }
display = ["XTAL2", "ALE", "#PSEN", "#RD", "#WR", "#INT0", "#INT1", "RST", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "ALE", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#PSEN", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#WR", edge = "rise" },
]

# The echoitr sample's echo of one character: #INT0 asserts for the
# receive, #INT1 for each transmit until the last.
[p8051-echoitr]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#PSEN" }
 9 = { pin = "P41", signal = "#RD" }
10 = { pin = "P42", signal = "#WR" }
11 = { pin = "P43", signal = "ALE" }
12 = { pin = "P47", signal = "XTAL2" }
13 = { pin = "P50", signal = "#INT0" }
14 = { pin = "P51", signal = "#INT1" }
15 = { pin = "P53", signal = "RST" }
trigger = { signal = "#INT0", edge = "fall", before = 50e-6, after = 5.70e-3 }
display = ["XTAL2", "ALE", "#PSEN", "#RD", "#WR", "#INT0", "#INT1", "RST", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "ALE", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#PSEN", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#WR", edge = "rise" },
]


