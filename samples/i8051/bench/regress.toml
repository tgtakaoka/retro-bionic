# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for.
chips = ["P8051", "P80C51"]

# Documented RESET values (80C51 Programming Manual, SFR table, PDF p.3):
# ACC, B, DPTR and PSW are 00H (so RS=0), SP is 07H. PC starts at the
# reset vector, ORG_RESET=0000 in i8051.inc.
[reset]
program_counter = "PC"
PC = "0000"
SP = "07"
DPTR = "0000"
B = "00"
A = "00"
RS = "0"

# Derived from arith.asm's test table (every "; answer" comment agrees).
[arith]
expect = """
0 - -28000 = 28000
0 - 28000 = -28000
18000 + 28000 = -19536
18000 + -18000 = 0
-28000 + -18000 = 19536
-18000 - -28000 = 10000
18000 - -18000 = -29536
-28000 - -18000 = -10000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
-200 / 100 = -2
30000 / 100 = 300
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -18000
18000 = 18000
-18000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r -- the same format as the other targets'.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# The same three echoes through the on-chip serial port, which only
# reaches the console once "I UART" selects it -- this suite cannot.
[uart]
skip = true

[uartir]
skip = true

[uartitr]
skip = true

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

# loop_y is reached once per row, so each go runs a whole row rather
# than a single pixel.
[gountil]
program = "mandelbrot"
break_at = "loop_y"
