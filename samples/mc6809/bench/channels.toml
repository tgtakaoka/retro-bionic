# Channel labels for the MC6809 (also HD6309) and MC6809E (also HD6309E)
# boards. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale. '# Pxx' comments are that channel's pin
# name on the Bionic Connector.

[mc6809]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "R/#W"    # P41
 9 = "Q"       # P44
10 = "EXTAL"   # P46
11 = "E"       # P47
12 = "#IRQ"    # P50
13 = "#NMI"    # P51
14 = "debug"   # P56
15 = "#RESET"  # P53

[mc6809e]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "AVMA"    # P40
 9 = "R/#W"    # P41
10 = "E"       # P46
11 = "Q"       # P47
12 = "#IRQ"    # P50
13 = "#NMI"    # P51
14 = "LIC"     # P52
15 = "#RESET"  # P53

# Profiling leads, the layout every profiled board shares: drops Q and
# #RESET on the MC6809, and #RESET on the MC6809E, whose LIC moves to ch15.
[mc6809-profile]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "XTAL"    # P40
 9 = "R/#W"    # P41
10 = "EXTAL"   # P46
11 = "E"       # P47
12 = "#IRQ"    # P50
13 = "#NMI"    # P51
14 = "debug"   # P56
15 = "MRDY"    # P52

[mc6809e-profile]
