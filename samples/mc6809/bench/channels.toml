# Channel labels for the MC6809 (also HD6309) and MC6809E (also HD6309E)
# boards. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale.

[mc6809]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P41", signal = "R/#W" }
 9 = { pin = "P44", signal = "Q" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P53", signal = "#RESET" }

[mc6809e]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "AVMA" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "E" }
11 = { pin = "P47", signal = "Q" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "LIC" }
15 = { pin = "P53", signal = "#RESET" }

# Profiling leads, the layout every profiled board shares: drops Q and
# #RESET on the MC6809, and #RESET on the MC6809E, whose LIC moves to ch15.
[mc6809-profile]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "XTAL" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P52", signal = "MRDY" }

[mc6809e-profile]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "AVMA" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "E" }
11 = { pin = "P47", signal = "Q" }
12 = { pin = "P50", signal = "#IRQ" }
