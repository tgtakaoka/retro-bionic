# Channel labels for the Z280 in its Z-BUS mode. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.

[zbus]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P40", signal = "ST0" }
 5 = { pin = "P41", signal = "ST1" }
 6 = { pin = "P42", signal = "ST2" }
 7 = { pin = "P43", signal = "ST3" }
 8 = { pin = "P44", signal = "CLK" }
 9 = { pin = "P45", signal = "#DS" }
10 = { pin = "P46", signal = "#AS" }
11 = { pin = "P47", signal = "XTALI" }
12 = { pin = "P56", signal = "debug" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "R/#W" }
15 = { pin = "P55", signal = "B/#W" }

[zbus-wait]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P40", signal = "ST0" }
 5 = { pin = "P41", signal = "ST1" }
 6 = { pin = "P42", signal = "ST2" }
 7 = { pin = "P43", signal = "ST3" }
 8 = { pin = "P44", signal = "CLK" }
 9 = { pin = "P45", signal = "#DS" }
10 = { pin = "P46", signal = "#AS" }
11 = { pin = "P47", signal = "XTALI" }
12 = { pin = "P52", signal = "#WAIT" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "R/#W" }
15 = { pin = "P55", signal = "B/#W" }

[zbus-int]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P40", signal = "ST0" }
 5 = { pin = "P41", signal = "ST1" }
 6 = { pin = "P42", signal = "ST2" }
 7 = { pin = "P43", signal = "ST3" }
 8 = { pin = "P44", signal = "CLK" }
 9 = { pin = "P45", signal = "#DS" }
10 = { pin = "P46", signal = "#AS" }
11 = { pin = "P47", signal = "XTALI" }
12 = { pin = "P50", signal = "#INTA" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P54", signal = "R/#W" }
15 = { pin = "P55", signal = "B/#W" }
