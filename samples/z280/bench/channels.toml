# Channel labels for the Z280 in its Z-BUS mode. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[zbus]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "ST0"     # P40
 5 = "ST1"     # P41
 6 = "ST2"     # P42
 7 = "ST3"     # P43
 8 = "CLK"     # P44
 9 = "#DS"     # P45
10 = "#AS"     # P46
11 = "XTALI"   # P47
12 = "debug"   # P56
13 = "#RESET"  # P53
14 = "R/#W"    # P54
15 = "B/#W"    # P55

[zbus-wait]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "ST0"     # P40
 5 = "ST1"     # P41
 6 = "ST2"     # P42
 7 = "ST3"     # P43
 8 = "CLK"     # P44
 9 = "#DS"     # P45
10 = "#AS"     # P46
11 = "XTALI"   # P47
12 = "#WAIT"   # P52
13 = "#RESET"  # P53
14 = "R/#W"    # P54
15 = "B/#W"    # P55

[zbus-int]
 0 = "AD0"    # P10
 1 = "AD1"    # P11
 2 = "AD2"    # P12
 3 = "AD3"    # P13
 4 = "ST0"    # P40
 5 = "ST1"    # P41
 6 = "ST2"    # P42
 7 = "ST3"    # P43
 8 = "CLK"    # P44
 9 = "#DS"    # P45
10 = "#AS"    # P46
11 = "XTALI"  # P47
12 = "#INTA"  # P50
13 = "#NMI"   # P51
14 = "R/#W"   # P54
15 = "B/#W"   # P55
