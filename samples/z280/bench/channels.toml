# Logic Pro 16 channel labels for the Z280 in its Z-BUS mode, imported
# from the "z280" Logic 2 preset via saleae-logic-pro.py load-preset.
# Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale.

[zbus]
0 = "AD0"
1 = "AD1"
2 = "AD2"
3 = "AD3"
4 = "ST0"
5 = "ST1"
6 = "ST2"
7 = "ST3"
8 = "CLK"
9 = "#DS"
10 = "#AS"
11 = "XTALI"
12 = "debug"
13 = "#RESET"
14 = "R/#W"
15 = "B/#W"

[zbus-wait]
0 = "AD0"
1 = "AD1"
2 = "AD2"
3 = "AD3"
4 = "ST0"
5 = "ST1"
6 = "ST2"
7 = "ST3"
8 = "CLK"
9 = "#DS"
10 = "#AS"
11 = "XTALI"
12 = "#WAIT"
13 = "#RESET"
14 = "R/#W"
15 = "B/#W"

[zbus-int]
0 = "AD0"
1 = "AD1"
2 = "AD2"
3 = "AD3"
4 = "ST0"
5 = "ST1"
6 = "ST2"
7 = "ST3"
8 = "CLK"
9 = "#DS"
10 = "#AS"
11 = "XTALI"
12 = "#INTA"
13 = "#NMI"
14 = "R/#W"
15 = "B/#W"
