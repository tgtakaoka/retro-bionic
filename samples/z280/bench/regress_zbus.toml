# How each sample must be driven, for the Z280 wired up in its Z-BUS
# mode. See scripts/bionic-regress.py's drive_table() for the key
# shapes this file can use.

[arith]
expect = """
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
100 * 300 = 30000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
-48 < 30
30 > -48
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
18000 = 18000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

[echoitr]
feed = "z\r"
expect = "0b01111010"

[mandelbrot]
frames = 1

[mmu_echoir]
feed = "irq\r"
expect = "irq"

[cmandel]
frames = 1
