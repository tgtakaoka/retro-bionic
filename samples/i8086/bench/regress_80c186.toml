# The BionicN80C186 and BionicN80C187 boards. See regress.toml for the
# P8086/D8087 boards; the samples that take interrupts have _80c186
# harnesses, which put INT0 in cascade mode and end each handler with an
# End Of Interrupt.

chips = ["80C186"]

# Documented RESET state (80C186XL/80C188XL User's Manual, 2.1.4):
# CS=FFFFH; IP, DS, SS, ES and the flags cleared.
[reset]
program_counter = "CS:IP"
"CS:IP" = "FFFF0000"
DS = "0000"
ES = "0000"

[arith]
expect = """
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
100 * 300 = 30000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
-48 < 30
30 > -48
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
18000 = 18000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir_80c186]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr_80c186]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# One frame, checked whole.
[mandelbrot_80c186]
golden = "samples/arith/mandelbrot.golden"
frames = 1

[haltgo]
program = "mandelbrot_80c186"

# loop_y is reached once per row, so each go runs a whole row rather
# than a single pixel.
[breakpoint]
program = "mandelbrot_80c186"
break_at = "loop_y"

[gountil]
program = "mandelbrot_80c186"
break_at = "loop_y"
