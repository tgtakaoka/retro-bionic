# The BionicN80C186 board in queue status mode: the low address/data
# byte, the queue status and the status the Teensy decodes as the 8288,
# X1 as the Teensy clocks it and CLKOUT, and NMI to trigger on a halt.
[n80c186]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "QS0" }
 9 = { pin = "P41", signal = "QS1" }
10 = { pin = "P42", signal = "#S0" }
11 = { pin = "P43", signal = "#S1" }
12 = { pin = "P44", signal = "CLKOUT" }
13 = { pin = "P46", signal = "#S2" }
14 = { pin = "P47", signal = "X1" }
15 = { pin = "P50", signal = "NMI" }

# A reset of the BionicN80C186 board: whether X1 reaches the CPU and
# CLKOUT follows it. X1 and CLKOUT are also sampled analog, X1's high
# needing 3.9 V.
[n80c186-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P41", signal = "QS1" }
 9 = { pin = "P44", signal = "CLKOUT", analog = [6, -1], digital = true }
10 = { pin = "P45", signal = "#DEN" }
11 = { pin = "P46", signal = "#S2" }
12 = { pin = "P47", signal = "X1", analog = [6, -1], digital = true }
13 = { pin = "P50", signal = "NMI" }
14 = { pin = "P51", signal = "INT0" }
15 = { pin = "P53", signal = "#RES" }
trigger = { signal = "#RES", edge = "fall", before = 20e-6, after = 1e-3 }
display = ["X1", "CLKOUT", "#RES", "#S2", "QS1", "#DEN", "NMI", "INT0",
        "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]

# The BionicN80C286 board: the low data byte, the status, M/#IO and
# COD/#INTA, #READY, CLK as the Teensy clocks it, and the 74HCT259's #LE,
# which strobes NMI and INTR.
[n80c286]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#S0" }
 9 = { pin = "P41", signal = "#S1" }
10 = { pin = "P42", signal = "M/#IO" }
11 = { pin = "P43", signal = "#BHE" }
12 = { pin = "P44", signal = "#READY" }
13 = { pin = "P46", signal = "COD/#INTA" }
14 = { pin = "P47", signal = "CLK" }
15 = { pin = "P52", signal = "#LE" }
