10 = { pin = "P34", signal = "QS0" }
11 = { pin = "P35", signal = "BS1" }
12 = { pin = "P36", signal = "BS0" }
13 = { pin = "P47", signal = "CLK" }
14 = { pin = "P52", signal = "READY" }
15 = { pin = "P53", signal = "RESET" }
trigger = { signal = "RESET", edge = "fall", before = 20e-6, after = 0.2e-3 }
display = ["CLK", "BS1", "BS0", "#RD", "QS1", "QS0", "READY", "RESET",
        "#UBE", "A16/PS0", "A17/PS1", "A18/PS2", "AD0", "AD1", "AD2", "AD3"]
