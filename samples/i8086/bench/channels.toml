 2 = { pin = "P34", signal = "QS0" }
 3 = { pin = "P35", signal = "#S1" }
 4 = { pin = "P36", signal = "#S0" }
 5 = { pin = "P37", signal = "BUSY" }
 6 = { pin = "P40", signal = "#RD" }
