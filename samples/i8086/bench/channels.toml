15 = { pin = "P54", signal = "#RQ/#GT0" }
trigger = { signal = "READY", edge = "rise", before = 20e-6, after = 5.6e-3 }
display = ["CLK", "#S2", "#S1", "#S0", "#RD", "QS1", "QS0", "READY",
