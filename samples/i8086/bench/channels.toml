# The P8086 board: no 8087, so leads for the CPU alone, in header place
# order. S3-S5 share A16-A18 after T1; A19/S6 stays low here. Reset and
# steps as on the D8087 board, the steps from mandelbrot's loop_y. The
# 80C88 first:

[p8086-8088-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P30", signal = "A16/S3" }
 5 = { pin = "P40", signal = "#RD" }
 6 = { pin = "P31", signal = "A17/S4" }
 7 = { pin = "P32", signal = "A18/S5" }
 8 = { pin = "P42", signal = "QS1" }
 9 = { pin = "P43", signal = "#BHE" }
10 = { pin = "P34", signal = "QS0" }
11 = { pin = "P35", signal = "#S1" }
12 = { pin = "P36", signal = "#S0" }
13 = { pin = "P47", signal = "CLK" }
14 = { pin = "P52", signal = "READY" }
15 = { pin = "P53", signal = "RESET" }
trigger = { signal = "RESET", edge = "fall", before = 20e-6, after = 0.3e-3 }
display = ["CLK", "#S1", "#S0", "#RD", "QS1", "QS0", "READY", "RESET",
        "#BHE", "A16/S3", "A17/S4", "A18/S5", "AD0", "AD1", "AD2", "AD3"]
# #S1:#S0 (#S2 is low only for I/O and INTA, absent here), QS1:QS0, and
# AD3:AD0 three ways, as max mode has no ALE or #WR: the address at the
# fall ending T1, read data as #RD rises, and each cycle's data as READY
# releases it, the only strobe a write has.
parallel = [
  { data = ["#S0", "#S1"], clock = "CLK", edge = "fall" },
  { data = ["QS0", "QS1"], clock = "CLK", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3"], clock = "CLK", edge = "fall" },
  { data = ["AD0", "AD1", "AD2", "AD3"], clock = "#RD", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3"], clock = "READY", edge = "rise" },
]

[p8086-8088-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P30", signal = "A16/S3" }
 5 = { pin = "P40", signal = "#RD" }
