# The V30, in NEC's names: BS1/BS0 are #S1/#S0, #UBE is #BHE, PS1:PS0
# the segment (DS1, SS, PS, DS0) and PS2 the IE flag:

[p8086-v30-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P30", signal = "A16/PS0" }
 5 = { pin = "P40", signal = "#RD" }
