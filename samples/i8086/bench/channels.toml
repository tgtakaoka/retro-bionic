14 = { pin = "P52", signal = "READY" }
15 = { pin = "P53", signal = "RESET" }
trigger = { signal = "READY", edge = "rise", before = 20e-6, after = 2.4e-3 }
display = ["CLK", "BS1", "BS0", "#RD", "QS1", "QS0", "READY", "RESET",
        "#UBE", "A16/PS0", "A17/PS1", "A18/PS2", "AD0", "AD1", "AD2", "AD3"]
# #S1:#S0 (#S2 is low only for I/O and INTA, absent here), QS1:QS0, and
# AD3:AD0 three ways, as max mode has no ALE or #WR: the address at the
