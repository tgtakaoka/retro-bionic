# Channel labels for the P8086 and D8087 boards, from the pin map in
# debugger/i8086/pins_i8086.h; not yet checked against a capture.
# Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale. '# Pxx' comments are that channel's pin name
# on the Bionic Connector.

# The P8086 board in minimum mode.
[p8086]
 0 = "AD0"       # P10
 1 = "AD1"       # P11
 2 = "AD2"       # P12
 3 = "AD3"       # P13
 4 = "ALE"       # P34
 5 = "DT/#R"     # P35
 6 = "#DEN"      # P36
 7 = "#RD"       # P40
 8 = "#WR"       # P41
 9 = "#INTA"     # P42
10 = "#BHE"      # P43
11 = "M/#IO"     # P46
12 = "CLK"       # P47
13 = "INTR"      # P51
14 = "READY"     # P52
15 = "RESET"     # P53

# The D8087 board in maximum mode: the status the Teensy decodes as the
# 8288, the queue status, and the 8087's handshakes.
[d8087]
 0 = "AD0"       # P10
 1 = "AD1"       # P11
 2 = "QS0"       # P34
 3 = "#S1"       # P35
 4 = "#S0"       # P36
 5 = "BUSY"      # P37
 6 = "#RD"       # P40
 7 = "#LOCK"     # P41
 8 = "QS1"       # P42
 9 = "#BHE"      # P43
10 = "INT"       # P44
11 = "#S2"       # P46
12 = "CLK"       # P47
13 = "READY"     # P52
14 = "RESET"     # P53
15 = "#RQ/#GT0"  # P54
