# Channel labels for the P8086 and D8087 boards, from the pin map in
# debugger/i8086/pins_i8086.h; [d8087] not yet checked against a capture.
# Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale. '# Pxx' comments are that channel's pin name
# on the Bionic Connector.

# The P8086 board: the full low address/data byte, the status the Teensy
# decodes as the 8288, and NMI to trigger on a halt. Checked against
# captures of the V20.
[p8086]
 0 = "AD0"       # P10
 1 = "AD1"       # P11
 2 = "AD2"       # P12
 3 = "AD3"       # P13
 4 = "AD4"       # P14
 5 = "AD5"       # P15
 6 = "AD6"       # P16
 7 = "AD7"       # P17
 8 = "QS0"       # P34
 9 = "#S1"       # P35
10 = "#S0"       # P36
11 = "#RD"       # P40
12 = "#S2"       # P46
13 = "CLK"       # P47
14 = "NMI"       # P50
15 = "READY"     # P52

# The D8087 board in maximum mode: the status the Teensy decodes as the
# 8288, the queue status, and the 8087's handshakes.
[d8087]
 0 = "AD0"       # P10
 1 = "AD1"       # P11
 2 = "QS0"       # P34
 3 = "#S1"       # P35
 4 = "#S0"       # P36
 5 = "BUSY"      # P37
 6 = "#RD"       # P40
 7 = "#LOCK"     # P41
 8 = "QS1"       # P42
 9 = "#BHE"      # P43
10 = "INT"       # P44
11 = "#S2"       # P46
12 = "CLK"       # P47
13 = "READY"     # P52
14 = "RESET"     # P53
15 = "#RQ/#GT0"  # P54
