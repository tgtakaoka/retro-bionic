# Channel labels for the P8086, D8087, BionicN80C186 and BionicN80C286
# boards, from the pin maps in debugger/i8086/pins_i8086.h, pins_i80186.h
# and pins_i80286.h; [d8087], [n80c186] and [n80c286] not yet checked
# against a capture.
# Verify against the wiring before trusting it -- a lead moved on the bench
# leaves this stale.

# The P8086 board: the full low address/data byte, the status the Teensy
# decodes as the 8288, and NMI to trigger on a halt. Checked against
# captures of the V20.
[p8086]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P34", signal = "QS0" }
 9 = { pin = "P35", signal = "#S1" }
10 = { pin = "P36", signal = "#S0" }
11 = { pin = "P40", signal = "#RD" }
12 = { pin = "P46", signal = "#S2" }
13 = { pin = "P47", signal = "CLK" }
14 = { pin = "P50", signal = "NMI" }
15 = { pin = "P52", signal = "READY" }

# The D8087 board in maximum mode: the status the Teensy decodes as the
# 8288, the queue status, and the 8087's handshakes.
[d8087]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P34", signal = "QS0" }
 3 = { pin = "P35", signal = "#S1" }
 4 = { pin = "P36", signal = "#S0" }
 5 = { pin = "P37", signal = "BUSY" }
 6 = { pin = "P40", signal = "#RD" }
 7 = { pin = "P41", signal = "#LOCK" }
 8 = { pin = "P42", signal = "QS1" }
 9 = { pin = "P43", signal = "#BHE" }
10 = { pin = "P44", signal = "INT" }
11 = { pin = "P46", signal = "#S2" }
12 = { pin = "P47", signal = "CLK" }
13 = { pin = "P52", signal = "READY" }
14 = { pin = "P53", signal = "RESET" }
15 = { pin = "P54", signal = "#RQ/#GT0" }

# The 80C86. A reset: RESET falls, the CPU fetches at FFFF0H, and the
# debugger parks it there with READY low; injected code saves the
# registers, and printing them reads the 8087 through FSAVE/FRSTOR.
[d8087-8086-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P34", signal = "QS0" }
 3 = { pin = "P35", signal = "#S1" }
 4 = { pin = "P36", signal = "#S0" }
 5 = { pin = "P37", signal = "BUSY" }
 6 = { pin = "P40", signal = "#RD" }
 7 = { pin = "P41", signal = "#LOCK" }
 8 = { pin = "P42", signal = "QS1" }
 9 = { pin = "P43", signal = "#BHE" }
10 = { pin = "P44", signal = "INT" }
11 = { pin = "P46", signal = "#S2" }
12 = { pin = "P47", signal = "CLK" }
13 = { pin = "P52", signal = "READY" }
14 = { pin = "P53", signal = "RESET" }
15 = { pin = "P54", signal = "#RQ/#GT0" }
trigger = { signal = "RESET", edge = "fall", before = 20e-6, after = 0.6e-3 }
display = ["CLK", "#S2", "#S1", "#S0", "#RD", "QS1", "QS0", "READY",
        "#LOCK", "#RQ/#GT0", "BUSY", "INT", "RESET", "#BHE", "AD0", "AD1"]
# #S2:#S1:#S0 as the 8288 decodes them, 7 passive; QS1:QS0 the queue status.
parallel = [
  { data = ["#S0", "#S1", "#S2"], clock = "CLK", edge = "fall" },
  { data = ["QS0", "QS1"], clock = "CLK", edge = "fall" },
]

# Steps: READY releases the parked fetch, the restore's IRET runs the
# instruction with TF set, and the CPU parks again in the type 1 trap;
# eight in a row from fmandel's 104DH, two 8086 then six 8087 ones.
[d8087-8086-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P34", signal = "QS0" }
 3 = { pin = "P35", signal = "#S1" }
 4 = { pin = "P36", signal = "#S0" }
 5 = { pin = "P37", signal = "BUSY" }
 6 = { pin = "P40", signal = "#RD" }
 7 = { pin = "P41", signal = "#LOCK" }
 8 = { pin = "P42", signal = "QS1" }
 9 = { pin = "P43", signal = "#BHE" }
10 = { pin = "P44", signal = "INT" }
11 = { pin = "P46", signal = "#S2" }
12 = { pin = "P47", signal = "CLK" }
13 = { pin = "P52", signal = "READY" }
14 = { pin = "P53", signal = "RESET" }
15 = { pin = "P54", signal = "#RQ/#GT0" }
trigger = { signal = "READY", edge = "rise", before = 20e-6, after = 3.7e-3 }
display = ["CLK", "#S2", "#S1", "#S0", "#RD", "QS1", "QS0", "READY",
        "#LOCK", "#RQ/#GT0", "BUSY", "INT", "RESET", "#BHE", "AD0", "AD1"]
parallel = [
  { data = ["#S0", "#S1", "#S2"], clock = "CLK", edge = "fall" },
  { data = ["QS0", "QS1"], clock = "CLK", edge = "fall" },
]

