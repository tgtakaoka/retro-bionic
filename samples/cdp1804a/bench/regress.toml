# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# Documented RESET guarantees (CDP1804AC datasheet, "RESET"/"Initialization
# Cycle", p.69): X, P, R0 (so PC) are cleared, Q=0, interrupts enabled.
# D, DF, T are explicitly *not* affected by reset, so are left unchecked
# here.
[reset]
program_counter = "PC"
PC = "0000"
X = "0"
P = "0"
Q = "0"
IE = "1"

# arith.asm here is the same 32-case test as samples/cdp1802's -- just
# written with the CDP1804A's hardware SCAL/SRET instead of CDP1802's
# software SCRT convention -- so the expect text matches it exactly.
[arith]
expect = """
0 - -28000 = 28000
0 - 28000 = -28000
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
18000 - -28000 = -19536
18000 - -18000 = -29536
-28000 - -18000 = -10000
100 * 300 = 30000
200 * -100 = -20000
300 * -200 = 5536
-100 * 300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
-28000 = -28000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

[echoitr]
# Unlike echo/echoir, echoitr prints "<char> 0xXX 0bXXXXXXXX" for each
# received byte instead of echoing it back verbatim, one line per fed
# byte including the trailing \r.
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

[mandelbrot]
# A full frame is minutes on this target (~198s) -- lines halts
# mid-run instead, once enough output lines have printed to check
# against the golden reference, rather than waiting out the whole
# frame. 6 lines = 'G's own reply line + 5 complete drawn rows.
golden = "samples/arith/mandelbrot.golden"
lines = 6

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
