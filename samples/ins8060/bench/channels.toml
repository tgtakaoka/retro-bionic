# Channel labels for the INS8060. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[ins8060]
 0 = "D0/A12"  # P10
 1 = "D1/A13"  # P11
 2 = "D2/A14"  # P12
 3 = "D3/A15"  # P13
 4 = "D4/R"    # P14
 5 = "D5/I"    # P15
 6 = "D6/D"    # P16
 7 = "D7/H"    # P17
 8 = "#WDS"    # P41
 9 = "SENSEA"  # P43
10 = "XIN"     # P46
11 = "#BREQ"   # P47
12 = "#RDS"    # P50
13 = "#ADS"    # P51
14 = "#RST"    # P53
15 = "#ENIN"   # P54
