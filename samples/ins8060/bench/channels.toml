# Channel labels for the INS8060. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[ins8060]
 0 = { pin = "P10", signal = "D0/A12" }
 1 = { pin = "P11", signal = "D1/A13" }
 2 = { pin = "P12", signal = "D2/A14" }
 3 = { pin = "P13", signal = "D3/A15" }
 4 = { pin = "P14", signal = "D4/R" }
 5 = { pin = "P15", signal = "D5/I" }
 6 = { pin = "P16", signal = "D6/D" }
 7 = { pin = "P17", signal = "D7/H" }
 8 = { pin = "P41", signal = "#WDS" }
 9 = { pin = "P46", signal = "XIN" }
10 = { pin = "P47", signal = "#BREQ" }
11 = { pin = "P50", signal = "#RDS" }
12 = { pin = "P51", signal = "#ADS" }
13 = { pin = "P52", signal = "#HOLD" }
14 = { pin = "P54", signal = "#ENIN" }
15 = { pin = "P55", signal = "#ENOUT" }
