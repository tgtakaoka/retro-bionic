# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, with 8080 emulation, on the
# P8086 board.
chips = ["V30", "V20"]

# Documented RESET state (8086 Family User's Manual, Table 4-2): CS=FFFFH;
# IP, DS, SS, ES and the flags cleared.
[reset]
program_counter = "CS:IP"
"CS:IP" = "FFFF0000"
DS = "0000"
ES = "0000"

# The i8080 mandelbrot, unchanged. Its frame takes 26-38 seconds: halts
# once 6 rows are drawn.
[mandelbrot_8080emu]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# CP/M in 8080 emulation, which needs v30/cpm80.dsk mounted from the
# SD card.
[cpm80]
skip = true
