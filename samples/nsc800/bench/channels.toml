# Channel labels for the NSC800. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.
#
# No regress.toml here: NSC800 has no samples directory of its own yet.

[nsc800]
 0 = "AD0"    # P10
 1 = "AD1"    # P11
 2 = "AD2"    # P12
 3 = "AD3"    # P13
 4 = "AD4"    # P14
 5 = "AD5"    # P15
 6 = "AD6"    # P16
 7 = "AD7"    # P17
 8 = "#RD"    # P42
 9 = "#WR"    # P43
10 = "#RFSH"  # P45
11 = "CLK"    # P47
12 = "XIN"    # P50
13 = "#WAIT"  # P52
14 = "ALE"    # P54
15 = "debug"  # P56
