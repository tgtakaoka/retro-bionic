# Channel labels for the F3850. Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale. '# Pxx' comments are that channel's pin name
# on the Bionic Connector.

[f3850]
 0 = "DB0"      # P10
 1 = "DB1"      # P11
 2 = "DB2"      # P12
 3 = "DB3"      # P13
 4 = "DB4"      # P14
 5 = "DB5"      # P15
 6 = "DB6"      # P16
 7 = "DB7"      # P17
 8 = "ROMC0"    # P40
 9 = "ROMC1"    # P41
10 = "ROMC2"    # P42
11 = "ROMC3"    # P43
12 = "ROMC4"    # P46
13 = "PHI"      # P50
14 = "WRITE"    # P51
15 = "#EXTRES"  # P53
