# Channel labels for the F3850. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[f3850]
 0 = { pin = "P10", signal = "DB0" }
 1 = { pin = "P11", signal = "DB1" }
 2 = { pin = "P12", signal = "DB2" }
 3 = { pin = "P13", signal = "DB3" }
 4 = { pin = "P14", signal = "DB4" }
 5 = { pin = "P15", signal = "DB5" }
 6 = { pin = "P16", signal = "DB6" }
 7 = { pin = "P17", signal = "DB7" }
 8 = { pin = "P40", signal = "ROMC0" }
 9 = { pin = "P41", signal = "ROMC1" }
10 = { pin = "P42", signal = "ROMC2" }
11 = { pin = "P43", signal = "ROMC3" }
12 = { pin = "P46", signal = "ROMC4" }
13 = { pin = "P50", signal = "PHI" }
14 = { pin = "P51", signal = "WRITE" }
15 = { pin = "P53", signal = "#EXTRES" }

# The reset sequence: #EXTRES negates, then the register save.
[f3850-reset]
 0 = { pin = "P10", signal = "DB0" }
 1 = { pin = "P11", signal = "DB1" }
 2 = { pin = "P12", signal = "DB2" }
 3 = { pin = "P13", signal = "DB3" }
 4 = { pin = "P14", signal = "DB4" }
 5 = { pin = "P15", signal = "DB5" }
 6 = { pin = "P16", signal = "DB6" }
 7 = { pin = "P17", signal = "DB7" }
 8 = { pin = "P40", signal = "ROMC0" }
 9 = { pin = "P41", signal = "ROMC1" }
10 = { pin = "P42", signal = "ROMC2" }
11 = { pin = "P43", signal = "ROMC3" }
12 = { pin = "P46", signal = "ROMC4" }
13 = { pin = "P50", signal = "PHI" }
14 = { pin = "P51", signal = "WRITE" }
15 = { pin = "P53", signal = "#EXTRES" }
trigger = { signal = "#EXTRES", edge = "rise", before = 40e-6, after = 180e-6 }
display = ["PHI", "WRITE", "ROMC0", "ROMC1", "ROMC2", "ROMC3", "ROMC4", "#EXTRES", "DB0", "DB1", "DB2", "DB3", "DB4", "DB5", "DB6", "DB7"]
parallel = [
  { data = ["ROMC0", "ROMC1", "ROMC2", "ROMC3", "ROMC4"], clock = "WRITE", edge = "rise" },
  { data = ["DB0", "DB1", "DB2", "DB3", "DB4", "DB5", "DB6", "DB7"], clock = "WRITE", edge = "fall" },
]

# The echoir sample's interrupt: #INTREQ asserts, the CPU acknowledges
# and runs the handler.
[f3850-echoitr]
 0 = { pin = "P10", signal = "DB0" }
 1 = { pin = "P11", signal = "DB1" }
 2 = { pin = "P12", signal = "DB2" }
 3 = { pin = "P13", signal = "DB3" }
 4 = { pin = "P14", signal = "DB4" }
 5 = { pin = "P15", signal = "DB5" }
 6 = { pin = "P16", signal = "DB6" }
 7 = { pin = "P17", signal = "DB7" }
 8 = { pin = "P40", signal = "ROMC0" }
 9 = { pin = "P41", signal = "ROMC1" }
10 = { pin = "P42", signal = "ROMC2" }
11 = { pin = "P43", signal = "ROMC3" }
12 = { pin = "P46", signal = "ROMC4" }
13 = { pin = "P50", signal = "PHI" }
14 = { pin = "P51", signal = "WRITE" }
15 = { pin = "P54", signal = "#INTREQ" }
trigger = { signal = "#INTREQ", edge = "fall", before = 10e-6, after = 29e-3, long = true }
display = ["PHI", "WRITE", "ROMC0", "ROMC1", "ROMC2", "ROMC3", "ROMC4", "#INTREQ", "DB0", "DB1", "DB2", "DB3", "DB4", "DB5", "DB6", "DB7"]
parallel = [
  { data = ["ROMC0", "ROMC1", "ROMC2", "ROMC3", "ROMC4"], clock = "WRITE", edge = "rise" },
  { data = ["DB0", "DB1", "DB2", "DB3", "DB4", "DB5", "DB6", "DB7"], clock = "WRITE", edge = "fall" },
]

# A halt and two steps: the echo sample runs until the halt port stops it.
# Its polling loop never stores, so the first store (ROMC 05H) is the
# halt's register save; each step's own save follows within a millisecond.
[f3850-step]
 0 = { pin = "P10", signal = "DB0" }
 1 = { pin = "P11", signal = "DB1" }
 2 = { pin = "P12", signal = "DB2" }
 3 = { pin = "P13", signal = "DB3" }
 4 = { pin = "P14", signal = "DB4" }
 5 = { pin = "P15", signal = "DB5" }
 6 = { pin = "P16", signal = "DB6" }
 7 = { pin = "P17", signal = "DB7" }
 8 = { pin = "P40", signal = "ROMC0" }
 9 = { pin = "P41", signal = "ROMC1" }
10 = { pin = "P42", signal = "ROMC2" }
11 = { pin = "P43", signal = "ROMC3" }
12 = { pin = "P46", signal = "ROMC4" }
13 = { pin = "P50", signal = "PHI" }
14 = { pin = "P51", signal = "WRITE" }
15 = { pin = "P54", signal = "#INTREQ" }
trigger = { signal = "WRITE", edge = "fall", when = { ROMC0 = "high", ROMC1 = "low", ROMC2 = "high", ROMC3 = "low", ROMC4 = "low" }, before = 30e-6, after = 2e-3 }
display = ["PHI", "WRITE", "ROMC0", "ROMC1", "ROMC2", "ROMC3", "ROMC4", "#INTREQ", "DB0", "DB1", "DB2", "DB3", "DB4", "DB5", "DB6", "DB7"]
parallel = [
  { data = ["ROMC0", "ROMC1", "ROMC2", "ROMC3", "ROMC4"], clock = "WRITE", edge = "rise" },
  { data = ["DB0", "DB1", "DB2", "DB3", "DB4", "DB5", "DB6", "DB7"], clock = "WRITE", edge = "fall" },
]
