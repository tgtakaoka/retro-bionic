# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# Documented RESET effects (F8 and F3870 Guide to Programming, PDF p.68):
# PC0 reset to 0000 and ICB cleared. The dump prints PC0 as P0 -- also
# the label every PC check parses (program_counter).
[reset]
program_counter = "P0"
P0 = "0000"

# The same 32-case list as CDP1802's.
[arith]
expect = """
0 - -28000 = 28000
0 - 28000 = -28000
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
18000 - -28000 = -19536
18000 - -18000 = -29536
-28000 - -18000 = -10000
100 * 300 = 30000
200 * -100 = -20000
300 * -200 = 5536
-100 * 300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
18000 = 18000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# A full frame is minutes on this target -- lines halts mid-run once
# enough rows have printed to check against the golden reference.
# 6 lines = 'G's own reply line + 5 complete drawn rows.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
