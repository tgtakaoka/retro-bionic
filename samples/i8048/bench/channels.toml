# Channel labels for the P8048. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.

[i8048]
 0 = { pin = "P10", signal = "DB0" }
 1 = { pin = "P11", signal = "DB1" }
 2 = { pin = "P12", signal = "DB2" }
 3 = { pin = "P13", signal = "DB3" }
 4 = { pin = "P14", signal = "DB4" }
 5 = { pin = "P15", signal = "DB5" }
 6 = { pin = "P16", signal = "DB6" }
 7 = { pin = "P17", signal = "DB7" }
 8 = { pin = "P40", signal = "#PROG" }
 9 = { pin = "P41", signal = "#PSEN" }
10 = { pin = "P42", signal = "#RD" }
11 = { pin = "P43", signal = "#WR" }
12 = { pin = "P46", signal = "XTAL1" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P54", signal = "#INT" }
15 = { pin = "P55", signal = "ALE" }
