# Channel labels for the P8048. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[i8048]
 0 = "DB0"     # P10
 1 = "DB1"     # P11
 2 = "DB2"     # P12
 3 = "DB3"     # P13
 4 = "DB4"     # P14
 5 = "DB5"     # P15
 6 = "DB6"     # P16
 7 = "DB7"     # P17
 8 = "#PROG"   # P40
 9 = "#PSEN"   # P41
10 = "#RD"     # P42
11 = "#WR"     # P43
12 = "XTAL1"   # P46
13 = "#RESET"  # P53
14 = "#INT"    # P54
15 = "ALE"     # P55
