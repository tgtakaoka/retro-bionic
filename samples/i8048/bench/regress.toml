# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for.
chips = ["P8039", "MSM80C39"]

# Documented RESET effects (Grokking MCS-48 System, PDF p.13): PC and SP
# cleared, register bank 0 and memory bank 0 selected, F0 and F1
# cleared.
# The MSM80C48 data sheet documents only PC 000 (p.10) and interrupts
# disabled (p.3); the MSM80C39 clears SP, BS, MB, F0 and F1 too, as seen
# by setting each to 1 before a RESET.
[reset]
program_counter = "PC"
PC = "000"
SP = "0"
BS = "0"
MB = "0"
F0 = "0"
F1 = "0"

# This arith.asm runs its own 30 cases, not the list other targets use.
# Derived from its test table (every "; answer" comment agrees).
[arith]
expect = """
0 - -28000 = 28000
0 - 28000 = -28000
18000 + 28000 = -19536
18000 + -18000 = 0
-28000 + -18000 = 19536
-18000 - -28000 = 10000
18000 - -18000 = -29536
-28000 - -18000 = -10000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
-200 / 100 = -2
30000 / 100 = 300
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -18000
18000 = 18000
-18000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r -- the same format as the other targets'.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
lines = 6

# A random halt point, not always the same one, catches a corrupted
# resume that only shows up mid-instruction.
[haltgo]
program = "mandelbrot"
halt_interval = [0.05, 0.3]

[breakpoint]
program = "mandelbrot"
break_at = "loop_x"

[gountil]
program = "mandelbrot"
break_at = "loop_x"
