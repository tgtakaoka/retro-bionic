# Channel labels for the DCT11 and DCJ11 boards, the same leads on both.
# Verify against the wiring before trusting it -- a lead moved on the
# bench leaves this stale.

# A run, the leads for clock tuning: the address high byte with every
# strobe, and the interrupt request on AI5.
[dct11-run]
 0 = { pin = "P20", signal = "DAL08" }
 1 = { pin = "P21", signal = "DAL09" }
 2 = { pin = "P22", signal = "DAL10" }
 3 = { pin = "P23", signal = "DAL11" }
 4 = { pin = "P24", signal = "DAL12" }
 5 = { pin = "P25", signal = "DAL13" }
 6 = { pin = "P26", signal = "DAL14" }
 7 = { pin = "P27", signal = "DAL15" }
 8 = { pin = "P34", signal = "#RAS" }
 9 = { pin = "P35", signal = "#CAS" }
10 = { pin = "P36", signal = "R/#WLB" }
11 = { pin = "P37", signal = "R/#WHB" }
12 = { pin = "P43", signal = "AI5" }
13 = { pin = "P46", signal = "COUT" }
14 = { pin = "P47", signal = "XTL1" }
15 = { pin = "P50", signal = "PI" }
trigger = { signal = "#RAS", edge = "fall", before = 20e-6, after = 2e-3 }
display = ["XTL1", "COUT", "#RAS", "#CAS", "R/#WLB", "R/#WHB", "PI", "AI5", "DAL08", "DAL09", "DAL10", "DAL11", "DAL12", "DAL13", "DAL14", "DAL15"]

# A reset, from the PUP fall that the manual times it by: PUP high 100us,
# then #BCLR low while the board drives the mode
# register, 153377, on DAL; the first fetch, SEL0 high, is at 173000.
[dct11-reset]
 0 = { pin = "P22", signal = "DAL10" }
 1 = { pin = "P23", signal = "DAL11" }
 2 = { pin = "P24", signal = "DAL12" }
 3 = { pin = "P25", signal = "DAL13" }
 4 = { pin = "P26", signal = "DAL14" }
 5 = { pin = "P27", signal = "DAL15" }
 6 = { pin = "P30", signal = "SEL0" }
 7 = { pin = "P34", signal = "#RAS" }
 8 = { pin = "P35", signal = "#CAS" }
 9 = { pin = "P36", signal = "R/#WLB" }
10 = { pin = "P37", signal = "R/#WHB" }
11 = { pin = "P46", signal = "COUT" }
12 = { pin = "P47", signal = "XTL1" }
13 = { pin = "P50", signal = "PI" }
14 = { pin = "P52", signal = "#BCLR" }
15 = { pin = "P53", signal = "PUP" }
trigger = { signal = "PUP", edge = "fall", before = 50e-6, after = 150e-6 }
display = ["XTL1", "COUT", "SEL0", "#RAS", "#CAS", "R/#WLB", "R/#WHB", "PI", "PUP", "#BCLR", "DAL10", "DAL11", "DAL12", "DAL13", "DAL14", "DAL15"]
parallel = [
  { data = ["DAL10", "DAL11", "DAL12", "DAL13", "DAL14", "DAL15"], clock = "#RAS", edge = "fall" },
]

# Six steps of mandelbrot halted by the halt port: each the restore
# sequence, the instruction with its fetch on SEL0, the trace trap pushing
# the PS and PC and reading vector 14 (DAL low byte 014), the restart fetch
# at 173004 and the register save.
[dct11-step]
 0 = { pin = "P10", signal = "DAL00" }
 1 = { pin = "P11", signal = "DAL01" }
 2 = { pin = "P12", signal = "DAL02" }
 3 = { pin = "P13", signal = "DAL03" }
 4 = { pin = "P14", signal = "DAL04" }
 5 = { pin = "P15", signal = "DAL05" }
 6 = { pin = "P16", signal = "DAL06" }
 7 = { pin = "P17", signal = "DAL07" }
 8 = { pin = "P30", signal = "SEL0" }
 9 = { pin = "P34", signal = "#RAS" }
10 = { pin = "P35", signal = "#CAS" }
11 = { pin = "P36", signal = "R/#WLB" }
12 = { pin = "P37", signal = "R/#WHB" }
13 = { pin = "P46", signal = "COUT" }
14 = { pin = "P47", signal = "XTL1" }
15 = { pin = "P50", signal = "PI" }
trigger = { signal = "#RAS", edge = "fall", before = 50e-6, after = 1.13e-3 }
display = ["XTL1", "COUT", "SEL0", "#RAS", "#CAS", "R/#WLB", "R/#WHB", "PI", "DAL00", "DAL01", "DAL02", "DAL03", "DAL04", "DAL05", "DAL06", "DAL07"]
parallel = [
  { data = ["DAL00", "DAL01", "DAL02", "DAL03", "DAL04", "DAL05", "DAL06", "DAL07"], clock = "#RAS", edge = "fall" },
]

# An interrupt: the board drops AI3, AI4 and AI5 (CP1, CP0 and #VEC) for
# level 4; the IACK strobes #RAS with SEL1 high and takes the vector,
# 060, from DAL7-DAL2; then the vector reads and the handler.
[dct11-echoitr]
 0 = { pin = "P12", signal = "DAL02" }
 1 = { pin = "P13", signal = "DAL03" }
 2 = { pin = "P14", signal = "DAL04" }
 3 = { pin = "P15", signal = "DAL05" }
 4 = { pin = "P16", signal = "DAL06" }
 5 = { pin = "P30", signal = "SEL0" }
 6 = { pin = "P31", signal = "SEL1" }
 7 = { pin = "P34", signal = "#RAS" }
 8 = { pin = "P35", signal = "#CAS" }
 9 = { pin = "P36", signal = "R/#WLB" }
10 = { pin = "P37", signal = "R/#WHB" }
11 = { pin = "P41", signal = "AI3" }
12 = { pin = "P42", signal = "AI4" }
13 = { pin = "P43", signal = "AI5" }
14 = { pin = "P47", signal = "XTL1" }
15 = { pin = "P50", signal = "PI" }
trigger = { signal = "AI5", edge = "fall", before = 50e-6, after = 5.93e-3 }
display = ["XTL1", "SEL0", "SEL1", "#RAS", "#CAS", "R/#WLB", "R/#WHB", "PI", "AI3", "AI4", "AI5", "DAL02", "DAL03", "DAL04", "DAL05", "DAL06"]
