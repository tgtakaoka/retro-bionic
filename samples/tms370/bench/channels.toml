# Channel labels for the TMS370Cx5x, speculated from the Bionic
# Connector's pinout (data bus plus the bus-cycle status/strobe
# signals judged most useful for debugging) rather than captured from
# real activity. Confirm every channel before trusting it. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[tms370]
 0 = "DATA0"     # P10
 1 = "DATA1"     # P11
 2 = "DATA2"     # P12
 3 = "DATA3"     # P13
 4 = "DATA4"     # P14
 5 = "DATA5"     # P15
 6 = "DATA6"     # P16
 7 = "DATA7"     # P17
 8 = "R/#W"      # P41
 9 = "#EDS"      # P40
10 = "#OCF"      # P42
11 = "CLKIN"     # P46
12 = "INT1"      # P50
13 = "#RESET"    # P53
14 = "#WAIT"     # P54
15 = "debug"     # P56
