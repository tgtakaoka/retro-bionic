# Channel labels for the TMS370Cx5x, checked against a reset: #EDS
# strobes every external access, #OCF marks the opcode fetches and R/#W
# the writes, CLKIN is the clock the debugger drives, SYSCLK runs while
# #WAIT lets the CPU go, and #RESET pulses low. Verify against the wiring
# before trusting it -- a lead moved on the bench leaves this stale.
# '# Pxx' comments are that channel's pin name on the Bionic Connector.
[tms370]
 0 = "DATA0"   # P10
 1 = "DATA1"   # P11
 2 = "DATA2"   # P12
 3 = "DATA3"   # P13
 4 = "DATA4"   # P14
 5 = "DATA5"   # P15
 6 = "DATA6"   # P16
 7 = "DATA7"   # P17
 8 = "#EDS"    # P40
 9 = "R/#W"    # P41
10 = "#OCF"    # P42
11 = "CLKIN"   # P46
12 = "SYSCLK"  # P47
13 = "INT1"    # P50
14 = "#RESET"  # P53
15 = "#WAIT"   # P54
