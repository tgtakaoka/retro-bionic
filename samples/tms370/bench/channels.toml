# Channel labels for the TMS370Cx5x, checked against a reset: #EDS strobes
# every external access, #OCF marks the opcode fetches and R/#W the writes,
# CLKIN is the clock the debugger drives, SYSCLK runs while #WAIT lets the
# CPU go, and #RESET pulses low. Verify against the wiring before trusting
# it -- a lead moved on the bench leaves this stale.
[tms370]
 0 = { pin = "P10", signal = "DATA0" }
 1 = { pin = "P11", signal = "DATA1" }
 2 = { pin = "P12", signal = "DATA2" }
 3 = { pin = "P13", signal = "DATA3" }
 4 = { pin = "P14", signal = "DATA4" }
 5 = { pin = "P15", signal = "DATA5" }
 6 = { pin = "P16", signal = "DATA6" }
 7 = { pin = "P17", signal = "DATA7" }
 8 = { pin = "P40", signal = "#EDS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P42", signal = "#OCF" }
11 = { pin = "P46", signal = "CLKIN" }
12 = { pin = "P47", signal = "SYSCLK" }
13 = { pin = "P50", signal = "INT1" }
14 = { pin = "P53", signal = "#RESET" }
15 = { pin = "P54", signal = "#WAIT" }
