# Channel labels for the IM6100 and HD6120, speculated from the Bionic
# Connector's pinout (data bus plus the bus-cycle status/strobe signals
# judged most useful for debugging) rather than captured from real
# activity. Confirm every channel before trusting it. '# Pxx' comments
# are that channel's pin name on the Bionic Connector.

[im6100]
 0 = "DX11"    # P10
 1 = "DX10"    # P11
 2 = "DX9"     # P12
 3 = "DX8"     # P13
 4 = "DX7"     # P14
 5 = "DX6"     # P15
 6 = "DX5"     # P16
 7 = "DX4"     # P17
 8 = "IFETCH"  # P32
 9 = "LXMAR"   # P34
10 = "DATAF"   # P35
11 = "LINK"    # P44
12 = "RUN"     # P45
13 = "#RESET"  # P53
14 = "#WAIT"   # P54
15 = "debug"   # P56

[hd6120]
 0 = "DX11"      # P10
 1 = "DX10"      # P11
 2 = "DX9"       # P12
 3 = "DX8"       # P13
 4 = "DX7"       # P14
 5 = "DX6"       # P15
 6 = "DX5"       # P16
 7 = "DX4"       # P17
 8 = "#IFETCH"   # P32
 9 = "#WRITE"    # P30
10 = "#READ"     # P31
11 = "#DATAF"    # P34
12 = "STRTUP"    # P44
13 = "RUN/#HLT"  # P55
14 = "#RESET"    # P53
15 = "debug"     # P56
