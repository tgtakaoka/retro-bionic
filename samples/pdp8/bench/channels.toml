# Channel labels for the IM6100, checked against a reset: LXMAR starts
# each bus cycle, IFETCH marks the fetches, the first at 7777 (DX6-DX11 are
# the low two octal digits), XTB, XTC and #MEMSEL pulse within every
# cycle, OSCOUT is the clock the debugger drives, and #RESET pulses low.
# The HD6120 board uses the same leads. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.
[im6100]
 0 = "DX11"     # P10
 1 = "DX10"     # P11
 2 = "DX9"      # P12
 3 = "DX8"      # P13
 4 = "DX7"      # P14
 5 = "DX6"      # P15
 6 = "XTB"      # P30
 7 = "XTC"      # P31
 8 = "IFETCH"   # P32
 9 = "LXMAR"    # P34
10 = "#MEMSEL"  # P40
11 = "#DEVSEL"  # P41
12 = "#SWSEL"   # P43
13 = "OSCOUT"   # P47
14 = "#INTREQ"  # P51
15 = "#RESET"   # P53

# The HD6120 on the same leads, checked against a reset the same way:
# its strobes are active low and held while its static clock is stopped,
# #LXMAR falls with the address, the first fetch at 7777.
[hd6120]
 0 = "DX11"     # P10
 1 = "DX10"     # P11
 2 = "DX9"      # P12
 3 = "DX8"      # P13
 4 = "DX7"      # P14
 5 = "DX6"      # P15
 6 = "#WRITE"   # P30
 7 = "#READ"    # P31
 8 = "#IFETCH"  # P32
 9 = "#DATAF"   # P34
10 = "#LXMAR"   # P40
11 = "#LXDAR"   # P41
12 = "#MEMSEL"  # P43
13 = "OSCIN"    # P47
14 = "#INTREQ"  # P51
15 = "#RESET"   # P53
