# Channel labels for the IM6100, checked against a reset: LXMAR starts each
# bus cycle, IFETCH marks the fetches, the first at 7777 (DX6-DX11 are the
# low two octal digits), XTB, XTC and #MEMSEL pulse within every cycle,
# OSCOUT is the clock the debugger drives, and #RESET pulses low. The HD6120
# board uses the same leads. Verify against the wiring before trusting it --
# a lead moved on the bench leaves this stale.
[im6100]
 0 = { pin = "P10", signal = "DX11" }
 1 = { pin = "P11", signal = "DX10" }
 2 = { pin = "P12", signal = "DX9" }
 3 = { pin = "P13", signal = "DX8" }
 4 = { pin = "P14", signal = "DX7" }
 5 = { pin = "P15", signal = "DX6" }
 6 = { pin = "P30", signal = "XTB" }
 7 = { pin = "P31", signal = "XTC" }
 8 = { pin = "P32", signal = "IFETCH" }
 9 = { pin = "P34", signal = "LXMAR" }
10 = { pin = "P40", signal = "#MEMSEL" }
11 = { pin = "P41", signal = "#DEVSEL" }
12 = { pin = "P43", signal = "#SWSEL" }
13 = { pin = "P47", signal = "OSCOUT" }
14 = { pin = "P51", signal = "#INTREQ" }
15 = { pin = "P53", signal = "#RESET" }

# The HD6120 on the same leads, checked against a reset the same way:
# its strobes are active low and held while its static clock is stopped,
# #LXMAR falls with the address, the first fetch at 7777.
[hd6120]
 0 = { pin = "P10", signal = "DX11" }
 1 = { pin = "P11", signal = "DX10" }
 2 = { pin = "P12", signal = "DX9" }
 3 = { pin = "P13", signal = "DX8" }
 4 = { pin = "P14", signal = "DX7" }
 5 = { pin = "P15", signal = "DX6" }
 6 = { pin = "P30", signal = "#WRITE" }
 7 = { pin = "P31", signal = "#READ" }
 8 = { pin = "P32", signal = "#IFETCH" }
 9 = { pin = "P34", signal = "#DATAF" }
10 = { pin = "P40", signal = "#LXMAR" }
11 = { pin = "P41", signal = "#LXDAR" }
12 = { pin = "P43", signal = "#MEMSEL" }
13 = { pin = "P47", signal = "OSCIN" }
14 = { pin = "P51", signal = "#INTREQ" }
15 = { pin = "P53", signal = "#RESET" }
