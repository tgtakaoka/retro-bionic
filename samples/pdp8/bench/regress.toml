# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# ATTENTION: no [reset] section yet; add one with the documented reset
# register values, cited from the CPU manual.
# ATTENTION: [haltgo]/[breakpoint]/[gountil] need bionic-regress.py to
# read octal PCs and `label,` definitions. The HD-6120 data sheet gives PC=7777
# and AC, LINK, MQ cleared, but the IM6100 prints its PC in a different width.

# arith.asm computes in 24 bits, so sums and products don't wrap at 16.
[arith]
expect = """
18000 + 28000 = 46000
18000 + -18000 = 0
-18000 + -18000 = -36000
-18000 - -28000 = 10000
18000 - -18000 = 36000
-28000 - -18000 = -10000
100 * 300 = 30000
200 * 300 = 60000
300 * -200 = -60000
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
-28000 = -28000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
frames = 1
