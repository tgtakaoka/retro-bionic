# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for: the
# BionicNS32016 board and the BionicNS32081 board with the FPU.
chips = ["NS32016", "NS32081"]

# Reset clears PC and PSR; the CPU fetches from 0.
[reset]
PC = "000000"

[arith]
expect = """
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
100 * 300 = 30000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
-48 < 30
30 > -48
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
18000 = 18000
-28000 < 18000"""

[echo]
feed = "ok\r"
expect = "ok"

[echoir]
feed = "irq\r"
expect = "irq"

# Prints "<char> 0xXX 0bXXXXXXXX" per received byte, one line each
# including the trailing \r.
[echoitr]
feed = "itr\r"
expect = """
i 0x69 0b01101001
t 0x74 0b01110100
r 0x72 0b01110010
 0x0D 0b00001101"""

# One frame, checked whole.
[mandelbrot]
golden = "samples/arith/mandelbrot.golden"
frames = 1

# SETCFG [F]: on a board without the FPU the CPU would wait for it
# forever.
[fmandel]
golden = "samples/arith/fmandel.golden"
frames = 1
chips = ["NS32081"]

[haltgo]
program = "mandelbrot"

# loop_y is reached once per row, so each go runs a whole row rather
# than a single pixel.
[breakpoint]
program = "mandelbrot"
break_at = "loop_y"

[gountil]
program = "mandelbrot"
break_at = "loop_y"
