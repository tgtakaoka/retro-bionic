# Channel labels for the TMP90C802, checked against a reset: #RESET pulses
# low, X1 runs while the debugger clocks the static CPU and CLK follows it,
# #RD pulses every bus cycle with data on D0-D7, #WR and #WAIT pulse on
# writes and waits. Verify against the wiring before trusting it -- a lead
# moved on the bench leaves this stale.
[tlcs90]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P46", signal = "X1" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P50", signal = "INT1" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "#WAIT" }
15 = { pin = "P53", signal = "#RESET" }

# Profiling leads, the layout every profiled board shares: drops #RESET,
# INT0.
[tlcs90-profile]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "#RD" }
 9 = { pin = "P41", signal = "#WR" }
10 = { pin = "P46", signal = "X1" }
11 = { pin = "P47", signal = "CLK" }
12 = { pin = "P50", signal = "INT1" }
13 = { pin = "P51", signal = "NMI" }
14 = { pin = "P56", signal = "debug" }
15 = { pin = "P52", signal = "#WAIT" }
