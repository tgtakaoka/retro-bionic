# Channel labels for the TMP90C802, checked against a reset: #RESET pulses
# low, X1 runs while the debugger clocks the static CPU and CLK follows it,
# #RD pulses every bus cycle with data on D0-D7, #WR and #WAIT pulse on
# writes and waits. Verify against the wiring before trusting it -- a lead
# moved on the bench leaves this stale. '# Pxx' comments are that channel's
# pin name on the Bionic Connector.
[tlcs90]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RD"     # P40
 9 = "#WR"     # P41
10 = "X1"      # P46
11 = "CLK"     # P47
12 = "INT1"    # P50
13 = "#NMI"    # P51
14 = "#WAIT"   # P52
15 = "#RESET"  # P53

# Profiling leads, the layout every profiled board shares: drops #RESET,
# INT0.
[tlcs90-profile]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RD"     # P40
 9 = "#WR"     # P41
10 = "X1"      # P46
11 = "CLK"     # P47
12 = "INT1"    # P50
13 = "NMI"     # P51
14 = "debug"   # P56
15 = "#WAIT"   # P52
