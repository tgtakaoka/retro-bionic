# Channel labels for the TMP90C802, speculated from the Bionic
# Connector's pinout (data bus low byte plus the bus-cycle status/strobe
# signals judged most useful for debugging) rather than captured from
# real activity. Confirm every channel before trusting it. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.

[tlcs90]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "#RD"     # P40
 9 = "#WR"     # P41
10 = "X1"      # P46
11 = "#RESET"  # P53
12 = "INT1"    # P50
13 = "INT0"    # P55
14 = "#WAIT"   # P52
15 = "debug"   # P56
