12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "DBE" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "R/#W", edge = "fall", before = 50e-6, after = 2.50e-3 }
