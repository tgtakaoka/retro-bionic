# Channel labels for the MC6800 (also MB8861) and MC6802 (also MB8870)
# boards. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale.

[mc6800]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "VMA" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "PHI1" }
11 = { pin = "P47", signal = "PHI2" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "DBE" }
15 = { pin = "P53", signal = "#RESET" }

[mc6802]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "VMA" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "EXTAL" }
11 = { pin = "P47", signal = "E" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "MR" }
15 = { pin = "P53", signal = "#RESET" }

# The reset sequence: #RESET negates, then the register save.
[mc6800-reset]
 0 = { pin = "P10", signal = "D0" }
 1 = { pin = "P11", signal = "D1" }
 2 = { pin = "P12", signal = "D2" }
 3 = { pin = "P13", signal = "D3" }
 4 = { pin = "P14", signal = "D4" }
 5 = { pin = "P15", signal = "D5" }
 6 = { pin = "P16", signal = "D6" }
 7 = { pin = "P17", signal = "D7" }
 8 = { pin = "P40", signal = "VMA" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P46", signal = "PHI1" }
11 = { pin = "P47", signal = "PHI2" }
12 = { pin = "P50", signal = "#IRQ" }
13 = { pin = "P51", signal = "#NMI" }
14 = { pin = "P52", signal = "DBE" }
15 = { pin = "P53", signal = "#RESET" }
trigger = { signal = "#RESET", edge = "rise", before = 50e-6, after = 91e-6 }
display = ["PHI1", "PHI2", "DBE", "VMA", "R/#W", "#IRQ", "#NMI", "#RESET", "D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"]
parallel = [
  { data = ["D0", "D1", "D2", "D3", "D4", "D5", "D6", "D7"], clock = "PHI2", edge = "fall" },
]

