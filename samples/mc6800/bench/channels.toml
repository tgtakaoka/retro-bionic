# Channel labels for the MC6800 (also MB8861) and MC6802 (also MB8870)
# boards. Verify against the wiring before trusting it -- a lead moved on
# the bench leaves this stale. '# Pxx' comments are that channel's pin
# name on the Bionic Connector.

[mc6800]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "VMA"     # P40
 9 = "R/#W"    # P41
10 = "PHI1"    # P46
11 = "PHI2"    # P47
12 = "#IRQ"    # P50
13 = "#NMI"    # P51
14 = "DBE"     # P52
15 = "#RESET"  # P53

[mc6802]
 0 = "D0"      # P10
 1 = "D1"      # P11
 2 = "D2"      # P12
 3 = "D3"      # P13
 4 = "D4"      # P14
 5 = "D5"      # P15
 6 = "D6"      # P16
 7 = "D7"      # P17
 8 = "VMA"     # P40
 9 = "R/#W"    # P41
10 = "EXTAL"   # P46
11 = "E"       # P47
12 = "#IRQ"    # P50
13 = "#NMI"    # P51
14 = "MR"      # P52
15 = "#RESET"  # P53
