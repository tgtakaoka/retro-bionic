# Channel labels for the Z86C91 and Z88C00, whose boards share these
# pins. The Z86C91 is checked against a reset: #AS latches each address on
# AD0-AD7 and #DS strobes its data, R/#W marks the writes, XTAL1 is the
# clock the debugger drives and #RESET pulses low; #IRQ0 is the ACIA's
# interrupt in both chips' samples. Verify against the wiring before
# trusting it -- a lead moved on the bench leaves this stale. '# Pxx'
# comments are that channel's pin name on the Bionic Connector.
#
# No regress.toml here: the Z86C91 and Z88C00 sample programs live
# under samples/z86/ and samples/z88/.
[z86c91]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "#AS"     # P40
 9 = "R/#W"    # P41
10 = "#IRQ0"   # P43
11 = "XTAL1"   # P46
12 = "#DS"     # P47
13 = "#RESET"  # P53
14 = "#DM"     # P55
15 = "debug"   # P56

# The Z88C00 on the same leads, checked against a reset the same way: its
# first address after reset is 0020.
[z88c00]
 0 = "AD0"     # P10
 1 = "AD1"     # P11
 2 = "AD2"     # P12
 3 = "AD3"     # P13
 4 = "AD4"     # P14
 5 = "AD5"     # P15
 6 = "AD6"     # P16
 7 = "AD7"     # P17
 8 = "#AS"     # P40
 9 = "R/#W"    # P41
10 = "#IRQ0"   # P43
11 = "XTAL1"   # P46
12 = "#DS"     # P47
13 = "#RESET"  # P53
14 = "#DM"     # P55
15 = "debug"   # P56
