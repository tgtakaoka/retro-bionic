# Channel labels for the Z86C91 and Z88C00, whose boards share these pins.
# The Z86C91 is checked against a reset: #AS latches each address on AD0-AD7
# and #DS strobes its data, R/#W marks the writes, XTAL1 is the clock the
# debugger drives and #RESET pulses low; #IRQ0 is the ACIA's interrupt in
# both chips' samples. Verify against the wiring before trusting it -- a
# lead moved on the bench leaves this stale.  No regress.toml here: the
# Z86C91 and Z88C00 sample programs live under samples/z86/ and
# samples/z88/.
[z86c91]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P43", signal = "#IRQ0" }
11 = { pin = "P46", signal = "XTAL1" }
12 = { pin = "P47", signal = "#DS" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P55", signal = "#DM" }
15 = { pin = "P56", signal = "debug" }

# The Z88C00 on the same leads, checked against a reset the same way: its
# first address after reset is 0020.
[z88c00]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P43", signal = "#IRQ0" }
11 = { pin = "P46", signal = "XTAL1" }
12 = { pin = "P47", signal = "#DS" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P55", signal = "#DM" }
15 = { pin = "P56", signal = "debug" }

# The reset sequence: #RESET negates, then the register save.
[z86c91-reset]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P43", signal = "#IRQ0" }
11 = { pin = "P46", signal = "XTAL1" }
12 = { pin = "P47", signal = "#DS" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P55", signal = "#DM" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "#RESET", edge = "rise", before = 50e-6, after = 151e-6 }
display = ["XTAL1", "#AS", "#DS", "R/#W", "#DM", "debug", "#IRQ0", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#AS", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#DS", edge = "rise" },
]

# Six steps of mandelbrot halted by the halt port, sent as one write:
# each step's restore, cycles and register save.
[z86c91-step]
 0 = { pin = "P10", signal = "AD0" }
 1 = { pin = "P11", signal = "AD1" }
 2 = { pin = "P12", signal = "AD2" }
 3 = { pin = "P13", signal = "AD3" }
 4 = { pin = "P14", signal = "AD4" }
 5 = { pin = "P15", signal = "AD5" }
 6 = { pin = "P16", signal = "AD6" }
 7 = { pin = "P17", signal = "AD7" }
 8 = { pin = "P40", signal = "#AS" }
 9 = { pin = "P41", signal = "R/#W" }
10 = { pin = "P43", signal = "#IRQ0" }
11 = { pin = "P46", signal = "XTAL1" }
12 = { pin = "P47", signal = "#DS" }
13 = { pin = "P53", signal = "#RESET" }
14 = { pin = "P55", signal = "#DM" }
15 = { pin = "P56", signal = "debug" }
trigger = { signal = "R/#W", edge = "fall", before = 50e-6, after = 1.04e-3 }
display = ["XTAL1", "#AS", "#DS", "R/#W", "#DM", "debug", "#IRQ0", "#RESET", "AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"]
parallel = [
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#AS", edge = "rise" },
  { data = ["AD0", "AD1", "AD2", "AD3", "AD4", "AD5", "AD6", "AD7"], clock = "#DS", edge = "rise" },
]

