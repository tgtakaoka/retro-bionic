# Channel labels for the Z86C91 and Z88C00, speculated from the Bionic
# Connector's pinout (data bus plus the bus-cycle status/strobe signals
# judged most useful for debugging) rather than captured from real
# activity. Confirm every channel before trusting it. '# Pxx' comments
# are that channel's pin name on the Bionic Connector.
#
# No regress.toml here: the Z86C91 and Z88C00 sample programs live
# under samples/z86/ and samples/z88/.

[z86c91]
 0 = "AD0"        # P10
 1 = "AD1"        # P11
 2 = "AD2"        # P12
 3 = "AD3"        # P13
 4 = "AD4"        # P14
 5 = "AD5"        # P15
 6 = "AD6"        # P16
 7 = "AD7"        # P17
 8 = "#AS"        # P40
 9 = "R/#W"       # P41
10 = "#DS"        # P47
11 = "XTAL1"      # P46
12 = "#RESET"     # P53
13 = "#IRQ1/P33"  # P42
14 = "#IRQ2/P31"  # P50
15 = "debug"      # P56

[z88c00]
 0 = "AD0"        # P10
 1 = "AD1"        # P11
 2 = "AD2"        # P12
 3 = "AD3"        # P13
 4 = "AD4"        # P14
 5 = "AD5"        # P15
 6 = "AD6"        # P16
 7 = "AD7"        # P17
 8 = "#AS"        # P40
 9 = "R/#W"       # P41
10 = "#DS"        # P47
11 = "XTAL1"      # P46
12 = "#RESET"     # P53
13 = "#IRQ0/P23"  # P43
14 = "#WAIT/P34"  # P52
15 = "debug"      # P56
