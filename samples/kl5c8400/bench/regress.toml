# How each sample must be driven. See scripts/bionic-regress.py's
# drive_table() for the key shapes this file can use.

# The chips, as their banners name them, this file is for. The board runs
# the KL5C8400 in KC80 mode, which takes interrupts in mode 1 only, so the
# Z80 samples needing mode 0 (echoitr) or mode 2 (mandelbrot) are left out.
chips = ["KL5C8400"]

# "When RESET_ goes inactive ("H"), opcode fetch cycle will be initiated,
# and starts from 0000H." and "IFF1, IFF2 flags and I, R registers are
# reset." (KL5C8400 data sheet, 6.5 Reset timing); R isn't printed.
[reset]
PC = "0000"
I = "00"

[arith]
path = "samples/z80/arith.hex"
expect = """
18000 + 28000 = -19536
18000 + -18000 = 0
-18000 + -18000 = 29536
-18000 - -28000 = 10000
100 * 300 = 30000
300 * -200 = 5536
100 * -300 = -30000
-200 * -100 = 20000
-300 * 100 = -30000
3 * -32768 = -32768
30000 / 100 = 300
-200 / 100 = -2
-30000 / -200 = 150
-30000 / 78 = -384
-48 < 30
30 > -48
5000 > 4000
5000 = 5000
4000 < 5000
-5000 < -4000
-5000 = -5000
-4000 > -5000
32700 > 32600
32700 = 32700
32600 < 32700
-32700 < -32600
-32700 = -32700
-32600 > -32700
18000 > -28000
18000 = 18000
-28000 < 18000"""

[echo]
path = "samples/z80/echo.hex"
feed = "ok\r"
expect = "ok"

[echoir]
path = "samples/z80/echoir.hex"
feed = "irq\r"
expect = "irq"

# Halts at the first completed frame, or once 6 rows are drawn and at
# least 20 seconds have passed; checks everything drawn so far.
[mandelbrot_mode1]
path = "samples/z80/mandelbrot_mode1.hex"
golden = "samples/arith/mandelbrot.golden"
lines = 6

[haltgo]
program = "mandelbrot_mode1"

[breakpoint]
program = "mandelbrot_mode1"
break_at = "loop_x"

[gountil]
program = "mandelbrot_mode1"
break_at = "loop_x"
