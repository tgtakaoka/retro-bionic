; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./debugger
include_dir = ./debugger
default_envs = teensy41

[env]
extra_scripts = ${sysenv.GITHUB_ACTIONS == 'true' ? "" "pre:scripts/setup_compiledb.py"}
lib_deps =
	tgtakaoka/libcli@1.5.1
	tgtakaoka/libasm@1.6.66

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D TEENSY_OPT_FAST_LTO -D USB_DUAL_SERIAL
upload_protocol = teensy-cli

; The profile image for scripts/record-cycles.py: every target's run loop
; prints each bus cycle with the marks its tables gave it.
[env:teensy41-profile]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -D PROFILE_CYCLES

; Host-side unit tests: `pio test -e native` (or `make test`). Only the
; target-independent pieces build here, so no Arduino, libcli or libasm;
; the Z280 cycle matcher qualifies, and test/z280/ replays bench dumps
; through it.
; Test-only: `pio run -e native` has no main to link, which is why CI
; names teensy41 explicitly.
[env:native]
platform = native
test_framework = unity
build_src_filter = +<cycles.cpp> +<signals.cpp> +<char_buffer.cpp> +<z280/inst_z280.cpp>
lib_deps =
extra_scripts =
test_build_src = yes
